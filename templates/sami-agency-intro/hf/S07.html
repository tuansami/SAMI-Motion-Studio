<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css">
<link rel="stylesheet" href="_fonts/inter/600.css">
<link rel="stylesheet" href="_fonts/inter/700.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css">
<link rel="stylesheet" href="hf/parts/intro.css">
<style>
  /* S07 · 04 Reservierung + 05 Bestellung: 2 điện thoại thao tác thật theo nhịp → "Reserviert" / "Bestellt" */
  #chap { left: var(--safe-side); top: calc(var(--safe-top) + 4px); font-size: 32px; gap: 14px; }
  #chap b + span { margin-right: 22px; }
  .ph2 { top: 330px; width: 452px; height: 930px; }
  #pL { left: 52px; } #pR { right: 52px; }
  .scr { color: #1c1b23; font-family: var(--f-ui); }
  .cap { position: absolute; top: 1290px; width: 452px; font-size: 52px; line-height: 1.08; }
  #cL { left: 52px; } #cR { right: 52px; }
  /* đặt bàn */
  .hero { position: absolute; left: 0; right: 0; top: 0; height: 250px; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.6)); }
  .hero b { position: absolute; left: 26px; bottom: 20px; z-index: 2; font: 700 38px "Playfair Display", serif; color: #fff; }
  .body { position: absolute; left: 0; right: 0; top: 250px; bottom: 0; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; background: #fbf8f4; }
  .days { display: flex; gap: 8px; }
  .day { flex: 1; height: 82px; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 2px #e6e0d8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 18px var(--f-ui); color: #6e6d7a; }
  .day b { font: 700 26px var(--f-ui); color: #1c1b23; }
  .day.on { background: #6B4E2E; box-shadow: none; color: #f0e2cf; } .day.on b { color: #fff; }
  .ppl { display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 20px; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 2px #e6e0d8; font: 600 28px var(--f-ui); }
  .ppl .bt { width: 48px; height: 48px; border-radius: 50%; background: #f1ebe3; display: flex; align-items: center; justify-content: center; font: 600 32px var(--f-ui); color: #6B4E2E; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { height: 64px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 2px #e6e0d8; display: flex; align-items: center; justify-content: center; font: 600 24px var(--f-mono); }
  .slot.on { background: #6B4E2E; color: #fff; box-shadow: none; }
  .cta { height: 84px; border-radius: 20px; background: #232220; color: #fff; display: flex; align-items: center; justify-content: center; font: 700 28px var(--f-ui); margin-top: auto; }
  .done { position: absolute; inset: 0; background: rgba(35,34,32,.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #fff; opacity: 0; z-index: 10; text-align: center; padding: 0 30px; }
  .done .ok { width: 150px; height: 150px; border-radius: 50%; background: var(--grad); color: var(--c-navyDeep); padding: 34px; box-sizing: border-box; }
  .done b { font: 800 50px var(--f-head); }
  .done span { font: 500 26px/1.3 var(--f-ui); color: #d8cdbd; }
  /* đặt món */
  .ohd { position: absolute; left: 0; right: 0; top: 0; height: 160px; background: #232220; color: #fff; padding: 76px 26px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; }
  .ohd b { font: 700 34px "Playfair Display", serif; color: #C29B70; }
  .bag { position: relative; width: 50px; height: 50px; color: #fff; }
  .bag i { position: absolute; right: -10px; top: -10px; min-width: 32px; height: 32px; border-radius: 16px; background: var(--c-mint); color: var(--c-navyDeep); font: 700 20px/32px var(--f-ui); text-align: center; font-style: normal; }
  .olist { position: absolute; left: 0; right: 0; top: 160px; bottom: 0; padding: 20px 20px; display: flex; flex-direction: column; gap: 14px; background: #fbf8f4; }
  .oit { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 20px; padding: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.06); }
  .oit .im { width: 118px; height: 118px; border-radius: 14px; flex: none; }
  .oit b { flex: 1; font: 700 30px "Playfair Display", serif; }
  .oit .pl { width: 58px; height: 58px; border-radius: 50%; background: #232220; color: #fff; padding: 14px; box-sizing: border-box; flex: none; }
  .oit .q { font: 700 26px var(--f-mono); color: #6B4E2E; min-width: 34px; text-align: center; opacity: 0; }
  .pick { display: flex; align-items: center; gap: 12px; height: 70px; padding: 0 20px; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 2px #e6e0d8; font: 600 26px var(--f-ui); margin-top: auto; opacity: .45; }
  .pick .ic { width: 34px; height: 34px; color: #6B4E2E; }
  .touch { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(118,103,254,.35); border: 4px solid rgba(255,255,255,.95); z-index: 20; opacity: 0; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  [data-ratio="16x9"] #chap { left: 110px; top: 110px; }
  [data-ratio="16x9"] .ph2 { top: 110px; width: 400px; height: 840px; }
  [data-ratio="16x9"] #pL { left: 760px; } [data-ratio="16x9"] #pR { left: 1260px; right: auto; }
  [data-ratio="16x9"] .cap { width: 560px; font-size: 64px; }
  [data-ratio="16x9"] #cL { left: 110px; top: 260px; } [data-ratio="16x9"] #cR { left: 110px; right: auto; top: 560px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S07">
  <div class="story" data-copy="S07_story"></div>
  <div class="bg"></div><div class="dots"></div>
  <div id="chap" class="chapter"></div>
  <div id="pL" class="phone ph2"><div class="notch"></div><div class="scr">
    <div class="hero" data-img="S07_hero_photo"><b data-copy="S07_res"></b></div>
    <div class="body"><div class="days"></div><div class="ppl"><span class="bt">−</span><span id="pp"></span><span class="bt">+</span></div><div class="slots"></div><div class="cta" data-copy="S07_res"></div></div>
    <div class="done" id="dL"><div class="ok"></div><b data-copy="S07_done"></b><span id="dLs"></span></div>
  </div></div>
  <div id="pR" class="phone ph2"><div class="notch"></div><div class="scr">
    <div class="ohd"><b data-copy="S07_order"></b><div class="bag"><span class="bi"></span><i id="cnt">0</i></div></div>
    <div class="olist"><div class="pick"><span class="ic"></span><span data-copy="S07_pickup"></span></div><div class="cta" data-copy="S07_buy"></div></div>
    <div class="done" id="dR"><div class="ok"></div><b data-copy="S07_ordered"></b><span data-copy="S07_pickup"></span></div>
  </div></div>
  <div id="cL" class="cap head"></div>
  <div id="cR" class="cap head"></div>
</div>
<script src="hf/parts/sami-logo.js"></script>
<script src="hf/parts/intro.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), B = S.beat, $ = I.$;
  const ch = S.text('S07_chapter').split('|').map((x) => x.trim());
  $('#chap').innerHTML = '<b>' + ch[0] + '</b><span>' + ch[1] + '</span><b>' + ch[2] + '</b><span>' + ch[3] + '</span>';
  // lời 2 vế: "Reservieren … / Bestellen …"
  // " / " chia đôi: nửa đầu dưới điện thoại trái, nửa sau dưới điện thoại phải (4 dòng → mỗi bên 2 dòng)
  const parts = S.html('S07_head').split(/<br>/), half = Math.ceil(parts.length / 2);
  $('#cL').innerHTML = parts.slice(0, half).join('<br>'); $('#cR').innerHTML = parts.slice(half).join('<br>');
  // đặt bàn
  const days = S.text('S07_days').split('|'), dayEls = days.map((d, i) => I.el('div', 'day', $('.days'), '<span>' + d + '</span><b>' + (20 + i) + '</b>'));
  const slots = S.text('S07_slots').split('|').map((t) => t.trim()), want = S.text('S07_time');
  const slotEls = slots.map((t) => { const e = I.el('div', 'slot', $('.slots')); e.textContent = t; return e; });
  const pick = slotEls[Math.max(0, slots.indexOf(want))];
  const pplTxt = S.text('S07_people'), pplN = parseInt(pplTxt, 10) || 4;
  $('#pp').textContent = pplTxt.replace(/\d+/, String(pplN - 1));
  $('#dL .ok').innerHTML = I.icon('check', {sw: 3}); $('#dR .ok').innerHTML = I.icon('check', {sw: 3});
  $('#dLs').textContent = S.text('S07_day') + ' · ' + want + ' · ' + pplTxt;
  // đặt món
  const list = $('.olist'), pk = $('.pick');
  const items = [1, 2, 3].map((i) => { const e = I.el('div', 'oit', null, '<div class="im" data-img="S07_o' + i + '_photo"></div><b></b><span class="q">1</span><div class="pl">' + I.icon('plus', {sw: 3}) + '</div>'); e.querySelector('b').textContent = S.text('S07_o' + i); list.insertBefore(e, pk); return e; });
  $('.bag .bi').innerHTML = I.icon('bag'); $('.pick .ic').innerHTML = I.icon('cal');
  I.bindImgs();
  // chạm (vị trí tính theo màn hình điện thoại lúc dựng)
  const touch = (phone, el, at) => {
    const scr = phone.querySelector('.scr'), r = el.getBoundingClientRect(), s = scr.getBoundingClientRect();
    const t = I.el('div', 'touch', scr); t.style.left = (r.left - s.left + r.width / 2) + 'px'; t.style.top = (r.top - s.top + r.height / 2) + 'px';
    tl.fromTo(t, {scale: 1.6, opacity: 0}, {scale: 1, opacity: 1, duration: 0.12, immediateRender: false}, at);
    tl.to(t, {scale: 0.85, duration: 0.08}, at + 0.12); tl.to(t, {opacity: 0, scale: 1.3, duration: 0.25}, at + 0.22);
    tl.fromTo(el, {scale: 1}, {scale: 0.94, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false}, at + 0.1);
  };
  const L = $('#pL'), R = $('#pR');
  // trái: chọn ngày → +1 người → giờ → đặt
  const fr = dayEls[Math.min(4, dayEls.length - 1)];
  touch(L, fr, B(1.5)); tl.set(fr, {attr: {class: 'day on'}}, B(1.6));
  const plus = L.querySelectorAll('.ppl .bt')[1];
  touch(L, plus, B(2.5)); tl.set('#pp', {textContent: pplTxt}, B(2.6));
  touch(L, pick, B(3.5)); tl.set(pick, {attr: {class: 'slot on'}}, B(3.6));
  touch(L, L.querySelector('.cta'), B(4.5));
  tl.fromTo('#dL', {opacity: 0}, {opacity: 1, duration: 0.25}, B(4.85));
  tl.fromTo('#dL .ok', {scale: 0, rotation: -60}, {scale: 1, rotation: 0, duration: 0.4}, B(4.9));
  // phải: + 3 món, giỏ đếm, giờ lấy, đặt
  items.forEach((it, i) => { const at = B(2 + i * 1); touch(R, it.querySelector('.pl'), at); tl.set(it.querySelector('.q'), {opacity: 1}, at + 0.1); tl.set('#cnt', {textContent: String(i + 1)}, at + 0.12); tl.fromTo('#cnt', {scale: 1.6}, {scale: 1, duration: 0.25, immediateRender: false}, at + 0.12); });
  touch(R, pk, B(5)); tl.to(pk, {opacity: 1, duration: 0.1}, B(5.1));
  touch(R, R.querySelector('.cta'), B(5.9));
  tl.fromTo('#dR', {opacity: 0}, {opacity: 1, duration: 0.25}, B(6.25));
  tl.fromTo('#dR .ok', {scale: 0, rotation: -60}, {scale: 1, rotation: 0, duration: 0.4}, B(6.3));
  // vào (đặt sau cùng: vị trí chạm đo lúc điện thoại chưa bị dịch)
  S.arrive(tl, '#chap', B(0), {dist: 20, blur: 6, dur: 0.4});
  tl.fromTo([L, R], {y: 500, opacity: 0, rotation: (i) => (i ? 6 : -6)}, {y: 0, opacity: 1, rotation: 0, duration: 0.5, stagger: 0.12}, B(0));
  S.arrive(tl, S.words($('#cL')), B(0.6), {stagger: 0.06, dist: 30, dur: 0.4});
  S.arrive(tl, S.words($('#cR')), B(1.2), {stagger: 0.06, dist: 30, dur: 0.4});
  // dòng dẫn chuyện (chỉ bản kể chuyện có chữ; trống = ẩn)
  I.story(tl, B(6.8));
</script>
</body>
</html>
