<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/400.css">
<link rel="stylesheet" href="_fonts/inter/600.css">
<link rel="stylesheet" href="_fonts/inter/700.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css">
<link rel="stylesheet" href="_fonts/fraunces/700.css">
<link rel="stylesheet" href="_fonts/dm-serif-display/400.css">
<link rel="stylesheet" href="_fonts/bricolage-grotesque/700.css">
<link rel="stylesheet" href="_fonts/montserrat/700.css">
<link rel="stylesheet" href="_fonts/oswald/600.css">
<link rel="stylesheet" href="_fonts/cormorant/600.css">
<link rel="stylesheet" href="hf/parts/intro.css">
<style>
  /* S04 · 01 Branding: app thiết kế tự vẽ, tua nhanh 4 pha: vẽ nét logo vector thật (Pen) → phối bảng màu → chọn font → ráp brandkit thật.
   * Cuối cảnh: dấu "Brandkit fertig" + 3 brandkit thật của dự án khác trượt lên. */
  #chap { left: var(--safe-side); top: calc(var(--safe-top) + 4px); font-size: 34px; }
  #head { position: absolute; left: var(--safe-side); right: var(--safe-side); top: calc(var(--safe-top) + 80px); font-size: 78px; }
  #app { left: 40px; right: 40px; top: 540px; height: 960px; }
  #hud { right: 64px; top: 500px; }
  .app .panel { width: 210px; }
  .app .canvas { left: 78px; right: 214px; }
  .lay { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 20px; color: #bdb9d0; white-space: nowrap; }
  .lay i { width: 16px; height: 16px; border-radius: 4px; border: 2px solid #6e6a86; flex: none; }
  .lay.on { background: rgba(118,103,254,.28); color: #fff; } .lay.on i { border-color: var(--c-mint); background: var(--c-mint); }
  .pblock { margin-top: 22px; }
  #fillrow { display: flex; align-items: center; gap: 12px; font: 500 20px var(--f-mono); color: #fff; }
  #fillchip { width: 34px; height: 34px; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); }
  #fontname { font: 600 20px var(--f-ui); color: #fff; }
  #anchors { font: 500 26px var(--f-mono); color: var(--c-mint); }
  #stage { position: absolute; inset: 0; }
  #art { left: 50%; top: 74px; width: 500px; height: 500px; margin-left: -250px; background: #fff; }
  #artlbl { left: 50%; top: 40px; margin-left: -250px; }
  #grid, #logo { position: absolute; inset: 40px; }
  #logo svg, #grid svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .anc { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #fff; border: 2px solid var(--c-purple); opacity: 0; z-index: 6; }
  .hnd { position: absolute; height: 2px; background: var(--c-purple); transform-origin: 50% 50%; opacity: 0; z-index: 5; }
  .hnd::before, .hnd::after { content: ''; position: absolute; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c-purple); }
  .hnd::before { left: -6px; } .hnd::after { right: -6px; }
  #sws { position: absolute; left: 50%; top: 610px; width: 590px; margin-left: -295px; display: flex; gap: 22px; opacity: 0; }
  .swc { flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .swc .sw { width: 100%; height: 100px; }
  .swc span { font: 500 20px var(--f-mono); color: #d9d7e3; }
  #lock1 { position: absolute; left: 50%; top: 770px; margin-left: -150px; width: 300px; text-align: center; opacity: 0; }
  #spec { position: absolute; left: 50%; top: 600px; width: 600px; margin-left: -300px; display: flex; align-items: center; gap: 28px; opacity: 0; }
  #aa { font-size: 150px; line-height: 1; color: #fff; width: 230px; text-align: center; }
  #spec .r { display: flex; flex-direction: column; gap: 10px; }
  #sample { font-size: 44px; line-height: 1.1; color: #fff; }
  #fam { font: 500 22px var(--f-mono); color: var(--c-mint); }
  #board { position: absolute; inset: 0; }
  .kc { position: absolute; border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5); opacity: 0; }
  #stamp { position: absolute; left: 50%; top: 46%; z-index: 50; transform: translate(-50%, -50%) rotate(-8deg); padding: 18px 34px; border-radius: 22px; border: 6px solid var(--c-mint);
    background: rgba(6,3,26,.88); color: var(--c-mint); font: 800 52px var(--f-head); white-space: nowrap; display: flex; align-items: center; gap: 16px; opacity: 0; }
  #stamp .ic { width: 56px; height: 56px; }
  #fan { position: absolute; left: 40px; right: 40px; top: 1300px; height: 220px; }
  #fan .fc { position: absolute; top: 0; width: 310px; height: 210px; border-radius: 18px; box-shadow: var(--shadow); opacity: 0; }
  #preload { position: absolute; left: -9999px; top: 0; opacity: 0.01; }
  [data-ratio="16x9"] #chap { left: 110px; top: 120px; }
  [data-ratio="16x9"] #head { left: 110px; right: auto; width: 600px; top: 200px; font-size: 70px; }
  [data-ratio="16x9"] #app { left: 760px; right: auto; width: 1060px; top: 100px; height: 880px; }
  [data-ratio="16x9"] #hud { right: 120px; top: 64px; }
  [data-ratio="16x9"] #fan { left: 110px; right: auto; width: 600px; top: 620px; height: 300px; }
  [data-ratio="16x9"] #fan .fc { width: 270px; height: 182px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S04">
  <div class="bg"></div><div class="dots"></div>
  <div id="chap" class="chapter"></div>
  <div id="head" class="head" data-copy="S04_head"></div>
  <div id="app" class="app">
    <div class="top"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="file" data-copy="S04_file"></span><span class="tag">100 %</span></div>
    <div class="tools" id="tools"></div>
    <div class="canvas" id="canvas">
      <div id="stage">
        <div id="artlbl" class="art-label">Logo · 1080 × 1080 px</div>
        <div id="art" class="art"><div id="grid"></div><div id="logo"></div></div>
        <div id="sws"></div>
        <div id="lock1" class="chip"><i></i><span id="lock1t"></span></div>
        <div id="spec"><div id="aa">Aa</div><div class="r"><div id="sample" data-copy="S04_sample"></div><div id="fam"></div></div></div>
      </div>
      <div id="board"></div>
    </div>
    <div class="panel" id="panel">
      <h6 id="h-lay"></h6><div id="layers"></div>
      <div class="pblock"><h6 id="h-fill"></h6><div id="fillrow"><div id="fillchip"></div><span id="fillhex">#C29B70</span></div></div>
      <div class="pblock"><h6 id="h-font"></h6><div id="fontname">Inter</div></div>
      <div class="pblock"><h6 id="h-anc"></h6><div id="anchors">0</div></div>
    </div>
  </div>
  <div id="stamp"><div class="ic"></div><span data-copy="S04_done"></span></div>
  <div id="fan"></div>
  <div id="preload"></div>
</div>
<script src="hf/parts/sami-logo.js"></script>
<script src="hf/parts/intro.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), B = S.beat, $ = I.$;
  const UI = S.text('S04_ui').split('|').map((x) => x.trim());
  const [tEbenen, tFill, tFont, tRaster, tLogo, tPal, tTypo, tKit, tAnc] = UI;
  // nhãn chương
  const [num, name] = S.text('S04_chapter').split('|').map((x) => x.trim());
  $('#chap').innerHTML = '<b>' + num + '</b><span>' + name + '</span>';
  // khung app: công cụ + bảng
  const toolNames = ['move', 'pen', 'rect', 'type', 'drop', 'img'];
  toolNames.forEach((n) => I.el('div', 't', $('#tools'), I.icon(n)).dataset.t = n);
  $('#h-lay').textContent = tEbenen.toUpperCase(); $('#h-fill').textContent = tFill.toUpperCase(); $('#h-font').textContent = tFont.toUpperCase(); $('#h-anc').textContent = tAnc.toUpperCase();
  const layers = [tRaster, tLogo, tPal, tTypo, tKit].map((n) => { const r = I.el('div', 'lay', $('#layers'), '<i></i><span></span>'); r.querySelector('span').textContent = n; return r; });
  const hud = I.hud($('#root'), S.text('S04_ff'), 16); hud.id = 'hud';
  $('#stamp .ic').innerHTML = I.icon('check', {sw: 3});
  // font: nạp trước để khung nào cũng đúng font
  const FONTS = ['Fraunces', 'DM Serif Display', 'Bricolage Grotesque', 'Montserrat', 'Oswald', 'Cormorant', 'Inter'];
  const FINAL_FONT = S.text('S04_font') || 'Playfair Display';
  FONTS.concat([FINAL_FONT]).forEach((f) => { const s = I.el('span', '', $('#preload'), 'Aa Kitchen'); s.style.fontFamily = '"' + f + '"'; s.style.fontWeight = 700; });

  // ── logo vector thật (SVG trong thư viện) → vẽ nét bằng Pen ───────
  const art = $('#art'), logoBox = $('#logo');
  const svgTxt = I.svgText(I.src('S04_logo'));
  let paths = [];
  if (svgTxt) {
    logoBox.innerHTML = svgTxt.replace(/<\?xml[^>]*>/, '');
    const sv = logoBox.querySelector('svg'); sv.removeAttribute('width'); sv.removeAttribute('height'); sv.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    paths = I.$$('path, polygon, circle, rect, ellipse', sv).filter((p) => p.getTotalLength);
  } else { logoBox.innerHTML = '<img src="' + I.src('S04_logo') + '" style="width:100%;height:100%;object-fit:contain">'; }
  const PAL = (S.text('S04_palette') || '').split(/\s+/).filter(Boolean);
  const GOLD = PAL[1] || '#C29B70', DARK = PAL[2] || '#232220';
  paths.forEach((p) => { p.style.fill = GOLD; p.style.fillOpacity = 0; p.style.stroke = 'var(--c-purple)'; p.style.strokeWidth = '2.5px'; p.setAttribute('vector-effect', 'non-scaling-stroke'); });
  // lưới dựng hình
  const g = I.svg('svg', {viewBox: '0 0 420 420'}, $('#grid'));
  const gl = [];
  [[210, 210, 190], [210, 210, 120], [140, 210, 70], [280, 210, 70]].forEach((c) => gl.push(I.svg('circle', {cx: c[0], cy: c[1], r: c[2], fill: 'none', stroke: '#b9b0ff', 'stroke-width': 1.2, 'stroke-dasharray': '6 6'}, g)));
  [[0, 210, 420, 210], [210, 0, 210, 420], [0, 0, 420, 420], [420, 0, 0, 420]].forEach((l) => gl.push(I.svg('line', {x1: l[0], y1: l[1], x2: l[2], y2: l[3], stroke: '#d6d0ff', 'stroke-width': 1}, g)));

  // ── timeline con (tua nhanh, 7 s) ───────────────────────────────
  const ct = gsap.timeline({paused: true, defaults: {ease: S.EASE}}); ct.set({}, {}, 7);
  const tool = (n, at) => toolNames.forEach((t) => ct.set($('[data-t="' + t + '"]'), {attr: {class: 't' + (t === n ? ' on' : '')}}, at));
  const layer = (i, at) => layers.forEach((r, k) => ct.set(r, {attr: {class: 'lay' + (k === i ? ' on' : '')}}, at));
  // pha 1: lưới + Pen vẽ nét logo
  tool('pen', 0); layer(0, 0);
  ct.from(gl, {opacity: 0, scale: 0.6, transformOrigin: '50% 50%', duration: 0.3, stagger: 0.04}, 0);
  layer(1, 0.4);
  const cv = $('#canvas');
  const artX = () => art.offsetLeft, artY = () => art.offsetTop;
  if (paths.length) {
    const p0 = paths[0], L = paths.reduce((s, p) => s + p.getTotalLength(), 0);
    paths.forEach((p) => { const l = p.getTotalLength(); p.style.strokeDasharray = l; p.style.strokeDashoffset = l; });
    let acc = 0;
    paths.forEach((p) => { const l = p.getTotalLength(), a = 0.4 + 2.2 * acc / L; ct.to(p, {strokeDashoffset: 0, duration: 2.2 * l / L, ease: 'none'}, a); acc += l; });
    // điểm neo + tay nắm bezier + con trỏ Pen đi theo nét
    const N = 34, pts = [];
    const sv = logoBox.querySelector('svg');
    for (let i = 0; i <= N; i++) {
      const l = L * i / N; let rem = l, pp = paths[0];
      for (const p of paths) { const pl = p.getTotalLength(); if (rem <= pl) { pp = p; break; } rem -= pl; }
      const q = pp.getPointAtLength(Math.max(0, rem)), m = pp.getCTM(), ox = logoBox.offsetLeft, oy = logoBox.offsetTop;
      pts.push([ox + m.a * q.x + m.c * q.y + m.e, oy + m.b * q.x + m.d * q.y + m.f, pp, rem]);
    }
    pts.forEach((p, i) => {
      const at = 0.4 + 2.2 * i / N;
      const a = I.el('div', 'anc', art); a.style.left = p[0] + 'px'; a.style.top = p[1] + 'px';
      ct.set(a, {opacity: 1}, at);
      if (i % 7 === 3) {
        const q1 = p[2].getPointAtLength(Math.max(0, p[3] - 30)), q2 = p[2].getPointAtLength(p[3] + 30);
        const ang = Math.atan2(q2.y - q1.y, q2.x - q1.x) * 180 / Math.PI;
        const h = I.el('div', 'hnd', art); h.style.width = '120px'; h.style.left = (p[0] - 60) + 'px'; h.style.top = (p[1] - 1) + 'px'; h.style.transform = 'rotate(' + ang + 'deg)';
        ct.set(h, {opacity: 1}, at); ct.set(h, {opacity: 0}, at + 0.35);
      }
    });
    // con trỏ Pen
    const pen = I.cursor(ct, art, pts.map((p, i) => [p[0], p[1], 0.4 + 2.2 * i / N, i % 6 === 0]), {pen: true, size: 40});
    pen.style.opacity = 0; ct.set(pen, {opacity: 1}, 0.4);
    ct.to(pen, {opacity: 0, duration: 0.1}, 2.7);
    // số điểm neo đếm lên
    const an = $('#anchors'); for (let i = 0; i <= N; i++) ct.set(an, {textContent: String(Math.round(i * 128 / N))}, 0.4 + 2.2 * i / N);
    // tô màu
    ct.to(paths, {fillOpacity: 1, duration: 0.25}, 2.6);
    ct.to(paths, {strokeOpacity: 0, duration: 0.2}, 2.7);
    ct.to(I.$$('.anc', art), {opacity: 0, duration: 0.15}, 2.75);
    ct.to(gl, {opacity: 0, duration: 0.2}, 2.75);
  }
  // pha 2: phối bảng màu (nền artboard + màu logo đổi liên tục rồi chốt)
  const CAND = [
    ['#6A391C', '#D3AE76', '#700709', '#E87F61', '#265358'], ['#4B1F24', '#C9A27A', '#2A1D1A', '#F3E4D0', '#8C3B3D'],
    ['#1F3D36', '#D9B26F', '#22201F', '#F2EBDD', '#B5482E'], ['#2C2F6B', '#E4B363', '#1C1C1C', '#F5F0E6', '#C2413B'],
    ['#0F5257', '#F4A259', '#2B2D42', '#F2E8CF', '#BC4B51'], ['#3D2C2E', '#E0C097', '#151515', '#EFE6DD', '#7D5A50'],
    ['#264653', '#E9C46A', '#1D1E2C', '#F1FAEE', '#E76F51'], ['#5C3D2E', '#B85C38', '#2D2424', '#E0C097', '#C29B70']];
  const finalPal = PAL.length >= 5 ? PAL.slice(0, 5) : ['#6B4E2E', '#C29B70', '#232220', '#E0DCD3', '#D2D1CD'];
  const sws = $('#sws'), swc = finalPal.map(() => { const c = I.el('div', 'swc', sws, '<div class="sw"></div><span></span>'); return c; });
  const applyPal = (pal, at) => {
    swc.forEach((c, i) => { ct.set(c.firstChild, {backgroundColor: pal[i]}, at); ct.set(c.lastChild, {textContent: pal[i].toUpperCase()}, at); });
    ct.set(art, {backgroundColor: pal[2]}, at); if (paths.length) ct.set(paths, {fill: pal[1]}, at);
    ct.set('#fillchip', {backgroundColor: pal[1]}, at); ct.set('#fillhex', {textContent: pal[1].toUpperCase()}, at);
  };
  tool('drop', 2.9); layer(2, 2.9);
  ct.to('#art', {top: 60, duration: 0.2}, 2.9);
  ct.to(sws, {opacity: 1, duration: 0.15}, 2.9);
  CAND.forEach((pal, i) => applyPal(pal, 2.95 + i * 0.19));
  applyPal(finalPal, 2.95 + CAND.length * 0.19);
  const lockAt = 2.95 + CAND.length * 0.19;
  $('#lock1t').textContent = tPal + ' ✓';
  ct.fromTo('#lock1', {opacity: 0, scale: 1.4}, {opacity: 1, scale: 1, duration: 0.15}, lockAt);
  // pha 3: chọn font
  tool('type', 4.7); layer(3, 4.7);
  ct.to([sws, '#lock1'], {opacity: 0, duration: 0.1}, 4.65);
  ct.to('#spec', {opacity: 1, duration: 0.1}, 4.7);
  const aa = $('#aa'), sample = $('#sample'), fam = $('#fam'), fname = $('#fontname');
  FONTS.forEach((f, i) => { const at = 4.75 + i * 0.16; [aa, sample].forEach((e) => ct.set(e, {fontFamily: '"' + f + '"', fontWeight: 700}, at)); ct.set([fam, fname], {textContent: f}, at); });
  const fAt = 4.75 + FONTS.length * 0.16;
  [aa, sample].forEach((e) => ct.set(e, {fontFamily: '"' + FINAL_FONT + '"', color: finalPal[1]}, fAt));
  ct.set([fam, fname], {textContent: FINAL_FONT + ' · Inter'}, fAt);
  ct.fromTo('#spec', {scale: 1.12}, {scale: 1, duration: 0.15}, fAt);
  // pha 4: ráp brandkit từ ảnh thật
  tool('move', 6.0); layer(4, 6.0);
  ct.to('#stage', {opacity: 0, scale: 0.9, duration: 0.15}, 6.0);
  const board = $('#board'), cw = cv.offsetWidth, ch = cv.offsetHeight, pad = 26;
  const wide = S.landscape;
  const R = (x, y, w, h) => [pad + x * (cw - 2 * pad), pad + y * (ch - 2 * pad), w * (cw - 2 * pad), h * (ch - 2 * pad)];
  const lay = wide
    ? [R(0, 0, 1, 0.44), R(0, 0.47, 0.32, 0.53), R(0.34, 0.47, 0.32, 0.53), R(0.68, 0.47, 0.32, 0.53)]
    : [R(0, 0, 1, 0.42), R(0, 0.45, 0.47, 0.55), R(0.5, 0.45, 0.5, 0.26), R(0.5, 0.74, 0.5, 0.26)];
  const kits = [1, 2, 3, 4].map((k, i) => {
    const d = I.el('div', 'kc', board); d.setAttribute('data-img', 'S04_kit' + k + '_photo');
    const [x, y, w, h] = lay[i]; Object.assign(d.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'});
    return d;
  });
  I.bindImgs(board);
  kits.forEach((d, i) => ct.fromTo(d, {opacity: 0, scale: 0.7, x: (i % 2 ? 140 : -140)}, {opacity: 1, scale: 1, x: 0, duration: 0.18}, 6.08 + i * 0.17));
  const selb = I.el('div', 'sel', board); selb.style.opacity = 0;
  kits.forEach((d, i) => { const [x, y, w, h] = lay[i]; ct.set(selb, {left: x - 4, top: y - 4, width: w + 8, height: h + 8, opacity: 1}, 6.1 + i * 0.17); });
  ct.set(selb, {opacity: 0}, 6.9);

  // ── timeline chính ──────────────────────────────────────────────
  S.arrive(tl, '#chap', B(0), {dist: 20, blur: 6, dur: 0.4});
  tl.fromTo('#app', {y: 160, scale: 0.94, opacity: 0}, {y: 0, scale: 1, opacity: 1, duration: 0.55}, B(0));
  S.arrive(tl, S.words($('#head')), B(0.5), {stagger: 0.07, dist: 40, dur: 0.45});
  tl.fromTo(hud, {scale: 0.6, opacity: 0}, {scale: 1, opacity: 1, duration: 0.3}, B(1));
  I.clock(tl, hud, B(1), B(15) - B(1), 7.5);
  I.lapse(tl, ct, B(1), B(15) - B(1), 12);
  // xong: dấu + brandkit dự án khác trượt lên
  tl.to(hud, {opacity: 0, y: -20, duration: 0.3}, B(15.2));
  tl.fromTo('#stamp', {scale: 2.2, opacity: 0}, {scale: 1, opacity: 1, duration: 0.3}, B(15.2));
  I.shake(tl, '#app', B(15.3), {amp: 10, n: 6});
  const fan = $('#fan'), fw = fan.offsetWidth;
  [6, 7, 8].forEach((k, i) => {
    const c = I.el('div', 'fc', fan); c.setAttribute('data-img', 'S04_kit' + k + '_photo');
    const cwid = c.offsetWidth; c.style.left = (i * (fw - cwid) / 2) + 'px';
    tl.fromTo(c, {y: 320, rotation: (i - 1) * 10, opacity: 0}, {y: 0, rotation: (i - 1) * 4, opacity: 1, duration: 0.5}, B(16 + i * 0.5));
  });
  I.bindImgs(fan);
  tl.to('#app', {scale: S.pick({'16:9': 0.96, default: 0.8}), transformOrigin: '50% 0%', duration: 0.6}, B(15.8));
</script>
</body>
</html>
