<!doctype html>
<html lang="vi">
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/900.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="slides/_shared.css">
<style>
  /* C02 · 8 việc, một đầu mối — lưới 2 × 4 thẻ dịch vụ. Ghim vào từ trái, đáp thẻ 01 ở 1,0 s; thẻ sáng lần lượt theo nửa nhịp (lan như sóng);
   * ghim nhảy tới thẻ 08 ở 3,0 s (chime), rời sang phải ở 4,9 s. Khung 0: 8 thẻ hiện đủ. */
  #svc { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 16px; }
  .sv { position: relative; display: flex; align-items: center; gap: 18px; padding: 0 24px; border-radius: 24px; background: var(--k-bg2); border: 2px solid var(--k-line); box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
  .sv .n { font: 600 22px/1 var(--f-mono); color: var(--k-dim); letter-spacing: .08em; flex: none; }
  .sv .ic { width: 46px; height: 46px; color: var(--k-accent); flex: none; }
  .sv .t { font: 800 32px/1.15 var(--f-head); color: var(--k-ink); }
  .sv .lit { position: absolute; inset: -2px; border-radius: 24px; border: 3px solid var(--k-accent); box-shadow: 0 0 34px rgba(8, 221, 164, .35); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="C02">
  <div id="frame">
    <canvas id="grid" class="cx-grid" width="1080" height="1350"></canvas>
    <div id="glow"></div>
    <div id="kick" class="cx-kicker" data-copy="C02_kicker"></div>
    <div id="big" class="cx-big" data-copy="C02_big"></div>
    <div id="small" class="cx-small" data-copy="C02_small"></div>
    <div id="demo"><div id="svc"></div></div>
    <div class="cx-triplet" data-copy="C02_triplet"></div>
    <div id="fx"></div>
  </div>
</div>
<script src="slides/_pin.js"></script>
<script src="slides/_vi.js"></script>
<script>
  const S = window.SAMI, X = window.CX;
  S.bindCopy();
  const frame = V.$('#frame'), chrome = X.chrome(frame);
  const grid = X.grid(V.$('#grid'), {color: '#ffffff', alpha: 0.16});
  const burst = X.burst(V.$('#fx'), 14, 5);
  const ICONS = ['brand', 'menu', 'web', 'cal', 'bag', 'pin', 'ads', 'heart'];
  // thứ tự đọc: cột trái 1-4, cột phải 5-8 → đặt vào lưới theo hàng
  const cards = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) {
    const i = c * 4 + r, el = V.el('div', 'sv', V.$('#svc'));
    el.innerHTML = '<span class="n">0' + (i + 1) + '</span><span class="ic">' + V.icon(ICONS[i], {sw: 2.2}) + '</span><span class="t"></span><span class="lit"></span>';
    el.querySelector('.t').textContent = S.text('C02_s' + (i + 1));
    cards[i] = el;
  }
  const pin = makePin(frame);
  let chars = [], p1 = {x: 300, y: 800}, p8 = {x: 800, y: 1100}, path = pinPath({land: {t: 1.0, x: 300, y: 800}, entryY: 600, exit: 4.9, exitY: 600});
  const layout = X.ready(() => {
    chars = bigWord(V.$('#big'), 936);
    V.flow();
    const a = V.rel(cards[0]), b = V.rel(cards[7]);
    p1 = {x: a.r - 70, y: a.t + 6}; p8 = {x: b.r - 70, y: b.t + 6};
    path = pinPath({land: {t: 1.0, x: p1.x, y: p1.y}, entryY: 600, hops: [{t: 3.0, x: p8.x, y: p8.y, h: 240}], exit: 4.9, exitY: 600});
  });
  X.loop((t) => {
    layout(); chrome(t);
    drawPin(pin, path, t, null);
    grid(t, [{t: 1.0, x: p1.x, y: p1.y, a: 1.0}, {t: 3.0, x: p8.x, y: p8.y, a: 1.2}], 1);
    burst(t, 3.0, p8.x, p8.y, 0.9);
    // thẻ sáng lần lượt 1 → 8 (mỗi thẻ 0,25 s), tắt dần; thẻ nảy nhẹ khi sáng
    cards.forEach((c, i) => {
      const at = 1.0 + i * 0.25, on = X.pulse(t, at + 0.15, 0.32);
      c.querySelector('.lit').style.opacity = on;
      const k = X.kick(t - at, 2.6, 6);
      c.style.transform = `translateY(${-k * 10}px) scale(${1 + Math.max(0, k) * 0.03})`;
    });
    chars.forEach((c, i) => { const q = X.kick(t - 3.0 - i * 0.04, 3, 6) * 0.14; c.style.transform = `translateY(${-q * 50}px) scale(${1 + q * 0.3}, ${1 - q * 0.2})`; });
    V.$('#glow').style.transform = `scale(${1 + 0.06 * X.wave(t, 3)})`;
  });
</script>
</body>
</html>
