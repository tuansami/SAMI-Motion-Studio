<!doctype html>
<html lang="vi">
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/900.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="slides/_shared.css">
<style>
  /* C07 · Số đo thật (sami-marketing-os/knowledge/proof-points.md, không ghi tên quán): 4 thẻ thành phố + số đo, ảnh quán thật.
   * Ghim vào từ trái, nhảy qua 4 thẻ (1,0 · 1,5 · 2,0 · 2,5 s), mỗi thẻ sáng viền + số nảy; 3,0 s cả 4 thẻ sáng (chime); rời ở 4,9 s. Số luôn hiện đủ. */
  #cards { position: absolute; left: 0; right: 0; top: 0; bottom: 46px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 18px; }
  .sc { position: relative; border-radius: 26px; overflow: hidden; background: var(--k-bg2); border: 2px solid var(--k-line); box-shadow: 0 20px 50px rgba(0, 0, 0, .4); }
  .sc .im { position: absolute; left: 0; right: 0; top: 0; height: 40%; }
  .sc .im::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 6, 34, .1), rgba(10, 6, 34, .85)); }
  .sc .city { position: absolute; left: 18px; top: 16px; display: flex; align-items: center; gap: 8px; font: 700 22px/1 var(--f-head); color: #fff; z-index: 2; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
  .sc .city i { width: 20px; height: 20px; color: var(--k-accent); display: block; }
  .sc .val { position: absolute; left: 20px; bottom: 46px; font: 900 92px/1 var(--f-head); letter-spacing: -0.04em; background: linear-gradient(90deg, var(--k-accent), var(--k-accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; transform-origin: 0 100%; }
  .sc .val small { font-size: 0.42em; letter-spacing: 0; }
  .sc .lbl { position: absolute; left: 22px; bottom: 18px; font: 500 22px/1 var(--f-head); color: var(--k-dim); }
  .sc .lit { position: absolute; inset: -2px; border-radius: 26px; border: 3px solid var(--k-accent); box-shadow: 0 0 34px rgba(8, 221, 164, .35); opacity: 0; }
  #note { position: absolute; left: 0; right: 0; bottom: 0; font: 500 24px/1 var(--f-mono); color: var(--k-dim); }
</style>
</head>
<body>
<div id="root" data-composition-id="C07">
  <div id="frame">
    <canvas id="grid" class="cx-grid" width="1080" height="1350"></canvas>
    <div id="glow"></div>
    <div id="kick" class="cx-kicker" data-copy="C07_kicker"></div>
    <div id="big" class="cx-big" data-copy="C07_big"></div>
    <div id="small" class="cx-small" data-copy="C07_small"></div>
    <div id="demo"><div id="cards"></div><div id="note" data-copy="C07_note"></div></div>
    <div class="cx-triplet" data-copy="C07_triplet"></div>
    <div id="fx"></div>
  </div>
</div>
<script src="slides/_pin.js"></script>
<script src="slides/_vi.js"></script>
<script>
  const S = window.SAMI, X = window.CX;
  S.bindCopy();
  const cards = [1, 2, 3, 4].map((n) => {
    const c = V.el('div', 'sc', V.$('#cards'), '<div class="im ph" data-img="C07_c' + n + '_photo"></div><div class="city"><i>' + V.icon('pin', {sw: 2.6}) + '</i><span></span></div><div class="val"><span></span><small></small></div><div class="lbl"></div><div class="lit"></div>');
    c.querySelector('.city span').textContent = S.text('C07_c' + n + '_city');
    c.querySelector('.val span').textContent = S.text('C07_c' + n + '_val');
    c.querySelector('.val small').textContent = String(S.copy['C07_c' + n + '_unit'] || '');
    c.querySelector('.lbl').textContent = S.text('C07_c' + n + '_lbl');
    return c;
  });
  V.bindImgs();
  const frame = V.$('#frame'), chrome = X.chrome(frame);
  const grid = X.grid(V.$('#grid'), {color: '#ffffff', alpha: 0.15});
  const burst = X.burst(V.$('#fx'), 16, 29);
  const AT = [1.0, 1.5, 2.0, 2.5];
  const pin = makePin(frame);
  let chars = [], pts = AT.map(() => ({x: 500, y: 900})), path = pinPath({land: {t: 1.0, x: 400, y: 900}, entryY: 600, exit: 4.9, exitY: 600});
  const layout = X.ready(() => {
    chars = bigWord(V.$('#big'), 936);
    V.flow();
    pts = cards.map((c) => { const r = V.rel(c); return {x: r.r - 64, y: r.t + 4}; });
    path = pinPath({land: {t: 1.0, x: pts[0].x, y: pts[0].y}, entryY: 600, hops: pts.slice(1).map((p, i) => ({t: AT[i + 1], x: p.x, y: p.y, h: 150})), exit: 4.9, exitY: 600});
  });
  X.loop((t) => {
    layout(); chrome(t);
    cards.forEach((c, i) => {
      const k = X.kick(t - AT[i], 2.6, 6), all = X.pulse(t, 3.1, 0.3);
      c.querySelector('.lit').style.opacity = Math.max(X.pulse(t, AT[i] + 0.15, 0.3), all);
      c.querySelector('.val').style.transform = `translateY(${-k * 14}px) scale(${1 + Math.max(0, k) * 0.08})`;
      c.style.transform = `translateY(${-k * 6}px)`;
      c.querySelector('.im').style.transform = `scale(${1.05 + 0.04 * X.wave(t, 6, i / 4)})`;
    });
    drawPin(pin, path, t, null);
    grid(t, AT.map((at, i) => ({t: at, x: pts[i].x, y: pts[i].y, a: 0.8})), 1);
    burst(t, 3.0, 540, V.rel(V.$('#cards')).y, 1.0);
    chars.forEach((c, i) => { const q = X.kick(t - 3.0 - i * 0.04, 3, 6) * 0.12; c.style.transform = `translateY(${-q * 50}px) scale(${1 + q * 0.3}, ${1 - q * 0.2})`; });
    V.$('#glow').style.transform = `scale(${1 + 0.06 * X.wave(t, 3)})`;
  });
</script>
</body>
</html>
