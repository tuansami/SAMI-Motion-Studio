<!doctype html>
<html lang="vi">
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css">
<link rel="stylesheet" href="_fonts/inter/600.css">
<link rel="stylesheet" href="_fonts/inter/700.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="hf/parts/intro.css">
<style>
  /* S06 · 03 Website: khung dây → từng khối web thật được ghép vào (tua nhanh, trang tự cuộn, code chạy) → co desktop/tablet/điện thoại → "Mobiloptimiert" */
  #chap { left: var(--safe-side); top: calc(var(--safe-top) + 4px); font-size: 34px; }
  #head { position: absolute; left: var(--safe-side); right: var(--safe-side); top: calc(var(--safe-top) + 80px); font-size: 78px; }
  #win { left: 40px; top: 540px; width: 1000px; height: 800px; }
  #hud { right: 64px; top: 500px; }
  #pg { position: absolute; left: 0; right: 0; top: 0; height: 1700px; background: #f4efe9; }
  .wf { position: absolute; border: 3px solid #b9b3c9; border-radius: 10px; overflow: hidden; background: #ebe6f0; }
  .wf svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wf .im { position: absolute; inset: 0; opacity: 0; }
  #code { position: absolute; left: 60px; top: 1150px; width: 600px; height: 270px; border-radius: 22px; background: rgba(15,13,26,.94); border: 2px solid #2f2d3b; box-shadow: var(--shadow); overflow: hidden; z-index: 20; }
  #code .hd { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 18px; font: 500 18px var(--f-mono); color: #8f8ba6; border-bottom: 2px solid #2f2d3b; }
  #code .hd b { margin-left: auto; color: var(--c-mint); font-weight: 500; }
  #lines { position: absolute; left: 0; right: 0; top: 54px; padding: 0 22px; font: 500 21px/34px var(--f-mono); color: #d9d7e3; white-space: nowrap; }
  #lines .ln { opacity: 0; } #lines .ln i { color: #6e6a86; font-style: normal; margin-right: 18px; }
  #lines .ln .k { color: #b9a8ff; }
  #full { position: absolute; inset: 0; opacity: 0; }
  #dev { position: absolute; left: 50%; top: 1370px; transform: translateX(-50%); display: flex; gap: 14px; }
  #dev .chip { font-size: 28px; opacity: .35; }
  #dev .chip.on { opacity: 1; border-color: var(--c-mint); }
  #badge { position: absolute; left: 50%; top: 1460px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 14px 30px; border-radius: 999px; background: var(--grad); color: var(--c-navyDeep); font: 800 40px var(--f-head); white-space: nowrap; opacity: 0; z-index: 30; }
  #badge .ic { width: 44px; height: 44px; }
  [data-ratio="16x9"] #chap { left: 110px; top: 120px; }
  [data-ratio="16x9"] #head { left: 110px; right: auto; width: 600px; top: 200px; font-size: 70px; }
  [data-ratio="16x9"] #win { left: 760px; top: 100px; width: 1060px; height: 760px; }
  [data-ratio="16x9"] #hud { right: 120px; top: 64px; }
  [data-ratio="16x9"] #code { left: 110px; top: 560px; width: 560px; }
  [data-ratio="16x9"] #dev { left: 1290px; top: 900px; }
  [data-ratio="16x9"] #badge { left: 410px; top: 870px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S06">
  <div class="bg"></div><div class="dots"></div>
  <div id="chap" class="chapter"></div>
  <div id="head" class="head" data-copy="S06_head"></div>
  <div id="win" class="browser"><div class="bar"><i></i><i></i><i></i><div class="url"><span class="lk"></span><span>https://</span></div></div><div class="page"><div id="pg"></div><div id="full"></div></div></div>
  <div id="code"><div class="hd">index.html<b data-copy="S06_live"></b></div><div id="lines"></div></div>
  <div id="dev"></div>
  <div id="badge"><span class="ic"></span><span data-copy="S06_badge"></span></div>
</div>
<script src="hf/parts/sami-logo.js"></script>
<script src="hf/parts/intro.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), B = S.beat, $ = I.$;
  const [num, name] = S.text('S06_chapter').split('|').map((x) => x.trim());
  $('#chap').innerHTML = '<b>' + num + '</b><span>' + name + '</span>';
  $('#win .lk').innerHTML = '<span style="display:inline-block;width:18px;height:18px;vertical-align:-3px">' + I.icon('lock') + '</span>';
  $('#badge .ic').innerHTML = I.icon('check', {sw: 3});
  const hud = I.hud($('#root'), S.text('S04_ff'), 16); hud.id = 'hud';
  const win = $('#win'), pg = $('#pg'), W = win.offsetWidth;
  // khung dây: 6 khối (ảnh chụp phần trang web thật ghép vào sau)
  const g = 24, w2 = (W - 3 * g) / 2;
  const blocks = [[g, g, W - 2 * g, 400], [g, 448, w2, 240], [g * 2 + w2, 448, w2, 240], [g, 712, W - 2 * g, 360], [g, 1096, w2, 260], [g * 2 + w2, 1096, w2, 260]];
  const wfs = blocks.map((b, i) => {
    const d = I.el('div', 'wf', pg); Object.assign(d.style, {left: b[0] + 'px', top: b[1] + 'px', width: b[2] + 'px', height: b[3] + 'px'});
    d.innerHTML = '<svg preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="0" y1="0" x2="100" y2="100" stroke="#c9c3d8" stroke-width=".6" vector-effect="non-scaling-stroke"/><line x1="100" y1="0" x2="0" y2="100" stroke="#c9c3d8" stroke-width=".6" vector-effect="non-scaling-stroke"/></svg><div class="im" data-img="S06_b' + (i + 1) + '_photo"></div>';
    return d;
  });
  I.bindImgs(pg);
  $('#full').setAttribute('data-img', 'S06_desk_photo'); I.bindImgs($('#win'));
  // khung code
  const lines = $('#lines');
  S.text('S06_code').split('|').forEach((t, i) => { const l = I.el('div', 'ln', lines); l.innerHTML = '<i>' + String(i + 12).padStart(2, '0') + '</i>'; const s = I.el('span', 'k', l); s.textContent = t.trim(); });
  // thiết bị
  const DEV = S.text('S06_devices').split('|').map((x) => x.trim());
  const devs = DEV.map((d) => { const c = I.el('div', 'chip', $('#dev')); c.innerHTML = '<i></i>'; I.el('span', '', c).textContent = d; return c; });

  // ── tua nhanh: dựng web (4 s) ───────────────────────────────────
  const ct = gsap.timeline({paused: true, defaults: {ease: S.EASE}}); ct.set({}, {}, 4);
  wfs.forEach((d, i) => ct.from(d, {opacity: 0, scale: 0.92, duration: 0.12}, i * 0.08));
  const cur = I.cursor(ct, win, blocks.map((b, i) => [b[0] + b[2] * 0.55, 54 + Math.min(b[1] + b[3] * 0.5, 520), 0.7 + i * 0.42, true]), {size: 44});
  cur.style.opacity = 0; ct.set(cur, {opacity: 1}, 0.6);
  wfs.forEach((d, i) => {
    const at = 0.75 + i * 0.42;
    ct.to(d.querySelector('.im'), {opacity: 1, duration: 0.1}, at);
    ct.set(d, {borderColor: 'transparent', backgroundColor: '#fff'}, at);
    ct.fromTo(d, {scale: 1.04}, {scale: 1, duration: 0.15}, at);
    if (blocks[i][1] > 300) ct.to(pg, {y: -Math.max(0, blocks[i][1] + blocks[i][3] - 700), duration: 0.25}, at - 0.05);
    // cursor follows scroll: keep it in view (positions are relative to the window)
  });
  I.$$('.ln', lines).forEach((l, i) => ct.set(l, {opacity: 1}, 0.3 + i * 0.32));
  ct.to(lines, {y: -150, duration: 1.2, ease: 'none'}, 2.6);
  ct.to(cur, {opacity: 0, duration: 0.1}, 3.4);
  ct.to(pg, {y: 0, duration: 0.3}, 3.5);

  // ── timeline chính ──────────────────────────────────────────────
  S.arrive(tl, '#chap', B(0), {dist: 20, blur: 6, dur: 0.4});
  tl.fromTo(win, {y: 140, opacity: 0}, {y: 0, opacity: 1, duration: 0.45}, B(0));
  S.arrive(tl, S.words($('#head')), B(0.4), {stagger: 0.08, dist: 40, dur: 0.45});
  tl.fromTo('#code', {x: -120, opacity: 0}, {x: 0, opacity: 1, duration: 0.4}, B(1));
  tl.fromTo(hud, {scale: 0.6, opacity: 0}, {scale: 1, opacity: 1, duration: 0.3}, B(0.5));
  I.clock(tl, hud, B(0.5), B(7.5) - B(0.5), 9, 11);
  I.lapse(tl, ct, B(0.5), B(7.5) - B(0.5), 12);
  // web xong → ảnh toàn trang → co theo thiết bị
  tl.to(hud, {opacity: 0, duration: 0.2}, B(7.5));
  tl.to('#code', {x: -120, opacity: 0, duration: 0.3}, B(7.5));
  tl.to('#full', {opacity: 1, duration: 0.25}, B(7.6));
  tl.fromTo(devs, {y: 30, opacity: 0}, {y: 0, opacity: 0.35, duration: 0.3, stagger: 0.06}, B(7.6));
  const H0 = win.offsetHeight, X0 = win.offsetLeft;
  const sizes = S.landscape ? [[1060, 760], [560, 680], [330, 650]] : [[1000, 800], [620, 760], [380, 760]];
  const imgs = ['S06_desk_photo', 'S06_tab_photo', 'S06_mob_photo'];
  sizes.forEach((sz, i) => {
    const at = B(8 + i * 1.5);
    devs.forEach((d, k) => tl.set(d, {attr: {class: 'chip' + (k === i ? ' on' : '')}, opacity: k === i ? 1 : 0.35}, at));
    if (i === 0) return;
    tl.to(win, {width: sz[0], height: sz[1], x: (sizes[0][0] - sz[0]) / 2, borderRadius: i === 2 ? 46 : 26, duration: 0.45}, at);
    tl.set('#full', {backgroundImage: 'url("' + I.src(imgs[i]) + '")'}, at + 0.2);
    tl.fromTo('#full', {opacity: 0.2}, {opacity: 1, duration: 0.25, immediateRender: false}, at + 0.2);
  });
  tl.fromTo('#badge', {scale: 0.3, opacity: 0}, {scale: 1, opacity: 1, duration: 0.35}, B(11.2));
  tl.to('#dev', {opacity: 0, duration: 0.2}, B(11.1));
</script>
</body>
</html>
