<!doctype html>
<html lang="vi">
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/400.css">
<link rel="stylesheet" href="_fonts/inter/500.css">
<link rel="stylesheet" href="_fonts/inter/600.css">
<link rel="stylesheet" href="_fonts/inter/700.css">
<link rel="stylesheet" href="hf/parts/intro.css">
<style>
  /* S11 · Offer + WhatsApp: "Kostenloser Check" 250 € gạch đỏ → con dấu 0 € → khung chat tự vẽ: khách gõ, gửi, SAMI trả lời → CTA */
  #bgp { position: absolute; inset: -6%; filter: blur(22px) brightness(.35) saturate(1.2); }
  #head { position: absolute; left: var(--safe-side); right: var(--safe-side); top: calc(var(--safe-top) + 40px); text-align: center; font-size: 88px; }
  #price { position: absolute; left: 0; right: 0; top: 640px; height: 560px; }
  #old { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 800 190px/1 var(--f-head); color: #fff; letter-spacing: -0.04em; }
  #old span { position: relative; display: inline-block; }
  #strike { position: absolute; left: -4%; right: -4%; top: 52%; height: 22px; margin-top: -11px; border-radius: 11px; background: var(--red); transform: rotate(-8deg) scaleX(0); transform-origin: 0 50%; }
  #new { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font: 800 330px/1 var(--f-head); letter-spacing: -0.05em; }
  #new span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; padding: 0 .06em .08em; }
  #chat { position: absolute; left: var(--safe-side); right: var(--safe-side); top: 620px; height: 700px; border-radius: 40px; overflow: hidden; background: #EFEAE2; box-shadow: var(--shadow); opacity: 0; }
  #ch { height: 128px; background: #0E7A6B; display: flex; align-items: center; gap: 20px; padding: 0 28px; color: #fff; }
  #av { width: 82px; height: 82px; border-radius: 50%; background: var(--c-navy); display: flex; align-items: center; justify-content: center; }
  #ch b { display: block; font: 700 36px var(--f-ui); } #ch span { font: 500 24px var(--f-ui); opacity: .85; }
  #msgs { position: absolute; left: 0; right: 0; top: 128px; bottom: 112px; padding: 28px; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; }
  .bub { max-width: 78%; padding: 18px 24px; border-radius: 26px; font: 500 32px/1.3 var(--f-ui); color: #1c1b23; box-shadow: 0 2px 4px rgba(0,0,0,.08); opacity: 0; }
  .bub.me { align-self: flex-end; background: #D9FDD3; border-bottom-right-radius: 8px; }
  .bub.sa { align-self: flex-start; background: #fff; border-bottom-left-radius: 8px; }
  .bub .tk { display: inline-flex; margin-left: 10px; vertical-align: -6px; width: 40px; height: 26px; color: #8696a0; }
  #dots { align-self: flex-start; display: flex; gap: 8px; padding: 24px 26px; background: #fff; border-radius: 26px; opacity: 0; }
  #dots i { width: 14px; height: 14px; border-radius: 50%; background: #8696a0; }
  #inp { position: absolute; left: 20px; right: 20px; bottom: 18px; height: 78px; display: flex; gap: 14px; }
  #field { flex: 1; border-radius: 39px; background: #fff; display: flex; align-items: center; padding: 0 28px; font: 400 28px var(--f-ui); color: #1c1b23; white-space: nowrap; overflow: hidden; }
  #field .caret { color: #0E7A6B; }
  #send { width: 78px; height: 78px; border-radius: 50%; background: #0E7A6B; color: #fff; padding: 20px; box-sizing: border-box; }
  #cta { position: absolute; left: var(--safe-side); right: var(--safe-side); top: 1370px; text-align: center; font-size: 76px; }
  [data-ratio="16x9"] #head { left: 110px; right: auto; width: 820px; top: 100px; text-align: left; font-size: 72px; }
  [data-ratio="16x9"] #price { left: 110px; right: auto; width: 820px; top: 420px; height: 560px; }
  [data-ratio="16x9"] #old { font-size: 150px; }
  [data-ratio="16x9"] #new { top: 180px; font-size: 290px; }
  [data-ratio="16x9"] #old, [data-ratio="16x9"] #new { text-align: left; }
  [data-ratio="16x9"] #chat { left: 1060px; right: auto; width: 750px; top: 120px; height: 660px; }
  [data-ratio="16x9"] #cta { left: 1060px; right: auto; width: 750px; top: 820px; font-size: 64px; }
</style>
<style data-lang="vi-story">
[data-ratio="9x16"] #head { font-size: 70px; }
[data-ratio="9x16"] #cta { top: 1350px; font-size: 64px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S11">
  <div id="bgp" data-img="S11_bg_photo"></div>
  <div class="dots"></div>
  <div id="head" class="head" data-copy="S11_head"></div>
  <div id="price"><div id="old"><span><span data-copy="S11_old"></span><div id="strike"></div></span></div><div id="new"><span data-copy="S11_new"></span></div></div>
  <div id="chat">
    <div id="ch"><div id="av"></div><div><b data-copy="S11_chat"></b><span data-copy="S11_status"></span></div></div>
    <div id="msgs"><div class="bub me" id="m1"><span data-copy="S11_msg"></span><span class="tk"></span></div><div id="dots"><i></i><i></i><i></i></div><div class="bub sa" id="m2" data-copy="S11_reply"></div></div>
    <div id="inp"><div id="field"></div><div id="send"></div></div>
  </div>
  <div id="cta" class="head" data-copy="S11_cta"></div>
</div>
<script src="hf/parts/sami-logo.js"></script>
<script src="hf/parts/intro.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), B = S.beat, $ = I.$;
  I.mark($('#av'), 50);
  $('#send').innerHTML = I.icon('send', {sw: 2.4});
  $('.tk').innerHTML = '<svg viewBox="0 0 34 22" style="width:100%;height:100%"><path d="M2 12l6 6L20 4M14 16l2 2L30 4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const wide = S.landscape;
  // pha 1: offer
  tl.fromTo('#bgp', {scale: 1.1}, {scale: 1, duration: S.dur, ease: 'none'}, 0);
  S.arrive(tl, S.words($('#head')), B(0), {stagger: 0.08, dist: 40, dur: 0.45});
  tl.fromTo('#old', {scale: 0.7, opacity: 0, filter: 'blur(12px)'}, {scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.4}, B(0.8));
  tl.to('#strike', {scaleX: 1, rotation: -8, duration: 0.3}, B(1.7));
  tl.to('#old', {opacity: 0.45, scale: 0.8, y: -40, duration: 0.4}, B(2.1));
  tl.fromTo('#new span', {scale: 2.6, opacity: 0, rotation: -10}, {scale: 1, opacity: 1, rotation: -4, duration: 0.28}, B(2.4));
  I.flash(tl, B(2.45), {peak: 0.35, dur: 0.35, color: 'var(--c-mint)'});
  I.shake(tl, '#price', B(2.5), {amp: 16, n: 7});
  // pha 2: chat WhatsApp
  if (!wide) {
    tl.to('#head', {opacity: 0, y: -30, duration: 0.3}, B(3.6));
    tl.to('#price', {scale: 0.42, y: -470, duration: 0.5}, B(3.6));
  }
  tl.fromTo('#chat', {y: 300, opacity: 0}, {y: 0, opacity: 1, duration: 0.5}, B(3.8));
  const typed = I.type(tl, $('#field'), S.text('S11_msg'), B(4.3), 46);
  tl.fromTo('#send', {scale: 1}, {scale: 0.85, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false}, typed + 0.1);
  tl.set('#field', {textContent: ''}, typed + 0.2);
  tl.fromTo('#m1', {y: 40, opacity: 0, scale: 0.9}, {y: 0, opacity: 1, scale: 1, duration: 0.3}, typed + 0.2);
  tl.set('#m1 .tk', {color: '#53bdeb'}, typed + 0.5);
  tl.fromTo('#dots', {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: 0.25}, typed + 0.55);
  I.$$('#dots i').forEach((d, i) => { for (let k = 0; k < 3; k++) tl.fromTo(d, {y: 0}, {y: -10, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false}, typed + 0.6 + k * 0.22 + i * 0.07); });
  tl.set('#dots', {display: 'none'}, typed + 1.25);
  tl.fromTo('#m2', {y: 40, opacity: 0, scale: 0.9}, {y: 0, opacity: 1, scale: 1, duration: 0.3}, typed + 1.25);
  S.arrive(tl, S.words($('#cta')), B(4.6), {stagger: 0.08, dist: 40, dur: 0.45});
</script>
</body>
</html>
