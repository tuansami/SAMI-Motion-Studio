<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css">
<link rel="stylesheet" href="_fonts/playfair-display/700-italic.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="_sami/khuon/kit.css">
<script src="_sami/khuon/kit.js"></script>
<style>
  /* Khuôn endcard-logo · logo (ảnh) hoặc tên chữ + vệt sáng quét, khẩu hiệu, website. */
  #wrap { position: absolute; top: var(--safe-top); bottom: var(--safe-bottom); left: var(--safe-side); right: var(--safe-side); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 56px; }
  #mark { position: relative; overflow: hidden; padding: 10px 30px; }
  #logo { display: block; max-width: 900px; max-height: 300px; object-fit: contain; }
  #name { font-family: var(--k-head); font-weight: 900; font-size: 260px; letter-spacing: -0.05em; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  [data-theme="paper"] #name { background: none; color: var(--k-ink); }
  [data-theme="light"] #name { background: linear-gradient(120deg, var(--k-accent), var(--c-mint)); -webkit-background-clip: text; background-clip: text; }
  #shine { position: absolute; top: -20%; bottom: -20%; width: 30%; left: -40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); mix-blend-mode: overlay; }
  #tag { font-size: 70px; max-width: 1400px; }
  #web { font-size: 34px; }
  [data-ratio="9x16"] #name { font-size: 220px; }
  [data-ratio="9x16"] #logo { max-width: 820px; max-height: 280px; }
  [data-ratio="9x16"] #tag { font-size: 76px; max-width: 920px; }
  [data-ratio="1x1"] #name, [data-ratio="4x5"] #name { font-size: 170px; }
  [data-ratio="1x1"] #tag, [data-ratio="4x5"] #tag { font-size: 54px; max-width: 900px; }
  [data-ratio="1x1"] #wrap, [data-ratio="4x5"] #wrap { gap: 36px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S07">
  <div class="k-stage">
    <div id="wrap" class="k-layer">
      <div id="mark"><img id="logo" data-slot-img="logo" data-optional alt=""><div id="name" data-slot="name"></div><div id="shine"></div></div>
      <div id="tag" class="k-head" data-slot="tagline" data-optional></div>
      <div id="web" class="k-label" data-slot="web" data-optional></div>
    </div>
  </div>
</div>
<script>
  const S = window.SAMI, K = S.K.bind(), tl = S.timeline();
  if (K.has('logo')) document.getElementById('name').style.display = 'none';
  tl.fromTo('#mark', {scale: .8, opacity: 0, filter: 'blur(16px)'}, {scale: 1, opacity: 1, filter: 'blur(0px)', duration: .8}, S.beat(.5));
  tl.fromTo('#shine', {left: '-40%'}, {left: '120%', duration: 1.1, ease: 'none'}, S.beat(2));
  if (K.has('tagline')) S.arrive(tl, S.words(document.getElementById('tag')), S.beat(2), {stagger: .1, dur: .5});
  if (K.has('web')) S.arrive(tl, '#web', S.beat(4), {dist: 14, blur: 4});
  K.push(tl, '#wrap', .04);
</script>
</body>
</html>
