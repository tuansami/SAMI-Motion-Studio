<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/900.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="slides/_shared.css">
<style>
  /* C05 · CTA — ghim vào từ trái, đáp giữa khung với tiếng nổ nhỏ + hạt, ô bình luận nhấp nháy theo nhịp, handle SAMI. Slide cuối: không có nút Swipe. */
  #comment { position: absolute; left: 0; right: 0; top: 150px; height: 120px; border-radius: 999px; background: var(--k-bg2); border: 2px solid var(--k-line); display: flex; align-items: center; padding: 0 44px; gap: 22px; font: 700 46px/1 var(--f-head); }
  #comment .av { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(120deg, var(--k-accent), var(--k-accent2)); flex: none; }
  #comment b { color: var(--k-accent); }
  #caret { display: inline-block; width: 4px; height: 1em; background: var(--k-ink); margin-left: 4px; }
  #handle { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 600 34px/1 var(--f-mono); letter-spacing: .08em; color: var(--k-dim); }
</style>
</head>
<body>
<div id="root" data-composition-id="C05">
  <div id="frame">
    <canvas id="grid" class="cx-grid" width="1080" height="1350"></canvas>
    <div id="kick" class="cx-kicker" data-copy="C05_kicker"></div>
    <div id="big" class="cx-big" data-copy="C05_big"></div>
    <div id="small" class="cx-small" data-copy="C05_small"></div>
    <div id="demo">
      <div id="comment"><i class="av"></i><b id="kw"></b><i id="caret"></i></div>
      <div id="handle"></div>
    </div>
    <div id="fx"></div>
  </div>
</div>
<script src="slides/_pin.js"></script>
<script>
  const S = window.SAMI, X = window.CX;
  S.bindCopy();
  const frame = document.getElementById('frame');
  const chrome = X.chrome(frame);
  const grid = X.grid(document.getElementById('grid'), {color: '#ffffff', alpha: 0.17});
  const burst = X.burst(document.getElementById('fx'), 22, 37);
  document.getElementById('handle').textContent = '@' + (S.carousel.handle || 'sami.agency');
  const kwText = S.text('C05_big').replace(/[»«"]/g, '').trim().toUpperCase();
  const kw = document.getElementById('kw'), caret = document.getElementById('caret');
  const pin = makePin(frame);
  let land = {t: 1.0, x: 900, y: 700}, path = pinPath({land, entryY: 640});
  let chars = [];
  const layout = X.ready(() => { chars = bigWord(document.getElementById('big'), 936); });
  X.loop((t) => {
    layout(); chrome(t);
    drawPin(pin, path, t, null);
    grid(t, [{t: 1.0, x: 900, y: 700, a: 1.3}], 1);
    burst(t, 1.0, 900, 700, 1.2);
    // keyword is always written (frame 0 readable); the caret blinks on every beat and the field pulses on the CTA beat
    kw.textContent = kwText;
    caret.style.opacity = Math.floor(t * 2) % 2 ? 0 : 1;
    const k = X.kick(t - 3.0, 2.4, 5);
    document.getElementById('comment').style.transform = `scale(${1 + k * 0.05})`;
    chars.forEach((c, i) => { const q = X.kick(t - 1.0 - i * 0.04, 3, 6) * 0.16; c.style.transform = `translateY(${-q * 60}px) scale(${1 + q * 0.3}, ${1 - q * 0.2})`; });
  });
</script>
</body>
</html>
