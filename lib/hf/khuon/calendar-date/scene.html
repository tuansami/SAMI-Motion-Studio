<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css">
<link rel="stylesheet" href="_fonts/playfair-display/700-italic.css">
<link rel="stylesheet" href="_fonts/caveat/700.css">
<link rel="stylesheet" href="_sami/khuon/kit.css">
<script src="_sami/khuon/kit.js"></script>
<style>
  /* Khuôn calendar-date · tờ lịch tháng thật (thứ Hai đầu tuần), ngày khoanh nét bút tự vẽ, câu chốt. */
  #wrap { position: absolute; top: var(--safe-top); bottom: var(--safe-bottom); left: var(--safe-side); right: var(--safe-side); display: flex; align-items: center; justify-content: center; gap: 110px; }
  #cal { position: relative; width: 720px; background: #FFFDF8; color: #1D3557; box-shadow: var(--k-shadow); flex: none; rotate: -3deg; }
  #cal .top { background: var(--k-accent); color: #fff; padding: 26px 0 22px; text-align: center; font-family: "Playfair Display", serif; font-weight: 700; font-size: 66px; }
  [data-theme="night"] #cal .top { background: var(--c-purple); }
  #cal .rings { position: absolute; top: -22px; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 110px; }
  #cal .rings i { width: 22px; height: 54px; border-radius: 11px; background: #3A3A44; display: block; }
  #grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 26px 30px 36px; gap: 10px 0; text-align: center; font-family: var(--f-ui); font-weight: 500; font-size: 36px; }
  #grid .dw { font-size: 24px; font-weight: 800; color: #8A8A99; letter-spacing: .06em; }
  #grid .we { color: var(--k-accent); }
  #grid .d { position: relative; height: 66px; line-height: 66px; }
  #ring { position: absolute; left: 50%; top: 50%; width: 120px; height: 100px; margin: -50px 0 0 -60px; overflow: visible; }
  #ring path { fill: none; stroke: var(--k-accent); stroke-width: 6; stroke-linecap: round; }
  #txt { max-width: 820px; display: flex; flex-direction: column; gap: 30px; }
  #head { font-size: 110px; }
  #sub { font-size: 78px; }
  [data-ratio="9x16"] #wrap { flex-direction: column; gap: 90px; text-align: center; }
  [data-ratio="9x16"] #cal { width: 820px; }
  [data-ratio="9x16"] #txt { align-items: center; max-width: 940px; }
  [data-ratio="1x1"] #wrap, [data-ratio="4x5"] #wrap { gap: 50px; }
  [data-ratio="1x1"] #cal, [data-ratio="4x5"] #cal { width: 500px; }
  [data-ratio="1x1"] #grid, [data-ratio="4x5"] #grid { font-size: 26px; padding: 18px 20px 24px; }
  [data-ratio="1x1"] #grid .d, [data-ratio="4x5"] #grid .d { height: 48px; line-height: 48px; }
  [data-ratio="1x1"] #cal .top, [data-ratio="4x5"] #cal .top { font-size: 46px; }
  [data-ratio="1x1"] #head, [data-ratio="4x5"] #head { font-size: 70px; }
</style>
</head>
<body>
<div id="root" data-composition-id="KHUON">
  <div class="k-stage">
    <div id="wrap" class="k-layer">
      <div id="cal"><div class="rings"><i></i><i></i><i></i></div><div class="top" data-slot="month"></div><div id="grid"></div></div>
      <div id="txt">
        <div id="head" class="k-head" data-slot="headline"></div>
        <div id="sub" class="k-hand" data-slot="sub" data-optional></div>
      </div>
    </div>
  </div>
</div>
<script>
  const S = window.SAMI, K = S.K.bind(), tl = S.timeline();
  // tháng thật: tính thứ của ngày 1 bằng công thức (không dùng Date: cảnh phải tất định theo dữ liệu)
  const m = Math.min(12, Math.max(1, Math.round(K.num('month_num', 12)))), y = Math.round(K.num('year', 2026)), day = Math.round(K.num('day', 24));
  const dow = (yy, mm, dd) => { const t = [0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4]; if (mm < 3) yy -= 1; return (yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) + t[mm - 1] + dd) % 7; }; // 0 = Chủ nhật
  const first = (dow(y, m, 1) + 6) % 7, days = [31, (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
  let g = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map((d, i) => `<div class="dw ${i > 4 ? 'we' : ''}">${d}</div>`).join('');
  for (let i = 0; i < first; i++) g += '<div class="d"></div>';
  for (let d = 1; d <= days; d++) { const w = (first + d - 1) % 7; g += `<div class="d ${w > 4 ? 'we' : ''}" ${d === day ? 'id="hit"' : ''}>${d}${d === day ? '<svg id="ring" viewBox="0 0 120 100"><path d="M86 18 C 60 4, 14 12, 10 48 C 6 82, 64 96, 98 74 C 120 58, 112 22, 70 14"/></svg>' : ''}</div>`; }
  document.getElementById('grid').innerHTML = g;
  tl.fromTo('#cal', {y: -120, opacity: 0, rotation: -12}, {y: 0, opacity: 1, rotation: 0, duration: .8}, S.beat(0));
  tl.fromTo('#grid .d', {opacity: 0}, {opacity: 1, duration: .2, stagger: .015}, S.beat(.75));
  if (document.querySelector('#ring path')) { K.draw(tl, document.querySelector('#ring path'), S.beat(3), .7); tl.fromTo('#hit', {color: '#1D3557'}, {color: 'var(--k-accent)', duration: .3}, S.beat(3.3)); }
  S.arrive(tl, S.words(document.getElementById('head')), S.beat(4), {stagger: .13, dur: .5});
  if (K.has('sub')) S.arrive(tl, '#sub', S.beat(6), {dist: 18, blur: 6});
  K.push(tl, '#wrap', .03);
</script>
</body>
</html>
