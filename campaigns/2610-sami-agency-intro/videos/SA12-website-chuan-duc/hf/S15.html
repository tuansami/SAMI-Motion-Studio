<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/inter/700.css"><link rel="stylesheet" href="_fonts/inter/800.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css"><link rel="stylesheet" href="_fonts/playfair-display/600-italic.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css"><link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S15 · End card SAMI: 7 vạch kính mỏng sập lại thành logo, câu chốt, tagline, WhatsApp + URL. */
  #stage { background: radial-gradient(70% 45% at 50% 40%, rgba(118,103,254,.36), transparent 70%), radial-gradient(60% 40% at 50% 80%, rgba(8,221,164,.16), transparent 70%), #0C0628; }
  #lw { position: absolute; left: 50%; top: 520px; width: 760px; height: 250px; margin-left: -330px; }
  #logo { position: absolute; left: 0; top: 0; width: 100%; clip-path: polygon(0 0, 100% 0, 100% 52%, 46% 52%, 46% 100%, 0 100%); }
  #claim { top: 820px; font-size: 66px; line-height: 1.18; }
  #tag { position: absolute; left: 0; right: 0; top: 1110px; text-align: center; font-family: "JetBrains Mono"; font-weight: 600; font-size: 25px; letter-spacing: .05em; color: rgba(255,255,255,.62); }
  #ct { position: absolute; left: 0; right: 0; top: 1200px; display: flex; flex-direction: column; align-items: center; gap: 14px; font-family: "Be Vietnam Pro"; font-weight: 800; font-size: 50px; color: #fff; white-space: nowrap; }
  #ct .r { display: flex; align-items: center; gap: 18px; } #ct .u { font-weight: 700; font-size: 40px; color: var(--acc); }
  #ct i { width: 22px; height: 22px; border-radius: 50%; background: var(--wa); box-shadow: 0 0 16px var(--wa); }
  .sl { position: absolute; left: 50%; height: 4px; border-radius: 4px; background: linear-gradient(90deg, transparent, rgba(227,228,247,.8), transparent); z-index: 5; }
  #ring { position: absolute; left: 50%; top: 628px; width: 900px; height: 900px; margin: -450px; border-radius: 50%; border: 2px solid rgba(8,221,164,.4); opacity: 0; }
  [data-ratio="16x9"] #lw { top: 190px; width: 620px; height: 204px; margin-left: -270px; }
  [data-ratio="16x9"] #claim { top: 440px; left: 200px; right: 200px; font-size: 60px; }
  [data-ratio="16x9"] #tag { top: 680px; } [data-ratio="16x9"] #ct { top: 760px; } [data-ratio="16x9"] #ring { top: 288px; }
</style></head>
<body>
<div id="root" data-composition-id="S15"><div id="stage" class="clip">
  <div id="ring"></div>
  <div id="lw"><img id="logo" src="public/img/logo-white.svg"></div>
  <div id="claim" class="hd" data-copy="S15_claim"></div>
  <div id="tag" data-copy="S15_tag"></div>
  <div id="ct"><span class="r"><i></i><span data-copy="S15_contact"></span></span><span class="u" data-copy="S15_url"></span></div>
</div></div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, K = window.K, tl = S.timeline(), P = K.P, stage = K.$('#stage');
  K.dust(tl, stage, 30, 131, {color: '#08DDA4', op: 0.3, rise: 140});
  const LY = P ? 628 : 288;
  // 7 vạch kính sập vào logo
  for (let i = 0; i < 7; i++) {
    const s = K.el('i', 'sl', null, stage), w = 900 - i * 60; s.style.width = w + 'px'; s.style.marginLeft = (-w / 2) + 'px'; s.style.top = LY + 'px';
    tl.fromTo(s, {y: (i - 3) * 110, opacity: 0}, {y: 0, opacity: 1, duration: 0.45, ease: 'power3.in'}, 0.05 + i * 0.05);
    tl.to(s, {opacity: 0, scaleX: 0.2, duration: 0.25}, 0.55 + i * 0.02);
  }
  tl.fromTo('#logo', {opacity: 0, scale: 0.86, filter: 'blur(14px)'}, {opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.8}, 0.55);
  tl.fromTo('#ring', {opacity: 0.9, scale: 0.4}, {opacity: 0, scale: 1.2, duration: 1.5, ease: 'power1.out', immediateRender: false}, 0.6);
  K.say(tl, '#claim', 1.0, {stagger: 0.06});
  S.arrive(tl, '#tag', 1.7, {dist: 18});
  S.arrive(tl, '#ct', 2.0, {dist: 18});
  tl.fromTo('#lw', {y: 0}, {y: -8, duration: S.dur, ease: 'none'}, 0);
</script>
</body></html>
