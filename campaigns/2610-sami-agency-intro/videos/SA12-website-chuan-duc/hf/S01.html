<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/inter/700.css"><link rel="stylesheet" href="_fonts/inter/800.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css"><link rel="stylesheet" href="_fonts/playfair-display/600-italic.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css"><link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S01 · Hook: tấm kính lóe sáng bay xoáy vào thành trang Quán Mây trên điện thoại, giật tách 7 lát (glitch) rồi khít lại; khung ngắm khoá vào. */
  #head { top: 1420px; font-size: 76px; }
  [data-ratio="16x9"] #head { left: 110px; right: auto; width: 760px; top: 380px; text-align: left; font-size: 74px; }
  .ret { position: absolute; z-index: 32; pointer-events: none; }
  .ret i { position: absolute; width: 54px; height: 54px; border: 0 solid var(--acc); }
  .ret i:nth-child(1) { left: 0; top: 0; border-left-width: 4px; border-top-width: 4px; }
  .ret i:nth-child(2) { right: 0; top: 0; border-right-width: 4px; border-top-width: 4px; }
  .ret i:nth-child(3) { left: 0; bottom: 0; border-left-width: 4px; border-bottom-width: 4px; }
  .ret i:nth-child(4) { right: 0; bottom: 0; border-right-width: 4px; border-bottom-width: 4px; }
  .ret b { position: absolute; left: 0; top: -50px; font-family: "JetBrains Mono"; font-weight: 600; font-size: 26px; letter-spacing: .14em; color: var(--acc); white-space: nowrap; }
  .ret em { position: absolute; right: 0; bottom: -46px; font-style: normal; font-family: "JetBrains Mono"; font-weight: 600; font-size: 20px; letter-spacing: .08em; color: var(--ink2); white-space: nowrap; }
  .scan { position: absolute; left: 0; right: 0; height: 3px; background: var(--acc); box-shadow: 0 0 22px var(--acc); opacity: 0; z-index: 31; }
  #glint { position: absolute; width: 900px; height: 900px; margin: -450px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.75), rgba(8,221,164,.25) 18%, transparent 55%); opacity: 0; z-index: 2; }
</style></head>
<body>
<div id="root" data-composition-id="S01"><div id="stage" class="clip">
  <div id="glint"></div>
  <div id="head" class="hd shadow" data-copy="S01_head"></div>
</div></div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, K = window.K, tl = S.timeline(), P = K.P, stage = K.$('#stage');
  K.bg(tl, stage, {seed: 7});
  const W = P ? 470 : 360, pg = K.rig(stage, W), st = pg.st, sub = K.sub();
  const CX = P ? 540 : 1320, CY = P ? 790 : 540;
  pg.L[2].style.boxShadow = '0 0 0 12px #0B0B12, 0 0 0 14px #2B2A3C, 0 60px 120px rgba(0,0,0,.6)';
  pg.L[7].style.display = 'none';
  Object.assign(st, {x: CX, y: CY, gap: 0});
  const G = K.$('#glint'); G.style.left = CX + 'px'; G.style.top = CY + 'px';
  // tấm kính bay xoáy vào
  sub.fromTo(st, {s: 0.15, rx: 70, ry: -50, rz: 40, y: CY + 300}, {s: 1, rx: 0, ry: 0, rz: 0, y: CY, duration: 1.15}, 0.05);
  tl.fromTo(G, {opacity: 0, scale: 0.3}, {opacity: 1, scale: 1, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out'}, 0.05);
  // giật tách 7 lát rồi khít lại (glitch)
  const g0 = K.b(2.6);
  sub.to(st, {rx: 24, ry: -16, duration: 0.18, ease: 'power3.out'}, g0);
  sub.to(st, {rx: 0, ry: 0, duration: 0.3}, g0 + 0.32);
  sub.to(st, {s: 1.04, duration: 3.6, ease: 'none'}, 1.3);
  K.tick(tl, (t) => {
    sub.seek(t);
    const k = K.clamp((t - g0) / 0.12, 0, 1) * (1 - K.clamp((t - g0 - 0.3) / 0.16, 0, 1));
    const f = Math.floor(t * 30);
    for (let i = 0; i < 8; i++) { st.lift[i] = (i - 3.5) * 70 * k; pg.L[i].style.translate = k > 0 ? ((S.rnd(f * 3 + i) - 0.5) * 30 * k) + 'px 0' : ''; }
    st.ex = k; st.glass = k;
    pg.apply();
  });
  // khung ngắm khoá vào điện thoại
  const H = W * 2.08, ret = K.el('div', 'ret', '<i></i><i></i><i></i><i></i><b data-copy="S01_hud"></b><em>QUAN-MAY.DE</em>', stage);
  ret.querySelector('b').innerHTML = S.html('S01_hud');
  ret.style.cssText += 'left:' + (CX - W / 2 - 40) + 'px;top:' + (CY - H / 2 - 40) + 'px;width:' + (W + 80) + 'px;height:' + (H + 80) + 'px';
  tl.fromTo(ret, {opacity: 0, scale: 1.25}, {opacity: 1, scale: 1, duration: 0.5}, K.b(4.2));
  const sc = K.el('div', 'scan', null, ret);
  tl.fromTo(sc, {top: 0, opacity: 0}, {top: H + 76, opacity: 1, duration: 1.2, ease: 'none'}, K.b(4.8));
  tl.to(sc, {opacity: 0, duration: 0.2}, K.b(4.8) + 1.1);
  K.say(tl, '#head', K.b(1.6), {stagger: 0.06});
</script>
</body></html>
