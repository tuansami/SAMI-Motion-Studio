<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/inter/700.css"><link rel="stylesheet" href="_fonts/inter/800.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css"><link rel="stylesheet" href="_fonts/playfair-display/600-italic.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css"><link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S11 · Sập lại: chồng 7 lớp + nền móng SEO sáng lên → các lớp khớp lại từ dưới lên → xoay về chính diện thành một màn hình hoàn chỉnh. */
  #head { top: 236px; font-size: 64px; left: 60px; right: 60px; }
  [data-ratio="16x9"] #head { left: 100px; right: auto; width: 800px; top: 380px; text-align: left; font-size: 58px; }
  .lbl .nm { font-size: 26px; }
  #ring { position: absolute; width: 900px; height: 900px; margin: -450px; border-radius: 50%; border: 3px solid rgba(8,221,164,.6); opacity: 0; z-index: 3; }
</style></head>
<body>
<div id="root" data-composition-id="S11"><div id="stage" class="clip">
  <div id="ring"></div>
  <div id="head" class="hd shadow" data-copy="S11_head"></div>
</div></div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, K = window.K, tl = S.timeline(), P = K.P, stage = K.$('#stage');
  K.bg(tl, stage, {seed: 41});
  const fl = K.el('div', 'floor', null, stage); fl.style.top = (P ? 1520 : 880) + 'px'; if (!P) fl.style.left = '60%';
  const W = P ? 440 : 380, pg = K.rig(stage, W), st = pg.st, sub = K.sub();
  const CX = P ? 540 : 1220, CY = P ? 1180 : 560, GAP = P ? 100 : 92;
  Object.assign(st, {x: CX, y: CY, s: P ? 0.8 : 0.78, rx: 58, rz: -28, ry: 4, gap: 0, ex: 1, glass: 1, bg: 0.12});
  const C0 = K.b(3.4), FL = K.b(7.0), ACC = K.b(9.0);
  // nền móng sáng lên
  pg.L[0].style.boxShadow = '';
  sub.fromTo(pg.L[0], {filter: 'brightness(1)'}, {filter: 'brightness(1.9)', duration: 0.5, yoyo: true, repeat: 1}, K.b(1.2));
  // xoay về chính diện + phóng lên thành màn hình hoàn chỉnh
  sub.to(st, {rz: -32, duration: C0, ease: 'none'}, 0);
  sub.to(st, {rx: 0, rz: 0, ry: 0, s: P ? 1.2 : 1.12, y: P ? 1050 : 540, glass: 0, bg: 1, duration: 1.3}, FL);
  sub.to(st, {ex: 0, duration: 0.6}, FL + 0.2);
  K.tick(tl, (t) => {
    sub.seek(t);
    for (let i = 0; i < 8; i++) { const a = C0 + i * 0.16; st.lift[i] = (i - 3.5) * GAP * (1 - K.ramp(t, a, a + 0.42)); }
    st.op[7] = 1 - K.ramp(t, ACC, ACC + 0.4);
    pg.apply();
  });
  // nhãn nền móng
  const a0 = K.el('i', 'anc', null, pg.L[0]); a0.style.left = '100%'; a0.style.top = '30%';
  const ld = K.leads(stage, [{anc: a0, ix: '08', nm: S.html('L0'), sp: '&lt;title&gt; · &lt;h1&gt; · schema.org', x: P ? 640 : 1500, y: P ? 1560 : 900, align: P ? 'left' : 'left', at: K.b(1.0), outAt: C0 - 0.2}]);
  K.tick(tl, (t) => ld.update(t));
  const R = K.$('#ring'); R.style.left = CX + 'px'; R.style.top = (P ? 1050 : 540) + 'px';
  tl.fromTo(R, {opacity: 0.9, scale: 0.4}, {opacity: 0, scale: 1.3, duration: 1.2, ease: 'power1.out', immediateRender: false}, FL + 1.2);
  K.say(tl, '#head', K.b(0.6));
</script>
</body></html>
