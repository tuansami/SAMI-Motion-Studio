<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/inter/700.css"><link rel="stylesheet" href="_fonts/inter/800.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css"><link rel="stylesheet" href="_fonts/playfair-display/600-italic.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css"><link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S12 · Case thật: 4 tấm kính ảnh nhà hàng chồng isometric, lần lượt nhấc ra xoè thành lưới 2×2 kèm thông số đã công bố. */
  #head { top: 236px; font-size: 64px; left: 60px; right: 60px; }
  [data-ratio="16x9"] #head { left: 100px; right: auto; width: 560px; top: 360px; text-align: left; font-size: 62px; }
  .cs { position: absolute; border-radius: 26px; overflow: hidden; background: #15122B; box-shadow: 0 0 0 1.5px rgba(227,228,247,.35), 0 40px 80px rgba(0,0,0,.55); z-index: 10; }
  .cs .im { position: absolute; left: 0; right: 0; top: 0; background-size: cover; background-position: center; }
  .cs .im:after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(21,18,43,.85)); }
  .cs .ix { position: absolute; left: 22px; top: 18px; font-family: "JetBrains Mono"; font-weight: 600; font-size: 22px; color: #0C0628; background: var(--acc); padding: 3px 10px; border-radius: 6px; }
  .cs .tx { position: absolute; left: 24px; right: 20px; bottom: 20px; }
  .cs b { display: block; font-family: "Be Vietnam Pro"; font-weight: 800; font-size: 34px; color: #fff; line-height: 1.15; }
  .cs .ct { display: block; font-family: "JetBrains Mono"; font-weight: 600; font-size: 19px; letter-spacing: .08em; color: var(--acc); margin: 4px 0 10px; text-transform: uppercase; }
  .cs .sp { display: block; font-family: "Be Vietnam Pro"; font-weight: 500; font-size: 24px; line-height: 1.3; color: var(--ink2); }
  #src { z-index: 40; }
</style></head>
<body>
<div id="root" data-composition-id="S12"><div id="stage" class="clip">
  <div id="head" class="hd shadow" data-copy="S12_head"></div>
  <div id="src" class="note">NGUỒN: SAMI-AGENCY.DE/OUR-PROJECTS</div>
</div></div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, K = window.K, tl = S.timeline(), P = K.P, stage = K.$('#stage');
  K.bg(tl, stage, {seed: 51});
  const C = [['mizuki', 'Mizuki', 'Baden-Baden', 'S12_k1'], ['vi', 'Vị Vietnamese Cuisine', 'Schliersee', 'S12_k2'], ['an', 'An Vegan', 'Karlsruhe', 'S12_k3'], ['84kitchen', '+84 Kitchen', 'Kempten', 'S12_k4']];
  const G = P ? {x: 60, y: 520, w: 470, h: 520, gx: 20, gy: 22, ih: 270} : {x: 720, y: 70, w: 530, h: 455, gx: 24, gy: 26, ih: 250};
  const cards = C.map((c, i) => {
    const e = K.el('div', 'cs', '<div class="im" style="height:' + G.ih + 'px;background-image:url(public/img/case-' + c[0] + '.webp)"></div><span class="ix">0' + (i + 1) + '</span><div class="tx"><b>' + c[1] + '</b><span class="ct">' + c[2] + '</span><span class="sp">' + S.html(c[3]) + '</span></div>', stage);
    e.style.left = (G.x + (i % 2) * (G.w + G.gx)) + 'px'; e.style.top = (G.y + Math.floor(i / 2) * (G.h + G.gy)) + 'px'; e.style.width = G.w + 'px'; e.style.height = G.h + 'px';
    return e;
  });
  const src = K.$('#src'); if (P) { src.style.left = '60px'; src.style.top = (G.y + 2 * G.h + G.gy + 22) + 'px'; } else { src.style.left = '100px'; src.style.top = '960px'; }
  // từ chồng isometric giữa khung → nhấc ra vị trí lưới
  const cx = P ? 540 : 1270, cy = P ? 1060 : 540;
  cards.forEach((e, i) => {
    const ex = parseFloat(e.style.left) + G.w / 2, ey = parseFloat(e.style.top) + G.h / 2;
    tl.fromTo(e, {x: cx - ex, y: cy - ey - (3 - i) * 0 + i * -40, rotationX: 58, rotationZ: -32, scale: 0.7, opacity: 0, transformPerspective: 2200, z: i * 60},
      {x: 0, y: 0, rotationX: 0, rotationZ: 0, scale: 1, opacity: 1, z: 0, duration: 1.0}, 0.2 + i * 0.22);
  });
  // xoè lần lượt (mỗi thẻ một nhịp)
  cards.forEach((e, i) => tl.set(e, {zIndex: 20 - i}, 0));
  tl.fromTo(cards.map((e) => e.querySelector('.tx')), {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: 0.5, stagger: K.B}, K.b(2.6));
  tl.fromTo(cards.map((e) => e.querySelector('.ix')), {opacity: 0, scale: 0.5}, {opacity: 1, scale: 1, duration: 0.3, stagger: K.B}, K.b(2.4));
  cards.forEach((e, i) => tl.fromTo(e.querySelector('.im'), {scale: 1.12}, {scale: 1.0, duration: S.dur, ease: 'none'}, 0));
  S.arrive(tl, '#src', K.b(6), {dist: 10});
  K.say(tl, '#head', K.b(0.6));
</script>
</body></html>
