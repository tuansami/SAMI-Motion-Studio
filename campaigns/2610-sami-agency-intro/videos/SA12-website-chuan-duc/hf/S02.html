<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/inter/700.css"><link rel="stylesheet" href="_fonts/inter/800.css">
<link rel="stylesheet" href="_fonts/playfair-display/700.css"><link rel="stylesheet" href="_fonts/playfair-display/600-italic.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css"><link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S02 · Nỗi đau: website "làm cho có" trên điện thoại; danh sách 7 điểm quét, trượt từng dòng ✗, 0/7; ngón cái bấm quay lại. */
  #head { font-size: 66px; }
  #sub { font-size: 44px; }
  [data-ratio="9x16"] #head { top: 1190px; } [data-ratio="9x16"] #sub { top: 1290px; }
  [data-ratio="16x9"] #head { left: 100px; right: auto; width: 760px; top: 330px; text-align: left; }
  [data-ratio="16x9"] #sub { left: 100px; right: auto; width: 760px; top: 440px; text-align: left; }
  .ph2 { position: absolute; width: 420px; height: 870px; border-radius: 64px; background: #0B0B12; box-shadow: 0 0 0 3px #2B2A3C, 0 0 0 9px #101018, 0 60px 120px rgba(0,0,0,.6); z-index: 5; }
  .ph2 .scr { position: absolute; inset: 16px; border-radius: 50px; overflow: hidden; background: #fff; }
  .old { position: absolute; left: 0; top: 104px; width: 700px; transform-origin: 0 0; font-family: "Times New Roman", serif; color: #222; }
  .old .hb { height: 120px; background: linear-gradient(#8B0000, #5a0000); color: #FFD700; font-size: 46px; font-weight: 700; display: flex; align-items: center; padding-left: 20px; }
  .old .mq { background: #FFFF99; font-size: 20px; padding: 6px 12px; white-space: nowrap; color: #c00; }
  .old .bx { margin: 16px; height: 330px; border: 2px dashed #bbb; background: #f2f2f2; display: flex; align-items: center; justify-content: center; color: #999; font-size: 22px; font-family: Arial; }
  .old p { margin: 10px 16px; font-size: 19px; line-height: 1.4; }
  .old .tb { margin: 10px 16px; border: 1px solid #999; font-size: 18px; }
  .old .tb div { padding: 6px; border-bottom: 1px solid #ccc; }
  .bro { position: absolute; left: 0; right: 0; top: 0; height: 92px; background: #EDEDF0; z-index: 3; display: flex; align-items: flex-end; padding: 0 16px 12px; box-sizing: border-box; gap: 12px; font-family: Inter; }
  .bro .bk { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #333; }
  .bro .url { flex: 1; height: 38px; border-radius: 12px; background: #fff; font-size: 18px; color: #555; display: flex; align-items: center; padding-left: 12px; }
  .ld2 { position: absolute; left: 0; top: 92px; height: 5px; width: 100%; background: #2B7CF6; transform-origin: 0 50%; z-index: 4; }
  .spin { position: absolute; left: 50%; top: 46%; width: 70px; height: 70px; margin: -35px; border-radius: 50%; border: 7px solid rgba(0,0,0,.12); border-top-color: #555; z-index: 4; }
  .chk { position: absolute; z-index: 6; }
  .chk .hdr { font-family: "JetBrains Mono"; font-weight: 600; font-size: 24px; letter-spacing: .14em; color: var(--ink2); display: flex; justify-content: space-between; margin-bottom: 14px; }
  .chk .hdr b { color: var(--red); font-size: 30px; letter-spacing: .04em; }
  .chk .r { display: flex; align-items: center; gap: 16px; height: 84px; border-bottom: 1.5px solid rgba(227,228,247,.12); font-family: "Be Vietnam Pro"; font-weight: 600; font-size: 30px; color: var(--ink); }
  .chk .r i { width: 44px; height: 44px; border-radius: 12px; flex: none; box-shadow: inset 0 0 0 2px rgba(227,228,247,.3); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 28px; font-weight: 800; color: transparent; }
  .chk .r.x i { background: rgba(255,84,104,.18); box-shadow: inset 0 0 0 2px var(--red); color: var(--red); }
  .chk .r.x span { color: rgba(241,239,233,.55); text-decoration: line-through; text-decoration-color: rgba(255,84,104,.7); }
  .sweep { position: absolute; left: -10px; right: -10px; height: 84px; background: linear-gradient(90deg, transparent, rgba(8,221,164,.18), transparent); opacity: 0; }
  #mh { position: absolute; z-index: 40; }
</style></head>
<body>
<div id="root" data-composition-id="S02"><div id="stage" class="clip">
  <div id="head" class="hd shadow" data-copy="S02_head"></div>
  <div id="sub" class="sub shadow" data-copy="S02_sub"></div>
  <div id="mh" class="note">MINH HỌA</div>
</div></div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, K = window.K, tl = S.timeline(), P = K.P, stage = K.$('#stage');
  K.bg(tl, stage, {seed: 9});
  const ph = K.el('div', 'ph2', '<div class="scr"><div class="bro"><span class="bk">←</span><span class="url">asia-restaurant-leipzig.de</span></div><div class="ld2"></div><div class="old" id="old">' +
    '<div class="hb">★ ASIA RESTAURANT ★</div><div class="mq">+++ Herzlich Willkommen auf unserer Homepage +++ Neu: Mittagsmenü +++</div><div class="bx">[ Bild wird geladen … ]</div>' +
    '<p>Wir bieten Ihnen eine große Auswahl an asiatischen Spezialitäten. Öffnungszeiten siehe unten. Speisekarte als Download (PDF, 14 MB).</p>' +
    '<div class="tb"><div>Mo–So 11–22 Uhr</div><div>Reservierung nur telefonisch!</div><div>© 2014</div></div></div><div class="spin" id="spin"></div></div>', stage);
  const PX = P ? 72 : 1000, PY = P ? 250 : 105;
  ph.style.left = PX + 'px'; ph.style.top = PY + 'px'; if (!P) ph.style.transform = 'scale(.97)';
  K.$('#old').style.transform = 'scale(.6)';
  const mh = K.$('#mh'); mh.style.left = (PX + 150) + 'px'; mh.style.top = (PY + 892) + 'px'; if (!P) { mh.style.top = (PY + 855) + 'px'; }
  // danh sách kiểm 7 điểm
  const items = S.text('S02_list').split('|');
  const ck = K.el('div', 'chk', '<div class="hdr"><span>PRÜFUNG</span><b id="cnt">0 / 7</b></div>', stage);
  ck.style.cssText += P ? 'left:536px;width:472px;top:300px' : 'left:1440px;width:420px;top:120px';
  const rows = items.map((n) => K.el('div', 'r', '<i>✗</i><span>' + n + '</span>', ck));
  const sw = K.el('div', 'sweep', null, ck);
  tl.fromTo(ph, {opacity: 0, x: -60}, {opacity: 1, x: 0, duration: 0.7}, 0.1);
  tl.fromTo('.ld2', {scaleX: 0.02}, {scaleX: 0.34, duration: 4.4, ease: 'none'}, 0.3);
  tl.fromTo('#spin', {rotation: 0}, {rotation: 1440, duration: 5.5, ease: 'none'}, 0.2);
  tl.to('#spin', {opacity: 0, duration: 0.3}, K.b(5));
  tl.fromTo('#old', {y: 0}, {y: -60, duration: 0.6}, K.b(5.2));
  S.arrive(tl, [ck.firstChild].concat(rows), 0.4, {dist: 16, blur: 6, stagger: 0.06});
  const r0 = K.b(2.6), dt = 0.36;
  rows.forEach((r, i) => {
    tl.set(r, {className: 'r x'}, r0 + i * dt + 0.18);
    tl.fromTo(r.querySelector('i'), {scale: 1.6}, {scale: 1, duration: 0.25}, r0 + i * dt + 0.18);
  });
  tl.fromTo(sw, {top: 44, opacity: 1}, {top: 44 + 84 * 7, duration: dt * 7, ease: 'none'}, r0);
  tl.to(sw, {opacity: 0, duration: 0.2}, r0 + dt * 7);
  K.glitch(tl, K.$('#cnt'), [[r0 + dt * 7, 0.3]], 18, 5);
  // ngón cái bấm "←": trang trượt mất
  const back = K.b(10.2), th = K.el('i', 'touch', null, stage), bxx = PX + 16 + 16 + 17, byy = PY + 16 + 92 - 12 - 17;
  tl.fromTo(th, {x: bxx, y: byy, opacity: 0, scale: 1.3}, {opacity: 1, scale: 0.85, duration: 0.2, immediateRender: false}, back - 0.15);
  tl.to(th, {opacity: 0, duration: 0.2}, back + 0.15);
  K.ring(tl, stage, bxx, byy, back, '#FF5468');
  tl.to(['#old', '.ld2'], {x: 420, opacity: 0, duration: 0.45, ease: 'power2.in'}, back + 0.1);
  K.say(tl, '#head', K.b(0.6));
  K.say(tl, '#sub', K.b(4.4), {stagger: 0.05});
</script>
</body></html>
