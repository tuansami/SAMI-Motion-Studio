<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/800.css">
<link rel="stylesheet" href="hf/parts/dk.css">
<style>
  /* S03 · PHẢI CHỌN: hai khối ADS / SEO trượt vào hai phía, con trỏ lưỡng lự giữa hai khối */
  #hd { left: var(--safe-side); right: var(--safe-side); top: 262px; font-size: 92px; }
  .opt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .opt b { font: 800 96px/1 "JetBrains Mono", monospace; color: #fff; letter-spacing: .02em; }
  .opt span { font: 800 50px/1.2 "Be Vietnam Pro", sans-serif; }
  .opt.ads span { color: #FF8A8F; } .opt.seo span { color: #5EF0C8; }
  #or { position: absolute; z-index: 9; font: 500 40px/1 "Be Vietnam Pro", sans-serif; color: var(--dim); transform: translate(-50%, -50%); }
  #cur { position: absolute; z-index: 12; width: 64px; height: 80px; left: 0; top: 0; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .6)); }
  [data-ratio="16x9"] #hd { left: 120px; right: auto; width: 840px; top: 390px; font-size: 84px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S03">
  <div class="hd" id="hd" data-copy="S03_headline"></div>
  <div id="or">hoặc</div>
  <svg id="cur" viewBox="0 0 32 40"><path d="M3 2 L3 31 L10.5 24.5 L15.5 36 L20.5 33.8 L15.6 22.6 L25.5 22.6 Z" fill="#fff" stroke="#0C0628" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
<script src="hf/parts/dk.js"></script>
<script>
  const S = window.SAMI, D = window.DK, tl = S.timeline(), root = D.$('#root'), L16 = S.landscape;
  const st = D.stage(root, {horizon: L16 ? 790 : 1250, beamX: L16 ? 0.72 : 0.5});
  const R = L16 ? {a: [1010, 320], b: [1450, 320], w: 360} : {a: [150, 700], b: [590, 700], w: 340};
  const A = D.box(root, {x: R.a[0], y: R.a[1], w: R.w, h: R.w, d: 54, cls: 'ads', rx: -14, ry: 14, left: true});
  const B = D.box(root, {x: R.b[0], y: R.b[1], w: R.w, h: R.w, d: 54, cls: 'seo', rx: -14, ry: -14});
  [A, B].forEach((x) => (x.wrap.style.zIndex = 8));
  A.f.innerHTML = '<div class="opt ads"><b>ADS</b><span>' + S.text('S03_a') + '</span></div>';
  B.f.innerHTML = '<div class="opt seo"><b>SEO</b><span>' + S.text('S03_b') + '</span></div>';
  const pa = D.el('div', 'pool ads', root), pb = D.el('div', 'pool seo', root);
  [[pa, R.a], [pb, R.b]].forEach(([p, q]) => { p.style.cssText += ';left:' + (q[0] - 50) + 'px;top:' + (q[1] + R.w - 20) + 'px;width:' + (R.w + 100) + 'px;height:110px;z-index:3'; });
  const mid = [(R.a[0] + R.b[0] + R.w) / 2, R.a[1] + R.w / 2];
  D.$('#or').style.left = mid[0] + 'px'; D.$('#or').style.top = mid[1] + 'px';
  // con trỏ: ghé ADS → ghé SEO → lưỡng lự ở giữa
  const KEYS = [[0.6, mid[0] + 40, mid[1] + 420], [1.4, R.a[0] + R.w * 0.62, R.a[1] + R.w * 0.72], [2.5, R.b[0] + R.w * 0.38, R.b[1] + R.w * 0.72], [3.5, mid[0] - 10, mid[1] + 230], [4.8, mid[0] + 4, mid[1] + 236]];
  function cur(t) {
    if (t <= KEYS[0][0]) return [KEYS[0][1], KEYS[0][2]];
    for (let i = 1; i < KEYS.length; i++) if (t <= KEYS[i][0]) { const u = D.E(t, KEYS[i - 1][0], KEYS[i][0]); return [D.mix(KEYS[i - 1][1], KEYS[i][1], u), D.mix(KEYS[i - 1][2], KEYS[i][2], u)]; }
    const k = KEYS[KEYS.length - 1]; return [k[1], k[2]];
  }
  D.clock(tl, (t) => {
    st.update(t, {light: 0.85, speed: 20, glowA: {x: R.a[0] + R.w / 2, y: R.a[1] + R.w / 2, a: 0.45}, glowB: {x: R.b[0] + R.w / 2, y: R.b[1] + R.w / 2, a: 0.42}});
    const ia = D.E(t, 0.1, 0.8), ib = D.E(t, 0.25, 0.95);
    const p = cur(t), hovA = Math.max(0, 1 - Math.abs(t - 1.75) / 0.7), hovB = Math.max(0, 1 - Math.abs(t - 2.85) / 0.7);
    A.pose(D.mix(-520, 0, ia), Math.sin(t * 1.2) * 5, Math.sin(t * 0.7) * 2, 1 + 0.05 * D.EASE(hovA));
    B.pose(D.mix(520, 0, ib), Math.sin(t * 1.2 + 1.5) * 5, Math.sin(t * 0.7 + 1) * 2, 1 + 0.05 * D.EASE(hovB));
    A.wrap.style.opacity = ia; B.wrap.style.opacity = ib;
    pa.style.opacity = (0.6 + 0.4 * hovA) * ia; pb.style.opacity = (0.6 + 0.4 * hovB) * ib;
    D.$('#cur').style.transform = 'translate(' + p[0].toFixed(1) + 'px,' + p[1].toFixed(1) + 'px)';
    D.$('#cur').style.opacity = D.L(t, 0.5, 0.8);
    D.$('#or').style.opacity = D.L(t, 0.9, 1.3) * 0.9;
  });
  D.words(tl, '#hd', 0.4, {stagger: 0.07});
</script>
</body>
</html>
