<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/ibm-plex-mono/500.css">
<link rel="stylesheet" href="hf/parts/nr.css">
<style>
  /* S11 · end card SAMI: vòng sóng co thành bong bóng chat (vẽ bằng code), số WhatsApp, ưu đãi, logo + tagline */
  [data-composition-id] { background: #0C0628; }
  #glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, rgba(118, 103, 254, .28), rgba(12, 6, 40, 0) 55%), radial-gradient(circle at 50% 80%, rgba(8, 221, 164, .14), rgba(12, 6, 40, 0) 50%); }
  #ring { position: absolute; z-index: 3; left: 50%; top: 40%; width: 1800px; height: 1800px; margin: -900px 0 0 -900px; border-radius: 50%; border: 3px solid #08DDA4; }
  #wrap { position: absolute; z-index: 5; left: var(--safe-side); right: var(--safe-side); top: 420px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  #bubble { position: relative; padding: 40px 54px 44px; border-radius: 48px 48px 48px 12px; background: linear-gradient(135deg, #12C98E, #08DDA4); color: #052019; box-shadow: 0 30px 80px rgba(8, 221, 164, .35); }
  #bubble:after { content: ""; position: absolute; left: -2px; bottom: -26px; width: 50px; height: 40px; background: #0DD39A; clip-path: polygon(0 0, 100% 0, 0 100%); }
  #bubble .ic { position: absolute; left: -34px; top: -34px; width: 78px; height: 78px; border-radius: 50%; background: #0C0628; border: 3px solid #08DDA4; display: flex; align-items: center; justify-content: center; }
  #bubble .ic svg { width: 40px; height: 40px; }
  #cta { font: 700 50px/1.2 "Be Vietnam Pro", sans-serif; }
  #phone { font: 800 78px/1.15 "Be Vietnam Pro", sans-serif; letter-spacing: -.01em; margin-top: 8px; white-space: nowrap; }
  #offer { margin-top: 70px; font: 500 38px/1.38 "Be Vietnam Pro", sans-serif; color: #E3E4F7; }
  #logo { margin-top: 90px; width: 560px; }
  #tag { margin-top: 26px; font: 500 24px/1.4 "IBM Plex Mono", monospace; letter-spacing: .06em; color: #A8A3C9; }
  #web { margin-top: 14px; font: 700 40px/1.2 "Be Vietnam Pro", sans-serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  [data-ratio="16x9"] #wrap { left: 0; right: 0; top: 0; bottom: 0; display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; justify-items: center; padding: 0 120px; gap: 80px; }
  [data-ratio="16x9"] #colA, [data-ratio="16x9"] #colB { display: flex; flex-direction: column; align-items: center; }
  [data-ratio="16x9"] #colA { align-items: flex-start; text-align: left; }
  [data-ratio="16x9"] #offer { margin-top: 70px; font-size: 36px; }
  [data-ratio="16x9"] #tag { white-space: nowrap; font-size: 21px; }
  [data-ratio="16x9"] #logo { margin-top: 0; width: 620px; }
  [data-ratio="16x9"] #ring { left: 28%; top: 50%; }
  #colA, #colB { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="S11">
  <div id="glow"></div>
  <div id="ring"></div>
  <div id="wrap">
    <div id="colA">
      <div id="bubble">
        <div class="ic"><svg viewBox="0 0 40 40" fill="none" stroke="#08DDA4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 30 L10 23 A12 12 0 1 1 16 30 Z"/></svg></div>
        <div id="cta" data-copy="S11_cta"></div>
        <div id="phone" data-copy="S11_phone"></div>
      </div>
      <div id="offer" data-copy="S11_offer"></div>
    </div>
    <div id="colB">
      <img id="logo" src="public/img/logo-white.svg">
      <div id="tag" data-copy="S11_tagline"></div>
      <div id="web" data-copy="S11_web"></div>
    </div>
  </div>
</div>
<script>
  const S = window.SAMI, tl = S.timeline(), $ = (s) => document.querySelector(s);
  const E = (t, a, b) => S.EASE(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const c = {t: 0};
  const draw = () => { const k = E(c.t, 0, 0.7); $('#ring').style.transform = 'scale(' + (1 - 0.8 * k).toFixed(3) + ')'; $('#ring').style.opacity = (1 - k).toFixed(3); };
  tl.to(c, {t: S.dur, duration: S.dur, ease: 'none', onUpdate: draw}, 0); draw();
  tl.fromTo('#bubble', {opacity: 0, scale: 0.5, y: 40}, {opacity: 1, scale: 1, y: 0, duration: 0.7}, 0.35);
  S.arrive(tl, '#offer', 1.0);
  S.arrive(tl, '#logo', 1.6, {dist: 30});
  S.arrive(tl, '#tag', 2.0, {dist: 20, blur: 6});
  S.arrive(tl, '#web', 2.2, {dist: 20, blur: 6});
</script>
</body>
</html>
