<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/ibm-plex-mono/500.css">
<link rel="stylesheet" href="hf/parts/nr.css">
<style>
  /* S03 · chấm người đi theo phố sang quán khác; quán bạn mờ đi, bếp vẫn bốc hơi */
  .scrim.top { top: 0; height: 860px; background: linear-gradient(#070420 0%, rgba(7, 4, 32, .9) 45%, rgba(7, 4, 32, 0) 100%); }
  #hd { left: var(--safe-side); right: var(--safe-side); top: 300px; font-size: 70px; }
  #eta { position: absolute; z-index: 6; font: 500 24px/1 "IBM Plex Mono", monospace; color: #fff; letter-spacing: .1em; padding: 9px 14px; border-radius: 10px; background: rgba(7, 4, 32, .85); border: 1px solid rgba(227, 228, 247, .35); white-space: nowrap; transform: translate(-50%, -100%); }
  #steam { position: absolute; z-index: 5; left: 0; top: 0; width: 120px; height: 160px; }
  #steam path { fill: none; stroke: #E3E4F7; stroke-width: 4; stroke-linecap: round; }
  #status { position: absolute; z-index: 6; font: 500 22px/1.3 "IBM Plex Mono", monospace; letter-spacing: .12em; color: #8D87B8; text-transform: uppercase; white-space: nowrap; }
  [data-ratio="16x9"] .scrim.top { width: 1100px; right: auto; height: auto; bottom: 0; background: linear-gradient(90deg, #070420 0%, rgba(7, 4, 32, .88) 60%, rgba(7, 4, 32, 0) 100%); }
  [data-ratio="16x9"] #hd { left: 120px; right: auto; width: 800px; top: 330px; font-size: 72px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S03">
  <div class="grid" id="grid"></div>
  <div id="nm"></div>
  <div class="scrim top"></div>
  <div class="hd" id="hd" data-copy="S03_headline"></div>
  <div id="eta">ETA 3 MIN</div>
  <svg id="steam" viewBox="0 0 120 160"><path id="s1" d=""/><path id="s2" d=""/><path id="s3" d=""/></svg>
  <div id="status">Küche: heiß · Tische: frei</div>
</div>
<script src="hf/parts/nightmap.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), NM = window.NM, $ = (s) => document.querySelector(s);
  const L16 = S.landscape;
  NM.init($('#nm'));
  const you = NM.pin(NM.YOU, {kind: 'you', label: 'Phở Mây<small>quán của bạn</small>'});
  const named = {r1: 'Quán Gió', r2: 'Bếp Sen', r3: 'Nhà Tre'};
  const rivals = NM.RIVALS.map((r) => ({r, p: NM.pin(r, {kind: 'rival', label: named[r.id] || ''})}));
  const R1 = NM.RIVALS[0];
  const path = NM.polyFn([NM.PERSON, {x: 922, y: 1432}, {x: 922, y: 1352}, {x: 1000, y: 1350}, R1]);
  const route = NM.route({color: '#E3E4F7', w: 6});
  const ghost = NM.route({color: '#E3E4F7', w: 3, dash: '4 12'});
  const me = NM.dot({color: '#E3E4F7'});
  const motes = NM.motes($('#root'), 24, 37);
  const walk = (t) => NM.E(t, 0.6, 4.6);
  const steamPath = (t, ph, x) => { let d = ''; for (let i = 0; i <= 12; i++) { const y = 150 - i * 11; const xx = x + Math.sin(i * 0.6 + t * 3 + ph) * 9 * (i / 12); d += (i ? 'L' : 'M') + xx.toFixed(1) + ' ' + y; } return d; };

  const draw = (t) => {
    const u = walk(t), pos = path(u);
    const z = NM.E(t, 0, 3.5);
    const cx = NM.mix(NM.PERSON.x + 40, (pos.x + NM.YOU.x) / 2, z), cy = NM.mix(NM.PERSON.y - 40, (pos.y + NM.YOU.y) / 2 + 40, z);
    const w = L16 ? NM.mix(1751, 1200, z) : NM.mix(1390, 900, z);
    NM.cam(cx, cy, w, L16 ? 0.72 : 0.5, L16 ? 0.55 : NM.mix(0.53, 0.66, z));
    $('#grid').style.transform = 'translate(' + (-t * 6 - 90).toFixed(1) + 'px,' + (-t * 4 - 60).toFixed(1) + 'px)';
    ghost.draw(path, 1, 0.35 * (1 - NM.L(t, 4.5, 5.2)));
    route.draw(path, u, 0.9);
    me.place(pos, 1 - 0.7 * NM.E(t, 4.6, 5.2), t * 0.9, 1.3);
    const arrive = NM.E(t, 4.4, 5.0);
    rivals.forEach(({r, p}, i) => {
      const isR1 = r.id === 'r1';
      p.o = isR1 ? 0.85 + 0.15 * arrive : 0.5; p.s = isR1 ? 0.95 + 0.25 * arrive : 0.8;
      const lab = p.el.querySelector('.pin-lab'); if (lab) lab.style.opacity = isR1 ? 1 : 0.4;
    });
    you.o = 1 - 0.45 * NM.E(t, 1.5, 4.0); you.s = 1;
    NM.placePins();
    const q = NM.p(pos);
    $('#eta').style.left = q.x + 'px'; $('#eta').style.top = (q.y - 34) + 'px';
    $('#eta').style.opacity = NM.E(t, 0.9, 1.3) * (1 - NM.E(t, 4.3, 4.7));
    $('#eta').textContent = 'ETA ' + Math.max(0, Math.ceil(3 * (1 - u))) + ' MIN';
    // hơi bếp trên ghim quán bạn
    const y = NM.p(NM.YOU);
    $('#steam').style.transform = 'translate(' + (y.x - 60).toFixed(1) + 'px,' + (y.y - 270).toFixed(1) + 'px)';
    $('#steam').style.opacity = 0.55 * NM.E(t, 1.2, 2.2);
    $('#s1').setAttribute('d', steamPath(t, 0, 36)); $('#s2').setAttribute('d', steamPath(t, 2, 60)); $('#s3').setAttribute('d', steamPath(t, 4, 84));
    $('#status').style.left = (y.x + 44) + 'px'; $('#status').style.top = (y.y + 10) + 'px';
    $('#status').style.opacity = NM.E(t, 2.6, 3.2);
    motes(t);
  };
  NM.clock(tl, draw);
  S.arrive(tl, S.words($('#hd')), 0.4, {stagger: 0.06});
</script>
</body>
</html>
