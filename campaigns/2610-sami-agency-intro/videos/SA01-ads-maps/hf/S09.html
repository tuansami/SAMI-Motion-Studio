<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/ibm-plex-mono/500.css">
<link rel="stylesheet" href="hf/parts/nr.css">
<style>
  /* S09 · báo cáo tuần minh bạch: thẻ trượt lên, cột mọc, đường xu hướng vẽ, tem "Không chi phí ẩn" */
  #nm { opacity: .2; filter: blur(3px); }
  #hd { left: var(--safe-side); right: var(--safe-side); top: 290px; font-size: 66px; }
  #rep { position: absolute; z-index: 5; left: var(--safe-side); right: var(--safe-side); top: 800px; padding: 40px 42px 34px; }
  #rep .hdr { display: flex; justify-content: space-between; align-items: flex-start; }
  #rep .ttl { font: 800 46px/1.15 "Be Vietnam Pro", sans-serif; color: #fff; }
  #rep .wk { font: 500 24px/1.3 "IBM Plex Mono", monospace; letter-spacing: .1em; color: #08DDA4; margin-top: 6px; }
  #rep .logo { font: 800 28px/1 "Be Vietnam Pro", sans-serif; letter-spacing: .14em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kr { margin-top: 34px; }
  .kr .lb { display: flex; justify-content: space-between; font: 600 34px/1.2 "Be Vietnam Pro", sans-serif; color: #E3E4F7; }
  .kr .lb span:last-child { font: 500 24px/1.6 "IBM Plex Mono", monospace; color: #08DDA4; }
  .kr .tr { margin-top: 12px; height: 26px; border-radius: 14px; background: rgba(227, 228, 247, .08); overflow: hidden; }
  .kr .tr i { display: block; height: 100%; border-radius: 14px; background: var(--grad); transform-origin: 0 50%; }
  #spark { display: block; width: 100%; height: 150px; margin-top: 34px; }
  #foot { display: flex; justify-content: space-between; margin-top: 18px; font: 500 20px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; color: rgba(227, 228, 247, .5); text-transform: uppercase; }
  #stamp { position: absolute; z-index: 7; right: calc(var(--safe-side) + 10px); top: 740px; transform: rotate(-9deg); font: 800 40px/1 "Be Vietnam Pro", sans-serif; color: #08DDA4; padding: 18px 26px; border: 5px solid #08DDA4; border-radius: 16px; background: rgba(7, 4, 32, .75); box-shadow: 0 0 40px rgba(8, 221, 164, .35); white-space: nowrap; }
  [data-ratio="16x9"] #hd { left: 120px; right: auto; width: 760px; top: 330px; font-size: 68px; }
  [data-ratio="16x9"] #rep { left: auto; right: 120px; width: 860px; top: 150px; }
  [data-ratio="16x9"] #stamp { right: 860px; top: auto; bottom: 150px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S09">
  <div class="grid" id="grid"></div>
  <div id="nm"></div>
  <div class="hd" id="hd" data-copy="S09_headline"></div>
  <div class="glass" id="rep">
    <div class="hdr"><div><div class="ttl">Báo cáo tuần · Phở Mây</div><div class="wk">KW 43 · Google Ads Maps</div></div><div class="logo">SAMI</div></div>
    <div class="kr"><div class="lb"><span>Cuộc gọi</span><span>Anrufe</span></div><div class="tr"><i id="b1"></i></div></div>
    <div class="kr"><div class="lb"><span>Chỉ đường</span><span>Routen</span></div><div class="tr"><i id="b2"></i></div></div>
    <div class="kr"><div class="lb"><span>Đặt bàn</span><span>Reservierungen</span></div><div class="tr"><i id="b3"></i></div></div>
    <svg id="spark" viewBox="0 0 800 150" preserveAspectRatio="none">
      <path d="M0 149 H800" stroke="rgba(227,228,247,.15)" stroke-width="2"/>
      <path id="sp" d="M0 130 C 90 124, 150 110, 230 112 S 360 90, 440 84 S 580 62, 650 52 S 760 30, 800 26" fill="none" stroke="#08DDA4" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div id="foot"><span>Ngân sách · Kết quả · Đề xuất tuần tới</span><span>Minh họa</span></div>
  </div>
  <div id="stamp" data-copy="S09_stamp"></div>
</div>
<script src="hf/parts/nightmap.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), NM = window.NM, $ = (s) => document.querySelector(s);
  NM.init($('#nm'));
  NM.pin(NM.YOU, {kind: 'you'});
  const motes = NM.motes($('#root'), 18, 131);
  const sp = $('#sp'), len = sp.getTotalLength(); sp.style.strokeDasharray = len;
  NM.clock(tl, (t) => {
    NM.cam(NM.YOU.x, NM.YOU.y, (S.landscape ? 2500 : 1700) * (1 + 0.05 * t / S.dur), 0.5, 0.5);
    NM.placePins();
    $('#grid').style.transform = 'translate(' + (-t * 5).toFixed(1) + 'px,' + (-t * 3).toFixed(1) + 'px)';
    [['#b1', 0.62, 1.6], ['#b2', 0.8, 1.8], ['#b3', 0.48, 2.0]].forEach(([id, v, a]) => { $(id).style.transform = 'scaleX(' + (v * NM.E(t, a, a + 1.3)).toFixed(4) + ')'; });
    sp.style.strokeDashoffset = (len * (1 - NM.E(t, 2.2, 3.6))).toFixed(1);
    motes(t);
  });
  S.arrive(tl, S.words($('#hd')), 0.4, {stagger: 0.05});
  S.arrive(tl, '#rep', 1.1, {dist: 140});
  tl.fromTo('#stamp', {opacity: 0, scale: 2.2, rotate: -20}, {opacity: 1, scale: 1, rotate: -9, duration: 0.45}, 4.0);
</script>
</body>
</html>
