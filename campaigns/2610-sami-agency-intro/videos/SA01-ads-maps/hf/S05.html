<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/ibm-plex-mono/500.css">
<link rel="stylesheet" href="hf/parts/nr.css">
<style>
  /* S05 · đáy cảm xúc: tối gần đen, chỉ còn ghim quán bạn bốc hơi; cuối cảnh vòng radar co lại thành một điểm sáng */
  #nm { opacity: .22; }
  #pinwrap { position: absolute; z-index: 5; left: 50%; top: 60%; width: 0; height: 0; }
  #bigpin { position: absolute; width: 150px; height: 196px; left: -75px; top: -196px; filter: drop-shadow(0 0 40px rgba(8, 221, 164, .5)); }
  #steam { position: absolute; width: 240px; height: 300px; left: -120px; top: -520px; }
  #steam path { fill: none; stroke: #E3E4F7; stroke-width: 6; stroke-linecap: round; }
  #floor { position: absolute; left: -260px; top: -14px; width: 520px; height: 28px; border-radius: 50%; background: radial-gradient(rgba(8, 221, 164, .35), rgba(8, 221, 164, 0) 70%); }
  #lines { position: absolute; z-index: 6; left: var(--safe-side); right: var(--safe-side); top: 380px; text-align: center; }
  .ln { display: block; font-weight: 800; font-size: 112px; line-height: 1.18; letter-spacing: -.03em; color: #fff; }
  #ring { position: absolute; z-index: 7; left: 50%; top: 50%; border-radius: 50%; border: 3px solid #08DDA4; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; opacity: 0; box-shadow: 0 0 60px rgba(8, 221, 164, .6), inset 0 0 60px rgba(8, 221, 164, .4); }
  #core { position: absolute; z-index: 8; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #fff; box-shadow: 0 0 40px #08DDA4, 0 0 120px #7667FE; opacity: 0; }
  [data-ratio="16x9"] #lines { left: 120px; right: auto; width: 900px; top: 360px; text-align: left; }
  [data-ratio="16x9"] .ln { font-size: 110px; }
  [data-ratio="16x9"] #pinwrap { left: 72%; top: 66%; }
</style>
</head>
<body>
<div id="root" data-composition-id="S05">
  <div id="nm"></div>
  <div id="pinwrap">
    <div id="floor"></div>
    <svg id="steam" viewBox="0 0 240 300"><path id="s1"/><path id="s2"/><path id="s3"/></svg>
    <svg id="bigpin" viewBox="0 0 64 84"><defs><linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08DDA4"/><stop offset="1" stop-color="#7667FE"/></linearGradient></defs><path d="M32 82 C32 82 4 50 4 30 A28 28 0 0 1 60 30 C60 50 32 82 32 82Z" fill="url(#g5)"/><circle cx="32" cy="30" r="11" fill="#0C0628"/></svg>
  </div>
  <div id="lines"><span class="ln" id="l1" data-copy="S05_l1"></span><span class="ln" id="l2" data-copy="S05_l2"></span></div>
  <div id="ring"></div>
  <div id="core"></div>
</div>
<script src="hf/parts/nightmap.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), NM = window.NM, $ = (s) => document.querySelector(s);
  NM.init($('#nm'));
  const sp = (t, ph, x) => { let d = ''; for (let i = 0; i <= 16; i++) { const y = 290 - i * 17; const xx = x + Math.sin(i * 0.5 + t * 2.4 + ph) * 16 * (i / 16); d += (i ? 'L' : 'M') + xx.toFixed(1) + ' ' + y; } return d; };
  NM.clock(tl, (t) => {
    NM.cam(NM.YOU.x, NM.YOU.y, (S.landscape ? 2900 : 2100) * (1 + 0.05 * t / S.dur), S.landscape ? 0.7 : 0.5, 0.66);
    NM.placePins();
    $('#s1').setAttribute('d', sp(t, 0, 80)); $('#s2').setAttribute('d', sp(t, 2.1, 120)); $('#s3').setAttribute('d', sp(t, 4.2, 160));
    $('#steam').style.opacity = 0.5 * (0.8 + 0.2 * Math.sin(t * 2));
    // vòng radar co về 1 điểm (chuyển sang S06)
    const c = NM.E(S.dur - 0.95, S.dur - 0.95, S.dur - 0.15) ;
    const k = NM.L(t, S.dur - 1.0, S.dur - 0.2);
    $('#ring').style.opacity = k > 0 ? Math.min(1, k * 4) * (1 - NM.L(t, S.dur - 0.3, S.dur - 0.15)) : 0;
    $('#ring').style.transform = 'scale(' + (1 - S.EASE(k) * 0.985).toFixed(4) + ')';
    $('#core').style.opacity = NM.E(t, S.dur - 0.35, S.dur - 0.15);
    $('#core').style.transform = 'scale(' + (1 + 3 * NM.E(t, S.dur - 0.25, S.dur)).toFixed(3) + ')';
    $('#pinwrap').style.opacity = 1 - NM.E(t, S.dur - 0.9, S.dur - 0.4);
    $('#lines').style.opacity = 1 - NM.E(t, S.dur - 0.7, S.dur - 0.35);
  });
  S.arrive(tl, '#pinwrap', 0.1, {dist: 30, blur: 6, dur: 0.8});
  S.arrive(tl, '#l1', 0.3, {dist: 30});
  S.arrive(tl, '#l2', 1.0, {dist: 30});
</script>
</body>
</html>
