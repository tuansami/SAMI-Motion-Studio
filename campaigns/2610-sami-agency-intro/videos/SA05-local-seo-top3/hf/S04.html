<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/900.css">
<link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="_fonts/ibm-plex-mono/600.css">
<link rel="stylesheet" href="hf/parts/lr.css">
<style>
  /* S04 · GIÁM KHẢO: "Món ngon nhất" ✕ (buzzer) · "Hồ sơ tốt nhất" ✓ (ding) */
  #l1 { left: var(--safe-side); right: var(--safe-side); top: 228px; font-size: 66px; -webkit-text-stroke-width: 13px; }
  #l2 { left: var(--safe-side); right: var(--safe-side); top: 1250px; font-size: 90px; }
  #desk { position: absolute; z-index: 10; left: 72px; top: 600px; width: 936px; height: 580px; display: flex; gap: 36px; }
  .jb { position: relative; flex: 1; background: var(--cream); overflow: visible; display: flex; flex-direction: column; transform-origin: 50% 100%; }
  .jb .hdr { margin: 0; padding: 18px 10px; text-align: center; background: var(--ink); color: #fff; font: 900 36px/1.15 "Be Vietnam Pro", sans-serif; border-radius: 14px 14px 0 0; }
  .jb .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .jb svg { width: 86%; }
  .mark { position: absolute; z-index: 5; left: 50%; top: 56%; width: 250px; height: 250px; margin: -125px 0 0 -125px; border-radius: 50%; border: 8px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 150px !important; }
  #mx { background: var(--coral); } #mok { background: var(--mint); }
  .light { position: absolute; top: -34px; left: 50%; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%; border: 5px solid var(--ink); background: #5B5677; }
  [data-ratio="16x9"] #l1 { left: 110px; right: auto; width: 820px; top: 170px; font-size: 64px; }
  [data-ratio="16x9"] #l2 { left: 110px; right: auto; width: 820px; top: 640px; font-size: 92px; }
  [data-ratio="16x9"] #desk { left: 1000px; top: 230px; width: 830px; height: 640px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S04">
  <div class="burst b-coral" id="burst"></div>
  <div class="tp" id="l1" data-copy="S04_l1"></div>
  <div id="desk">
    <div class="jb blk" id="ja">
      <div class="light" id="la"></div>
      <div class="hdr" data-copy="S04_a"></div>
      <div class="art"><svg viewBox="0 0 300 300">
        <g fill="none" stroke="#0C0628" stroke-width="7" stroke-linecap="round"><path d="M110 92 q-16 -22 0 -44 M150 92 q-16 -22 0 -44 M190 92 q-16 -22 0 -44"/></g>
        <path d="M40 120 H260 A110 100 0 0 1 40 120 Z" fill="#7667FE" stroke="#0C0628" stroke-width="8" stroke-linejoin="round"/>
        <path d="M40 120 H260" stroke="#0C0628" stroke-width="8"/>
        <path d="M70 118 q20 -14 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#FFF4DF" stroke-width="8" stroke-linecap="round"/>
        <path d="M200 60 L250 120 M215 52 L262 112" stroke="#0C0628" stroke-width="7" stroke-linecap="round"/>
        <g fill="#FFD23F" stroke="#0C0628" stroke-width="5" stroke-linejoin="round">
          <path id="st" d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z" transform="translate(70 262)"/>
          <use href="#st" x="40"/><use href="#st" x="80"/><use href="#st" x="120"/><use href="#st" x="160"/>
        </g></svg></div>
      <div class="mark" id="mx"><svg viewBox="0 0 100 100"><path d="M24 24 L76 76 M76 24 L24 76" stroke="#0C0628" stroke-width="16" stroke-linecap="round"/></svg></div>
    </div>
    <div class="jb blk" id="jbb">
      <div class="light" id="lb"></div>
      <div class="hdr" data-copy="S04_b"></div>
      <div class="art"><svg viewBox="0 0 300 330">
        <rect x="20" y="10" width="260" height="310" rx="18" fill="#fff" stroke="#0C0628" stroke-width="7"/>
        <rect x="38" y="28" width="110" height="88" rx="10" fill="#08DDA4" stroke="#0C0628" stroke-width="5"/>
        <rect x="156" y="28" width="106" height="40" rx="8" fill="#FFD23F" stroke="#0C0628" stroke-width="5"/>
        <rect x="156" y="76" width="106" height="40" rx="8" fill="#5EC8FF" stroke="#0C0628" stroke-width="5"/>
        <rect x="38" y="134" width="170" height="20" rx="10" fill="#0C0628"/>
        <g fill="#FFD23F" stroke="#0C0628" stroke-width="3.5" stroke-linejoin="round">
          <path id="s2" d="M0 -12 L3.5 -4 L12 -4 L5.5 1.5 L8 10 L0 5 L-8 10 L-5.5 1.5 L-12 -4 L-3.5 -4 Z" transform="translate(50 180)"/>
          <use href="#s2" x="28"/><use href="#s2" x="56"/><use href="#s2" x="84"/><use href="#s2" x="112"/>
        </g>
        <rect x="38" y="204" width="224" height="12" rx="6" fill="#B9B5D6"/><rect x="38" y="226" width="170" height="12" rx="6" fill="#B9B5D6"/>
        <rect x="38" y="258" width="66" height="40" rx="20" fill="#E3E4F7" stroke="#0C0628" stroke-width="4"/>
        <rect x="114" y="258" width="66" height="40" rx="20" fill="#E3E4F7" stroke="#0C0628" stroke-width="4"/>
        <rect x="190" y="258" width="72" height="40" rx="20" fill="#7667FE" stroke="#0C0628" stroke-width="4"/>
      </svg></div>
      <div class="mark" id="mok"><svg viewBox="0 0 100 100"><path d="M20 52 L42 74 L82 28" fill="none" stroke="#0C0628" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
  <div class="tp" id="l2" data-copy="S04_l2"></div>
</div>
<script src="hf/parts/race.js"></script>
<script>
  const S = window.SAMI, R = window.LR, tl = S.timeline(), $ = (s) => document.querySelector(s);
  const T_A = 0.8, T_B = 1.05, T_X = 2.75, T_OK = 3.55;
  R.clock(tl, (t) => {
    $('#burst').style.transform = 'rotate(' + (t * 6).toFixed(2) + 'deg)';
    $('#ja').style.transform = 'translateY(' + R.drop(t, T_A - 0.35, T_A, 1300).toFixed(1) + 'px) scale(' + (1 - 0.06 * R.E(t, T_OK, T_OK + 0.4) + R.wob(t, T_X, 0.05)).toFixed(4) + ')';
    $('#jbb').style.transform = 'translateY(' + R.drop(t, T_B - 0.35, T_B, 1300).toFixed(1) + 'px) scale(' + (1 + 0.05 * R.E(t, T_OK, T_OK + 0.4) + R.wob(t, T_OK, 0.06)).toFixed(4) + ')';
    $('#ja').style.opacity = t > T_A - 0.35 ? (1 - 0.35 * R.E(t, T_OK, T_OK + 0.5)).toFixed(3) : 0;
    $('#jbb').style.opacity = t > T_B - 0.35 ? 1 : 0;
    $('#la').style.background = t > T_X ? '#FF6B5A' : '#5B5677';
    $('#lb').style.background = t > T_OK ? (Math.floor((t - T_OK) * 6) % 2 ? '#FFD23F' : '#08DDA4') : '#5B5677';
    [['#mx', T_X, -10], ['#mok', T_OK, 8]].forEach(([id, t0, rot]) => {
      const k = t < t0 ? 0 : 2.2 - 1.2 * R.E(t, t0, t0 + 0.2) + R.wob(t, t0 + 0.2, 0.1);
      $(id).style.transform = 'rotate(' + rot + 'deg) scale(' + k.toFixed(3) + ')'; $(id).style.opacity = t < t0 ? 0 : 1;
    });
  });
  R.popIn(tl, S.words($('#l1')), 0.35, {stagger: 0.06});
  R.popIn(tl, S.words($('#l2')), T_OK + 0.2, {stagger: 0.08});
</script>
</body>
</html>
