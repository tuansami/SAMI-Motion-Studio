<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/900.css">
<link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="hf/parts/lr.css">
<style>
  /* S08 · NHỊP THỞ + CHỐT: huy hiệu hạng 1 thở sáng một mình, rồi câu chốt */
  #medal { position: absolute; z-index: 10; left: 50%; top: 300px; width: 420px; height: 520px; margin-left: -210px; }
  #hd { left: var(--safe-side); right: var(--safe-side); top: 900px; font-size: 80px; text-align: center; }
  [data-ratio="16x9"] #medal { left: 1380px; top: 250px; }
  [data-ratio="16x9"] #hd { left: 110px; right: auto; width: 1080px; top: 290px; font-size: 80px; text-align: left; }
</style>
</head>
<body>
<div id="root" data-composition-id="S08">
  <div class="burst b-navy" id="burst"></div>
  <svg id="medal" viewBox="0 0 420 520">
    <path d="M120 0 H190 L230 190 H160 Z" fill="#7667FE" stroke="#0C0628" stroke-width="10" stroke-linejoin="round"/>
    <path d="M300 0 H230 L190 190 H260 Z" fill="#08DDA4" stroke="#0C0628" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="224" cy="340" r="160" fill="#0C0628"/>
    <circle cx="210" cy="326" r="160" fill="#FFD23F" stroke="#0C0628" stroke-width="12"/>
    <circle cx="210" cy="326" r="118" fill="none" stroke="#0C0628" stroke-width="8" stroke-dasharray="4 18" stroke-linecap="round"/>
    <text x="210" y="398" text-anchor="middle" font-family="Anton" font-size="210" fill="#0C0628">1</text>
  </svg>
  <div class="tp" id="hd" data-copy="S08_headline"></div>
</div>
<script src="hf/parts/race.js"></script>
<script>
  const S = window.SAMI, R = window.LR, tl = S.timeline(), $ = (s) => document.querySelector(s);
  R.clock(tl, (t) => {
    $('#burst').style.transform = 'rotate(' + (t * 3).toFixed(2) + 'deg)';
    const b = 1 + 0.035 * Math.sin(t * Math.PI * 0.9);
    $('#medal').style.transform = 'scale(' + (R.pop(t, 0.3) * b).toFixed(4) + ') rotate(' + (2 * Math.sin(t * 1.4)).toFixed(2) + 'deg)';
  });
  R.popIn(tl, S.words($('#hd')), 1.6, {stagger: 0.08});
</script>
</body>
</html>
