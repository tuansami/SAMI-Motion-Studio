<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/900.css">
<link rel="stylesheet" href="_fonts/anton/400.css">
<link rel="stylesheet" href="_fonts/ibm-plex-mono/600.css">
<link rel="stylesheet" href="hf/parts/lr.css">
<style>
  /* S02 · THỨ 9: hỏi → "Thứ 9" đóng dấu cạnh làn của bạn, sticker NEU ở quán mới mở */
  #q { left: var(--safe-side); right: var(--safe-side); top: 232px; font-size: 62px; color: var(--yellow); }
  #hd { left: var(--safe-side); right: var(--safe-side); top: 326px; font-size: 84px; }
  #hd em.hl, #hd em.hl .w { color: var(--mint); }
  #nine { left: 640px; top: 1180px; transform-origin: 50% 60%; }
  #neu { left: 560px; top: 0; transform-origin: 20% 50%; background: var(--yellow); }
  #you { left: 470px; top: 0; transform-origin: 10% 50%; background: var(--mint); }
  #demo { right: 72px; top: 1534px; }
  [data-ratio="16x9"] #q { left: 110px; right: auto; width: 800px; top: 180px; font-size: 58px; }
  [data-ratio="16x9"] #hd { left: 110px; right: auto; width: 820px; top: 280px; font-size: 84px; }
  [data-ratio="16x9"] #nine { left: 1520px; top: 520px; font-size: 280px; }
  [data-ratio="16x9"] #demo { right: 90px; top: 990px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S02">
  <div class="set dots-navy" id="set"></div>
  <div class="tp" id="q" data-copy="S02_q"></div>
  <div class="tp" id="hd" data-copy="S02_headline"></div>
  <div id="bd"></div>
  <div class="bignum" id="nine">9</div>
  <div class="sticker" id="neu"><span data-copy="S02_neu"></span></div>
  <div class="sticker" id="you" data-copy="S02_you"></div>
  <div class="demo" id="demo">Minh họa</div>
</div>
<script src="hf/parts/race.js"></script>
<script>
  const S = window.SAMI, R = window.LR, tl = S.timeline(), $ = (s) => document.querySelector(s);
  const B = R.board($('#bd')), g = B.g;
  const T_NINE = 1.45, T_YOU = 1.75, T_NEU = 2.6;
  // sticker bám theo làn (toạ độ trong khung)
  const rowY = (i) => g.y + i * g.step;
  const barEnd = (v) => g.x + g.barX + v / R.VMAX * g.barW;
  $('#neu').style.top = (rowY(2) + 12) + 'px'; $('#neu').style.left = Math.min(barEnd(90) - 330, S.w - 360) + 'px';
  $('#you').style.top = (rowY(8) + 12) + 'px'; $('#you').style.left = (barEnd(52) + 22) + 'px';
  if (S.landscape) { $('#nine').style.top = (rowY(8) - 150) + 'px'; $('#nine').style.left = (barEnd(52) + 250) + 'px'; }
  else { $('#nine').style.top = (rowY(8) - 330) + 'px'; $('#nine').style.left = (barEnd(52) + 250) + 'px'; }
  R.clock(tl, (t) => {
    R.scroll($('#set'), t, 0, -16, 64);
    B.set(B.vals(t, 52));
    // làn của bạn nháy viền vàng sau khi "9" đóng dấu
    const you = B.rows[R.YOU].bar, on = t > T_NINE && Math.floor((t - T_NINE) * 4) % 2 === 0 && t < T_NINE + 2.2;
    you.classList.toggle('pulse', on || t > T_NINE + 2.2);
    const k = R.pop(t, T_NINE);
    $('#nine').style.transform = 'rotate(-8deg) scale(' + (k > 0 ? (2.6 - 1.6 * R.E(t, T_NINE, T_NINE + 0.22) + R.wob(t, T_NINE + 0.22, 0.1)) : 0).toFixed(3) + ')';
    $('#nine').style.opacity = k > 0 ? 1 : 0;
    [['#neu', T_NEU, 4], ['#you', T_YOU, -4]].forEach(([id, t0, rot]) => {
      const p = R.pop(t, t0); $(id).style.transform = 'rotate(' + rot + 'deg) scale(' + p.toFixed(3) + ')'; $(id).style.opacity = p > 0 ? 1 : 0;
    });
  });
  R.popIn(tl, S.words($('#q')), 0.3, {stagger: 0.06});
  const w = S.words($('#hd'));
  R.popIn(tl, w.slice(0, 2), T_NINE - 0.05, {stagger: 0.08});
  R.popIn(tl, w.slice(2), T_NEU - 0.3, {stagger: 0.06});
  R.popIn(tl, '#demo', 0.4, {dy: 0});
</script>
</body>
</html>
