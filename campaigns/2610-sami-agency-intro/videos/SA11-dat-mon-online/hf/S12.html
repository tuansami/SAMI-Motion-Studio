<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="hf/parts/ik.css">
<style>
  /* S12 · END CARD: khối đơn cuối rơi xuống, nảy, rồi "mở" thành vòng navy SAMI lan ra cả khung; bong bóng chat mint vẽ code, số WhatsApp, ưu đãi, logo */
  #navy { position: absolute; inset: 0; z-index: 5; background: radial-gradient(ellipse 90% 60% at 50% 30%, #1E1758 0%, #0C0628 70%); }
  #wrap { position: absolute; z-index: 10; left: var(--safe-side); right: var(--safe-side); top: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  #colA, #colB { display: flex; flex-direction: column; align-items: center; }
  #bubble { position: relative; padding: 42px 56px 46px; border-radius: 48px 48px 48px 14px; color: #0C0628;
    background: linear-gradient(135deg, #5EF0C8, #08DDA4 60%, #06B88A); box-shadow: 0 0 0 2px rgba(255, 255, 255, .3), 0 0 70px rgba(8, 221, 164, .45), 0 30px 70px rgba(0, 0, 0, .55); }
  #bubble:after { content: ""; position: absolute; left: 0; bottom: -34px; width: 50px; height: 36px; background: #06B88A; clip-path: polygon(0 0, 100% 0, 0 100%); }
  #bubble .ic { position: absolute; left: -30px; top: -30px; width: 76px; height: 76px; border-radius: 50%; background: #0C0628; border: 2px solid rgba(8, 221, 164, .8); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(8, 221, 164, .6); }
  #bubble .ic svg { width: 40px; height: 40px; }
  #cta { font: 800 50px/1.2 "Be Vietnam Pro", sans-serif; }
  #phone { font: 800 80px/1.15 "Be Vietnam Pro", sans-serif; letter-spacing: -.01em; margin-top: 8px; white-space: nowrap; }
  #offer { margin-top: 76px; font: 500 38px/1.42 "Be Vietnam Pro", sans-serif; color: #E3E4F7; }
  #lw { margin-top: 90px; width: 560px; overflow: hidden; }
  #logo { width: 100%; display: block; clip-path: polygon(0 0, 100% 0, 100% 58%, 39% 58%, 39% 100%, 0 100%); }
  #tag { margin-top: 18px; font: 500 23px/1.4 "JetBrains Mono", monospace; letter-spacing: .05em; color: #A8A3C9; white-space: nowrap; }
  #web { margin-top: 14px; font: 800 42px/1.2 "Be Vietnam Pro", sans-serif; color: #08DDA4; }
  [data-ratio="16x9"] #wrap { left: 0; right: 0; top: 0; bottom: 0; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; justify-items: center; padding: 0 120px; gap: 70px; }
  [data-ratio="16x9"] #colA { align-items: flex-start; text-align: left; }
  [data-ratio="16x9"] #offer { margin-top: 70px; font-size: 34px; }
  [data-ratio="16x9"] #lw { margin-top: 0; width: 600px; }
  [data-ratio="16x9"] #tag { font-size: 20px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S12">
  <div id="navy"></div>
  <div id="wrap">
    <div id="colA">
      <div id="bubble">
        <div class="ic"><svg viewBox="0 0 40 40" fill="none" stroke="#08DDA4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 30 L10 23 A12 12 0 1 1 16 30 Z"/></svg></div>
        <div id="cta" data-copy="S12_cta"></div>
        <div id="phone" data-copy="S12_phone"></div>
      </div>
      <div id="offer" data-copy="S12_offer"></div>
    </div>
    <div id="colB">
      <div id="lw"><img id="logo" src="public/img/logo-white.svg"></div>
      <div id="tag" data-copy="S12_tagline"></div>
      <div id="web" data-copy="S12_web"></div>
    </div>
  </div>
</div>
<script src="hf/parts/iso.js"></script>
<script src="hf/parts/world.js"></script>
<script>
  const S = window.SAMI, I = window.ISO, tl = S.timeline(), root = W.$('#root'), L16 = S.landscape;
  const iso = W.setup(root);
  const O = L16 ? [560, 470] : [540, 560];
  const navy = W.$('#navy'), bub = W.$('#bubble');
  W.clock(tl, (t) => {
    W.cam(iso, {x: 0, y: 0, z: 0, k: 120, cx: O[0], cy: O[1]});
    W.bg(iso, t);
    // khối đơn cuối rơi xuống, nảy
    const u = W.L(t, 0, 0.45), z = 7 * (1 - u * u), sq = t > 0.45 ? 0.3 * Math.sin(W.L(t, 0.45, 0.7) * Math.PI) : 0;
    iso.flat([[-0.9, -0.9], [0.9, -0.9], [0.9, 0.9], [-0.9, 0.9]], 0, 'rgba(31,26,61,' + (0.15 * u).toFixed(3) + ')');
    W.order(iso, 0, 0, z, {s: 1.6, squash: sq});
    iso.flush();
    const r = W.E(t, 0.6, 1.4) * 2400;
    navy.style.clipPath = 'circle(' + r.toFixed(1) + 'px at ' + O[0] + 'px ' + O[1] + 'px)';
    const b = W.E(t, 0.85, 1.4);
    bub.style.transform = 'translateY(' + W.mix(50, 0, b).toFixed(1) + 'px) scale(' + W.mix(0.7, 1, I.back(W.L(t, 0.85, 1.4), 1.4)).toFixed(3) + ')';
    bub.style.opacity = b;
  });
  W.fadeIn(tl, '#offer', 1.6);
  W.fadeIn(tl, '#lw', 2.3, {dist: 30, blur: 14});
  W.fadeIn(tl, '#tag', 2.7, {dist: 12}); W.fadeIn(tl, '#web', 2.9, {dist: 12});
</script>
</body>
</html>
