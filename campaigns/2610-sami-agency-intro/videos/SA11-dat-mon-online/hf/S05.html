<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="hf/parts/ik.css">
<link rel="stylesheet" href="hf/parts/phone.css">
<style>
  /* S05 · MAPS: khách gõ tìm "Pho bestellen Hannover", ghim Bếp Gió nảy lên, thẻ quán trượt lên, bấm "Online bestellen" → màn hình loang mint (nối sang S06) */
  #hd { left: var(--safe-side); right: var(--safe-side); top: 240px; font-size: 70px; }
  #map { position: absolute; inset: 0; }
  #sb { position: absolute; z-index: 5; left: 22px; right: 22px; top: 64px; height: 76px; border-radius: 38px; background: #fff; box-shadow: 0 6px 18px rgba(31, 26, 61, .18); display: flex; align-items: center; padding: 0 24px; gap: 16px;
    font: 500 26px/1 "Be Vietnam Pro", sans-serif; color: var(--ink); white-space: nowrap; overflow: hidden; }
  #sb .mg { width: 22px; height: 22px; border: 4px solid var(--ink2); border-radius: 50%; position: relative; flex: none; }
  #sb .mg:after { content: ""; position: absolute; right: -10px; bottom: -8px; width: 12px; height: 4px; background: var(--ink2); transform: rotate(45deg); border-radius: 2px; }
  #sb .cur { display: inline-block; width: 3px; height: 30px; background: var(--purple); margin-left: 2px; vertical-align: -6px; }
  .mp { position: absolute; z-index: 3; width: 34px; height: 34px; margin: -34px 0 0 -17px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #B3AEC6; }
  #mainpin { position: absolute; z-index: 4; width: 64px; height: 64px; margin: -64px 0 0 -32px; transform-origin: 50% 100%; }
  #mainpin .p { position: absolute; inset: 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--order); box-shadow: 0 6px 12px rgba(31, 26, 61, .3); }
  #mainpin .p:after { content: ""; position: absolute; left: 20px; top: 20px; width: 24px; height: 24px; border-radius: 50%; background: #FFF4E2; }
  #mainpin .nm { position: absolute; left: 76px; top: 6px; font: 800 26px/1 "Be Vietnam Pro", sans-serif; color: var(--ink); white-space: nowrap; text-shadow: 0 0 6px #fff, 0 0 6px #fff; }
  #sheet { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding: 22px 26px 34px; background: #fff; border-radius: 32px 32px 0 0; box-shadow: 0 -10px 30px rgba(31, 26, 61, .2); }
  #sheet .gr { width: 70px; height: 7px; border-radius: 4px; background: #D8D4E4; margin: 0 auto 18px; }
  #sheet h3 { margin: 0; font: 800 38px/1.15 "Be Vietnam Pro", sans-serif; color: var(--ink); }
  #sheet .m { margin-top: 6px; font: 500 22px/1.4 "Be Vietnam Pro", sans-serif; color: var(--ink2); }
  #sheet .m b { color: #0A9E77; font-weight: 700; }
  #sheet .row { display: flex; gap: 12px; margin-top: 18px; }
  #sheet .bt { flex: 1; height: 62px; border-radius: 31px; border: 2.5px solid #CFCAE0; display: flex; align-items: center; justify-content: center; font: 700 22px/1 "Be Vietnam Pro", sans-serif; color: var(--ink); }
  #order { margin-top: 14px; height: 78px; border-radius: 39px; background: linear-gradient(100deg, #08DDA4, #06B88A); display: flex; align-items: center; justify-content: center; gap: 14px;
    font: 800 30px/1 "Be Vietnam Pro", sans-serif; color: #0C0628; box-shadow: 0 8px 18px rgba(8, 221, 164, .4); }
  #order i { width: 22px; height: 22px; background: #0C0628; transform: rotate(45deg) scaleY(.82); border-radius: 3px; }
  #flash { position: absolute; z-index: 30; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #08DDA4; }
  #demo { left: 290px; top: 1630px; }
  [data-ratio="16x9"] #hd { left: 110px; right: auto; width: 790px; top: 330px; font-size: 62px; }
  [data-ratio="16x9"] #demo { left: 1640px; top: 120px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S05">
  <div class="hd" id="hd" data-copy="S05_headline"></div>
  <div id="ph"><div class="scr" id="scr">
    <svg id="map" viewBox="0 0 500 1000" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="notch"></div>
    <div id="sb"><div class="mg"></div><span id="q"></span><span class="cur" id="cur"></span></div>
    <div id="mainpin"><div class="p"></div><div class="nm">Bếp Gió</div></div>
    <div id="sheet"><div class="gr"></div><h3>Bếp Gió</h3><div class="m">Vietnamesisch · <b>Geöffnet</b> bis 22:00</div>
      <div class="row"><div class="bt">Route</div><div class="bt">Anrufen</div></div>
      <div id="order"><i></i>Online bestellen</div></div>
    <div class="tap" id="tap"></div><div class="ripple" id="rip"></div>
    <div id="flash"></div>
  </div></div>
  <div class="demo" id="demo">Quán minh họa</div>
</div>
<script src="hf/parts/iso.js"></script>
<script src="hf/parts/world.js"></script>
<script>
  const S = window.SAMI, I = window.ISO, tl = S.timeline(), root = W.$('#root'), L16 = S.landscape;
  const iso = W.setup(root);
  // bản đồ vẽ tay (tất định)
  const NS = 'http://www.w3.org/2000/svg', map = W.$('#map');
  const add = (tag, at) => { const e = document.createElementNS(NS, tag); Object.keys(at).forEach((k) => e.setAttribute(k, at[k])); map.appendChild(e); return e; };
  add('rect', {x: 0, y: 0, width: 500, height: 1000, fill: '#EFE8DA'});
  add('path', {d: 'M-20 620 C 120 560 220 700 360 640 S 520 560 540 600', stroke: '#BFD8E6', 'stroke-width': 46, fill: 'none'});
  add('rect', {x: 300, y: 190, width: 170, height: 150, rx: 18, fill: '#CFE3BF'});
  for (let i = 0; i < 26; i++) { const x = (i % 5) * 110 - 20 + S.rnd(i) * 20, y = Math.floor(i / 5) * 190 + 40 + S.rnd(i * 2) * 30; add('rect', {x: x, y: y, width: 78, height: 120, rx: 10, fill: '#E4DBC9'}); }
  [['M-10 170 L 520 120', 22], ['M-10 460 L 520 520', 26], ['M 140 -10 L 190 1010', 24], ['M 380 -10 L 330 1010', 18], ['M -10 820 L 520 760', 20]].forEach((r) => {
    add('path', {d: r[0], stroke: '#FFFFFF', 'stroke-width': r[1], fill: 'none', 'stroke-linecap': 'round'});
  });
  const scr = W.$('#scr'), SW = scr.clientWidth, SH = scr.clientHeight;
  [[0.2, 0.3], [0.72, 0.22], [0.58, 0.58], [0.3, 0.7], [0.85, 0.45]].forEach((p, i) => { const e = W.el('div', 'mp', scr); e.style.left = (p[0] * SW) + 'px'; e.style.top = (p[1] * SH) + 'px'; e.id = 'mp' + i; });
  const PIN = [0.46 * SW, 0.43 * SH];
  const mp = W.$('#mainpin'); mp.style.left = PIN[0] + 'px'; mp.style.top = PIN[1] + 'px';
  const sheet = W.$('#sheet'), ob = W.$('#order'), tap = W.$('#tap'), rip = W.$('#rip'), flash = W.$('#flash');
  const Q = S.text('S05_search');
  // toạ độ nút "Online bestellen" trong màn hình (đo 1 lần lúc dựng, khi thẻ ở vị trí cuối)
  const BTN = [SW / 2, SH - 34 - 39];
  const T_TAP = 4.0;
  W.clock(tl, (t) => {
    W.cam(iso, W.FULL());
    W.bg(iso, t);
    // gõ tìm kiếm
    const n = Math.round(Q.length * W.L(t, 0.45, 1.5));
    W.$('#q').textContent = Q.slice(0, n);
    W.$('#cur').style.opacity = (t < 1.6 ? (Math.floor(t * 4) % 2 ? 0.2 : 1) : 0);
    // ghim phụ mờ đi, ghim chính rơi xuống nảy
    for (let i = 0; i < 5; i++) W.$('#mp' + i).style.opacity = (1 - 0.6 * W.L(t, 1.6, 2.0)).toFixed(2);
    const pu = W.L(t, 1.65, 2.1), sq = t > 2.1 ? 0.25 * Math.sin(W.L(t, 2.1, 2.4) * Math.PI) : 0;
    mp.style.transform = 'translateY(' + (-260 * (1 - pu * pu)).toFixed(1) + 'px) scale(' + (1 + sq).toFixed(3) + ',' + (1 - sq).toFixed(3) + ')';
    mp.style.opacity = t > 1.65 ? 1 : 0;
    // thẻ quán trượt lên
    sheet.style.transform = 'translateY(' + (110 * (1 - W.E(t, 2.3, 2.9))).toFixed(1) + '%)';
    // con trỏ chạm nút
    const ta = W.L(t, 3.3, 3.6) * (1 - W.L(t, 4.8, 5.0));
    tap.style.left = W.mix(SW * 0.8, BTN[0], W.E(t, 3.3, 3.95)) + 'px'; tap.style.top = W.mix(SH * 0.62, BTN[1], W.E(t, 3.3, 3.95)) + 'px';
    tap.style.opacity = ta; tap.style.transform = 'scale(' + (t > T_TAP && t < T_TAP + 0.2 ? 0.8 : 1) + ')';
    const ru = W.L(t, T_TAP, T_TAP + 0.6);
    rip.style.left = BTN[0] + 'px'; rip.style.top = BTN[1] + 'px'; rip.style.opacity = ru > 0 && ru < 1 ? (1 - ru) : 0; rip.style.transform = 'scale(' + (1 + 3 * ru) + ')';
    ob.style.transform = 'scale(' + (t > T_TAP && t < T_TAP + 0.25 ? 0.96 : 1) + ')';
    ob.style.boxShadow = t > T_TAP ? '0 0 0 ' + (6 * (1 - ru)).toFixed(1) + 'px rgba(8,221,164,.35), 0 8px 18px rgba(8,221,164,.4)' : '';
    // loang mint từ nút → nối sang S06
    const fu = W.E(t, 5.4, 6.2);
    flash.style.left = BTN[0] + 'px'; flash.style.top = BTN[1] + 'px'; flash.style.transform = 'scale(' + (fu * 260).toFixed(1) + ')'; flash.style.opacity = fu > 0 ? 1 : 0;
  });
  W.words(tl, '#hd', 0.5, {stagger: 0.05});
  W.fadeIn(tl, '#ph', 0.0, {dist: 60, blur: 0, dur: 0.6});
  W.fadeIn(tl, '#demo', 2.6, {dist: 8});
</script>
</body>
</html>
