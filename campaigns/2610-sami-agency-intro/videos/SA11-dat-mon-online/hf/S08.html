<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="hf/parts/ik.css">
<style>
  /* S08 · QUAY LẠI: túi món đi theo đường mint tới tay khách; điện thoại hiện Gutschein; các đơn đặt thẳng chạy liên tiếp, hàng khối "Stammgast" sáng dần */
  #hd { left: var(--safe-side); right: var(--safe-side); top: 230px; font-size: 66px; }
  #gs { width: 400px; padding: 0; overflow: hidden; transform-origin: 0 100%; }
  #gs .top { background: linear-gradient(110deg, #7667FE, #4B3FD8); color: #fff; padding: 16px 20px 14px; font: 800 38px/1.1 "Be Vietnam Pro", sans-serif; letter-spacing: .02em; }
  #gs .top small { display: block; font: 500 24px/1.3 "Be Vietnam Pro", sans-serif; opacity: .85; margin-top: 4px; }
  #gs .bd { padding: 12px 20px 16px; font: 500 25px/1.35 "JetBrains Mono", monospace; color: var(--ink2); border-top: 3px dashed #CFCAE0; }
  #sg { left: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: 14px 20px; }
  #sg .nm { font: 700 30px/1 "Be Vietnam Pro", sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  #sg .cb { width: 36px; height: 36px; transform: rotate(45deg) scaleY(.82); border-radius: 4px; background: #E3DED3; }
  #sg .cb.on { background: var(--order); }
  [data-ratio="16x9"] #hd { left: 110px; right: auto; width: 780px; top: 300px; font-size: 56px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S08">
  <div class="hd" id="hd" data-copy="S08_headline"></div>
  <div class="card" id="gs"><div class="top">Gutschein<small>für Ihre nächste Bestellung</small></div><div class="bd">Danke, Anna!<br>Direkt bei Bếp Gió</div></div>
  <div class="card" id="sg"><span class="nm">Stammgast</span></div>
</div>
<script src="hf/parts/iso.js"></script>
<script src="hf/parts/world.js"></script>
<script>
  const S = window.SAMI, I = window.ISO, tl = S.timeline(), root = W.$('#root'), L16 = S.landscape;
  const iso = W.setup(root);
  const C0 = W.FULL(0.5), C1 = W.FULL(2);
  const gs = W.$('#gs'), sg = W.$('#sg');
  const CB = [0, 1, 2, 3, 4, 5].map(() => W.el('i', 'cb', sg));
  const ROUTE = [[9.7, -1.2, 0.06], [9.7, 3.3, 0.06], [-9.0, 3.3, 0.06], [-9.0, -0.3, 0.06]];
  const RS = (() => { const s = [], o = {s: s, tot: 0}; for (let i = 1; i < ROUTE.length; i++) { const l = Math.abs(ROUTE[i][0] - ROUTE[i - 1][0]) + Math.abs(ROUTE[i][1] - ROUTE[i - 1][1]); s.push({a: ROUTE[i - 1], b: ROUTE[i], l: l, ax: ROUTE[i][0] !== ROUTE[i - 1][0] ? 0 : 1}); o.tot += l; } return o; })();
  const T_GIVE = 2.0, T_GS = 2.3, LOOPS = [3.4, 4.3, 5.0, 5.6, 6.1, 6.5];
  W.clock(tl, (t) => {
    W.cam(iso, W.lerpCam(C0, C1, W.E(t, 0, S.dur)));
    W.bg(iso, t);
    W.board(iso);
    W.phone(iso, t, {bar: '#08DDA4', card: t > T_GS ? '#E4E0FF' : '#E9E5F7'});
    W.restaurant(iso, t, {kasse: 1, printLed: true});
    W.belt(iso, t, {speed: 2.4 + 2 * W.L(t, 3, 7)});
    W.person(iso, -9.7, -0.4, 0, {face: 1, bag: t > T_GIVE, arm: t > T_GIVE ? 0.6 : 0.2});
    // túi món theo đường giao
    const u = W.E(t, 0.3, T_GIVE);
    if (u < 1) { const p = W.along(RS, u).p; W.order(iso, p[0], p[1], 0.06, {s: 0.8}); }
    iso.line3(ROUTE, '#08DDA4', 4, {dash: [14, 10], off: -t * 40, layer: 0, depth: -500, a: 0.9 * (1 - W.L(t, 2.4, 3.0))});
    // các đơn đặt thẳng lặp lại (ngày càng dày)
    LOOPS.forEach((ts, k) => {
      const v = W.L(t, ts - 1.6, ts);
      if (v > 0 && v < 1) W.order(iso, W.mix(W.BELT.x0 + 0.5, 5.15, v), -4.5, W.BELT.h, {});
    });
    iso.flush();
    // tracking ring quanh khách khi nhận túi
    const sc = iso.P(-9.7, -0.4, 1.1);
    I.ring(iso.g, sc[0], sc[1], 70, W.E(t, T_GIVE - 0.2, T_GIVE + 0.3) * (1 - W.L(t, 3.4, 3.8)), t, null, {color: '#08DDA4', lw: 3.5});
    // Gutschein bật ra từ điện thoại
    const sp = iso.P(-7.6, -5.0, 5.9), a = I.back(W.L(t, T_GS, T_GS + 0.45), 1.6);
    gs.style.left = (sp[0] + 30) + 'px'; gs.style.top = Math.max(L16 ? 40 : 600, sp[1] - 260) + 'px'; if (L16) gs.style.left = (sp[0] + 90) + 'px'; gs.style.transform = 'scale(' + Math.max(0, a).toFixed(3) + ') rotate(' + (-4 * (1 - W.L(t, T_GS, T_GS + 0.6))).toFixed(2) + 'deg)'; gs.style.opacity = t > T_GS ? 1 : 0;
    // hàng Stammgast
    const sb = iso.P(6, 8.4, 0);
    sg.style.left = (L16 ? sb[0] - 140 : 540 - 290) + 'px'; sg.style.top = (L16 ? 900 : sb[1] + 70) + 'px';
    sg.style.opacity = W.L(t, 3.0, 3.4);
    CB.forEach((c, k) => { const on = t > LOOPS[k]; c.classList.toggle('on', on); c.style.transform = 'rotate(45deg) scaleY(.82) scale(' + (on ? I.back(W.L(t, LOOPS[k], LOOPS[k] + 0.3), 2.4) : 1).toFixed(3) + ')'; });
  });
  W.words(tl, '#hd', 0.5, {stagger: 0.04});
</script>
</body>
</html>
