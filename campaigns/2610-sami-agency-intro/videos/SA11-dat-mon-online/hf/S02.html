<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="hf/parts/ik.css">
<style>
  /* S02 · RÒ RỈ: theo đơn hàng chạy trong ống trung gian; ở mỗi khớp, giọt tiền rỉ ra, khay phí của máy trung gian đầy dần */
  #hd { left: var(--safe-side); right: var(--safe-side); top: 250px; }
  #pin { left: 0; top: 0; }
  [data-ratio="16x9"] #hd { left: 110px; right: auto; width: 760px; top: 330px; font-size: 70px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S02">
  <div class="hd bad" id="hd" data-copy="S02_headline"></div>
  <div class="lab g" id="pin"><i></i><span data-copy="S02_pin"></span></div>
</div>
<script src="hf/parts/iso.js"></script>
<script src="hf/parts/world.js"></script>
<script>
  const S = window.SAMI, I = window.ISO, tl = S.timeline(), root = W.$('#root'), L16 = S.landscape;
  const iso = W.setup(root);
  const CAM = W.FULL(), CAM2 = W.FULL(1.5);
  const pin = W.$('#pin');
  W.clock(tl, (t) => {
    W.cam(iso, W.lerpCam(CAM, CAM2, W.E(t, 0, S.dur)));
    W.bg(iso, t);
    W.board(iso);
    W.phone(iso, t, {});
    W.restaurant(iso, t, {});
    W.machine(iso, t, {coins: 5 + 13 * W.L(t, 0.3, S.dur - 0.5)});
    W.pipe(iso, t, {});
    W.person(iso, -9.7, -0.4, 0, {face: 1});
    // đơn hàng chạy: A (0 → 3,2 s) rồi vào máy, B (3,6 → 6,6 s)
    let bp = null;
    if (t < 3.3) bp = W.bulge(iso, W.SA, W.mix(0.15, 1, W.L(t, 0, 3.3)));
    else if (t > 3.6) bp = W.bulge(iso, W.SB, W.L(t, 3.6, 6.8));
    // giọt tiền rỉ ở mỗi khớp
    W.JOINTS.forEach((j, i) => {
      for (let r = 0; r < 2; r++) {
        const per = 1.25, ph = (t + S.rnd(i * 7.1 + r) * per) / per, cyc = Math.floor(ph), u = ph - cyc;
        const fall = u * per, z = j[2] - 0.5 - 4.9 * fall * fall;
        const ox = (S.rnd(i + cyc * 3.3 + r) - 0.5) * 0.5, oy = (S.rnd(i * 2 + cyc + r) - 0.5) * 0.5;
        if (z > 0.05) W.drop(iso, j[0] + ox, j[1] + oy, z, 0.22);
        else W.splash(iso, j[0] + ox, j[1] + oy, (fall - Math.sqrt((j[2] - 0.55) / 4.9)) / 0.5);
      }
    });
    iso.flush();
    if (bp) { const s = iso.P(bp[0], bp[1], bp[2]); I.ring(iso.g, s[0], s[1], 46, W.E(t, 0.3, 0.9), t, null, {color: '#EE6A44', lw: 3}); }
    // pin nhãn "TRUNG GIAN" chỉ vào máy
    const a = W.E(t, 0.6, 1.3), top = [W.MAC.x + W.MAC.w / 2, W.MAC.y + W.MAC.d / 2, W.MAC.h + 1.1];
    const s0 = iso.P(top[0], top[1], top[2]), tx = s0[0] + (L16 ? 90 : 70), ty = s0[1] - (L16 ? 120 : 110);
    W.leader(iso, top, tx, ty + 30, a);
    pin.style.left = tx + 'px'; pin.style.top = ty + 'px'; pin.style.opacity = W.L(t, 1.0, 1.4); pin.style.transform = 'translateY(' + (12 * (1 - W.E(t, 1.0, 1.5))).toFixed(1) + 'px)';
  });
  W.words(tl, '#hd', 0.45, {stagger: 0.06});
</script>
</body>
</html>
