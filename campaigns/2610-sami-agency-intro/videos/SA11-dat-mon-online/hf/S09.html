<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="hf/parts/ik.css">
<style>
  /* S09 · LỢI ÍCH: ba cột isometric mọc lên (back-ease): chồng xu (biên lợi nhuận), nhóm khách (sở hữu khách), biển Bếp Gió (thương hiệu riêng) */
  #hd { left: var(--safe-side); right: var(--safe-side); top: 240px; }
  .pl { position: absolute; z-index: 22; width: 320px; margin-left: -160px; text-align: center; font: 800 40px/1.18 "Be Vietnam Pro", sans-serif; color: var(--ink);
    text-shadow: 0 0 12px rgba(244, 235, 220, .95), 0 0 4px rgba(244, 235, 220, .95); }
  .pl i { display: block; width: 26px; height: 26px; margin: 0 auto 12px; transform: rotate(45deg) scaleY(.82); border-radius: 4px; }
  [data-ratio="16x9"] #hd { left: 110px; right: auto; width: 790px; top: 380px; font-size: 62px; }
  [data-ratio="16x9"] .pl { font-size: 34px; width: 300px; margin-left: -150px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S09">
  <div class="hd" id="hd" data-copy="S09_headline"></div>
  <div class="pl" id="la"><i style="background:#E9B949"></i><span data-copy="S09_a"></span></div>
  <div class="pl" id="lb"><i style="background:#3C7FB1"></i><span data-copy="S09_b"></span></div>
  <div class="pl" id="lc"><i style="background:#7667FE"></i><span data-copy="S09_c"></span></div>
</div>
<script src="hf/parts/iso.js"></script>
<script src="hf/parts/world.js"></script>
<script>
  const S = window.SAMI, I = window.ISO, tl = S.timeline(), root = W.$('#root'), L16 = S.landscape;
  const iso = W.setup(root);
  const B = {x0: -7.5, x1: 7.5, y0: -7.5, y1: 7.5};
  const CAM = L16 ? {x: 0, y: 0, z: 1.6, k: 44, cx: 1340, cy: 580} : {x: 0, y: 0, z: 1.6, k: 43, cx: 540, cy: 1200};
  const POS = [[-4.4, 4.4], [0, 0], [4.4, -4.4]], TS = [1.4, 2.1, 2.8], H = 2.6;
  const LAB = ['#la', '#lb', '#lc'].map((s) => W.$(s));
  W.clock(tl, (t) => {
    W.cam(iso, Object.assign({}, CAM, {k: CAM.k * (1 + 0.05 * W.E(t, 0, S.dur))}));
    W.bg(iso, t);
    W.board(iso, {B: B});
    // băng chuyền mint chạy qua chân các cột
    iso.box(-7.2, -0.45, 0, 14.4, 0.9, 0.12, W.T.purple, {});
    POS.forEach((p, k) => {
      const g = I.back(W.L(t, TS[k], TS[k] + 0.6), 1.5), h = Math.max(0.05, H * g), x = p[0] - 1.2, y = p[1] - 1.2;
      iso.box(x, y, 0, 2.4, 2.4, h, k === 0 ? W.T.money : k === 1 ? W.T.blue : W.T.purple);
      const top = h, a = W.L(t, TS[k] + 0.4, TS[k] + 0.8);
      if (a <= 0) return;
      if (k === 0) for (let c = 0; c < 7; c++) { if (a * 7 < c) break; iso.cyl(p[0] + (c % 2) * 0.12 - 0.06, p[1], top + c * 0.2, 0.75, 0.16, W.T.money, {n: 18}); }
      if (k === 1) [[-0.5, 0.4], [0.4, -0.5], [0.3, 0.6]].forEach((q, j) => { if (a * 3 > j) W.person(iso, p[0] + q[0], p[1] + q[1], top, {h: 1.5, body: ['#3C7FB1', '#EE6A44', '#08B386'][j], face: j % 2 ? -1 : 1}); });
      if (k === 2) {
        iso.box(p[0] - 0.08, p[1] - 0.9, top, 0.16, 0.16, 1.8 * a, W.T.navy); iso.box(p[0] - 0.08, p[1] + 0.74, top, 0.16, 0.16, 1.8 * a, W.T.navy);
        iso.box(p[0] - 0.12, p[1] - 1.2, top + 1.6 * a, 0.24, 2.4, 1.2 * a, W.T.navy, {decal: (I2, b) => {
          if (a < 1) return; const X = b.x + b.w + 0.01;
          I2.g.save(); const s0 = I2.L(X, b.y + b.d - 0.25, b.z + 0.38), s1 = I2.L(X, b.y + 0.25, b.z + 0.38), k2 = I2.cam.k;
          I2.g.translate(s0[0], s0[1]); I2.g.transform(I.C30, -0.5, 0, 1, 0, 0); I2.g.font = '800 ' + (0.62 * k2).toFixed(1) + 'px "Be Vietnam Pro"'; I2.g.fillStyle = '#FFF4E2'; I2.g.fillText('BẾP GIÓ', 0, 0); I2.g.restore();
        }});
      }
    });
    // đơn chạy trên băng
    for (let k = 0; k < 3; k++) W.order(iso, -6.8 + ((t * 2 + k * 4.8) % 14), 0, 0.12, {s: 0.7});
    iso.flush();
    POS.forEach((p, k) => {
      const s = iso.P(p[0], p[1], H + 3.4), el = LAB[k];
      el.style.left = s[0] + 'px'; el.style.top = (s[1] - (L16 ? 110 : 120)) + 'px';
    });
  });
  W.words(tl, '#hd', 0.4, {stagger: 0.05});
  [0, 1, 2].forEach((k) => W.fadeIn(tl, ['#la', '#lb', '#lc'][k], TS[k] + 0.6, {dist: 18}));
</script>
</body>
</html>
