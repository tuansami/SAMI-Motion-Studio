<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/cormorant/600.css">
<link rel="stylesheet" href="_fonts/cormorant/600-italic.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css">
<link rel="stylesheet" href="hf/parts/bp.css">
<style>
  /* S11 · 3 LỢI ÍCH: thẻ ấm, icon vẽ nét đồng, vào lần lượt rồi đứng yên; cuối cảnh ánh ấm dịu xuống (nhịp thở) */
  #kick { font-size: 76px; color: #FFF6EA; }
  .bn { position: absolute; z-index: 10; left: 70px; right: 70px; height: 300px; border-radius: 24px; background: rgba(34, 18, 12, .58); border: 2px solid rgba(226, 193, 142, .35);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35); display: flex; align-items: center; gap: 36px; padding: 0 48px; box-sizing: border-box; will-change: transform; }
  .bn svg { flex: none; width: 150px; height: 150px; }
  .bn svg * { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .bn .tx { flex: 1; }
  .bn .t { font: 600 66px/1.12 "Cormorant", serif; color: var(--cream); }
  .bn .s { margin-top: 12px; font: 500 36px/1.35 "Be Vietnam Pro", sans-serif; color: #E8D9C6; }
  .bn .n { position: absolute; right: 30px; top: 22px; font: 600 italic 40px/1 "Cormorant", serif; color: rgba(226, 193, 142, .5); }
  #b1 { top: 560px; } #b2 { top: 900px; } #b3 { top: 1240px; }
  [data-ratio="16x9"] #kick { left: 110px; right: 110px; width: auto; top: 150px; font-size: 72px; }
  [data-ratio="16x9"] .bn { top: 360px; width: 540px; height: 540px; left: auto; right: auto; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 48px 44px; gap: 30px; }
  [data-ratio="16x9"] #b1, [data-ratio="16x9"] #b2, [data-ratio="16x9"] #b3 { top: 360px; }
  [data-ratio="16x9"] #b1 { left: 110px; } [data-ratio="16x9"] #b2 { left: 690px; } [data-ratio="16x9"] #b3 { left: 1270px; }
  [data-ratio="16x9"] .bn .t { font-size: 56px; white-space: nowrap; }
  [data-ratio="16x9"] .bn .s { font-size: 31px; }
  #dim { position: absolute; inset: 0; z-index: 25; background: #0C0628; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="S11">
  <div class="warm"></div>
  <div class="glow" id="glow"></div>
  <div class="hd lan top" id="kick" data-copy="S11_kicker"></div>
  <div class="bn" id="b1"><svg viewBox="0 0 100 100"><path d="M18 22 H82 A8 8 0 0 1 90 30 V62 A8 8 0 0 1 82 70 H46 L28 84 V70 H18 A8 8 0 0 1 10 62 V30 A8 8 0 0 1 18 22 Z"/><path d="M50 58 C38 50 32 44 32 38 A8 8 0 0 1 50 34 A8 8 0 0 1 68 38 C68 44 62 50 50 58 Z"/></svg>
    <div class="tx"><div class="t" data-copy="S11_b1t"></div><div class="s" data-copy="S11_b1"></div></div><div class="n">01</div></div>
  <div class="bn" id="b2"><svg viewBox="0 0 100 100"><path d="M52 12 H84 A4 4 0 0 1 88 16 V48 L46 90 A4 4 0 0 1 40 90 L10 60 A4 4 0 0 1 10 54 Z"/><circle cx="70" cy="30" r="7"/><path d="M34 58 L54 38 M40 66 L58 48"/></svg>
    <div class="tx"><div class="t" data-copy="S11_b2t"></div><div class="s" data-copy="S11_b2"></div></div><div class="n">02</div></div>
  <div class="bn" id="b3"><svg viewBox="0 0 100 100"><rect x="8" y="34" width="26" height="32" rx="4"/><rect x="38" y="20" width="26" height="60" rx="4"/><rect x="68" y="34" width="26" height="32" rx="4"/><path d="M34 50 H38 M64 50 H68"/><path d="M45 34 H57 M45 44 H57"/></svg>
    <div class="tx"><div class="t" data-copy="S11_b3t"></div><div class="s" data-copy="S11_b3"></div></div><div class="n">03</div></div>
  <div class="vig"></div>
  <div id="dim"></div>
</div>
<script src="hf/parts/bp.js"></script>
<script>
  const S = window.SAMI, B = window.BP, tl = S.timeline(), $ = B.$;
  const BN = ['#b1', '#b2', '#b3'].map((id, i) => {
    const e = $(id), sv = [...e.querySelectorAll('svg *')];
    sv.forEach((p) => { const l = p.getTotalLength ? p.getTotalLength() : 300; p.len = l; p.style.strokeDasharray = l + ' ' + l; });
    return {e, sv, t: [0.6, 3.0, 5.4][i]};
  });
  B.clock(tl, (t) => {
    const g = $('#glow'), gs = 2200; g.style.left = (S.w / 2 - gs / 2) + 'px'; g.style.top = (S.h * 0.4 - gs / 2) + 'px'; g.style.width = g.style.height = gs + 'px';
    g.style.opacity = (0.3 + 0.08 * Math.sin(t * 1.4)).toFixed(3);
    BN.forEach((b) => {
      const u = B.E(t, b.t, b.t + 0.6);
      b.e.style.opacity = B.L(t, b.t, b.t + 0.3);
      b.e.style.transform = 'translateY(' + (50 * (1 - u)).toFixed(1) + 'px)';
      b.sv.forEach((p, i) => { p.style.strokeDashoffset = (p.len * (1 - B.E(t, b.t + 0.2 + i * 0.12, b.t + 1.1 + i * 0.12))).toFixed(1); });
    });
    $('#dim').style.opacity = (0.35 * B.E(t, 8.3, 9.2)).toFixed(3);
  });
  B.rise(tl, S.words($('#kick')), 0.3, {stagger: 0.06, dur: 0.6});
  BN.forEach((b) => B.rise(tl, b.e.querySelectorAll('.t, .s'), b.t + 0.25, {stagger: 0.18, dy: 18}));
</script>
</body>
</html>
