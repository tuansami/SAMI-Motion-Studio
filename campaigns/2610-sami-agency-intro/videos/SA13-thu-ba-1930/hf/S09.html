<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/fraunces/300.css">
<link rel="stylesheet" href="_fonts/fraunces/300-italic.css">
<link rel="stylesheet" href="hf/parts/cn.css">
<style>
  /* S09 · câu chốt cảm xúc: tô phở bốc hơi đặt xuống bàn, nền bokeh quán đông; 1,5 s cuối đứng yên (nhịp thở) */
  #back { background: radial-gradient(ellipse at 50% 40%, #3A2A1C 0%, #1A1712 40%, #071012 100%); }
  #tbl { position: absolute; left: -10%; right: -10%; bottom: 0; height: 40%; background: linear-gradient(180deg, #5A3420 0%, #3A2214 60%, #22140C 100%); border-top: 2px solid rgba(255, 213, 154, .25); }
  #l1 { font-size: 112px; line-height: 1.15; }
  .stack { top: 300px; }
  #bw { position: absolute; z-index: 10; left: 140px; top: 1020px; width: 800px; height: 560px; }
  [data-ratio="16x9"] #bw { left: 1060px; top: 330px; width: 760px; height: 532px; }
  [data-ratio="16x9"] #tbl { height: 34%; }
  [data-ratio="16x9"] #l1 { font-size: 100px; }
  [data-ratio="16x9"] .stack { width: 860px; top: 46%; }
</style>
</head>
<body>
<div id="root" data-composition-id="S09">
  <div class="cam" id="cam">
    <div class="fill" id="back"></div>
    <div class="fill" id="bk"></div>
    <div id="tbl"></div>
    <svg id="bw" viewBox="0 0 400 280"></svg>
  </div>
  <div class="stack"><div class="hd" id="l1" data-copy="S09_l1"></div></div>
  <div class="vign"></div>
</div>
<script src="hf/parts/cine.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), CN = window.CN, el = CN.el, $ = (s) => document.querySelector(s);
  const bok = CN.bokeh($('#bk'), {n: 26, seed: 93, rmin: 40, rmax: 150, blur: 10, h: S.h * 0.62, pal: ['242,166,90', '255,213,154', '242,166,90', '120,190,190']});
  const b = $('#bw');
  b.innerHTML = '<defs><radialGradient id="br" cx=".5" cy=".4"><stop offset="0" stop-color="#E7A660"/><stop offset=".7" stop-color="#B8702F"/><stop offset="1" stop-color="#7A4424"/></radialGradient>' +
    '<linearGradient id="bo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F0E4"/><stop offset="1" stop-color="#BDB2A0"/></linearGradient>' +
    '<filter id="sb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>' +
    '<ellipse id="sh" cx="200" cy="250" rx="170" ry="22" fill="#000" opacity=".5"/>' +
    '<g id="bowl"><path d="M30 120 Q200 330 370 120 Z" fill="url(#bo)"/><path d="M60 196 Q200 262 340 196" stroke="#A8402E" stroke-width="5" fill="none" opacity=".6"/>' +
    '<ellipse cx="200" cy="120" rx="170" ry="44" fill="#EFE7D8"/><ellipse cx="200" cy="122" rx="152" ry="36" fill="url(#br)"/>' +
    '<path d="M110 120 q30 -14 60 0 q30 14 60 0 q30 -14 60 0" stroke="#F8EBCF" stroke-width="7" fill="none" opacity=".9"/>' +
    '<ellipse cx="150" cy="112" rx="34" ry="10" fill="#8A4A2E"/><ellipse cx="236" cy="128" rx="30" ry="9" fill="#9A5534"/>' +
    '<circle cx="190" cy="104" r="7" fill="#4F8A3A"/><circle cx="268" cy="112" r="6" fill="#5E9B45"/><circle cx="120" cy="130" r="5" fill="#4F8A3A"/><circle cx="212" cy="138" r="6" fill="#5E9B45"/>' +
    '<ellipse cx="300" cy="118" rx="12" ry="6" fill="#E9D27A"/><path d="M250 30 L390 160" stroke="#C9A36A" stroke-width="7" stroke-linecap="round"/><path d="M270 22 L398 150" stroke="#B88F55" stroke-width="7" stroke-linecap="round"/></g>' +
    '<g id="stm" fill="none" stroke="#FFF6E6" stroke-width="9" stroke-linecap="round" filter="url(#sb)"></g>';
  const st = []; for (let i = 0; i < 4; i++) st.push(el('path', {opacity: .4}, $('#stm')));
  CN.clock(tl, (t) => {
    bok(t, 1);
    const k = CN.E(t, 0.2, 1.1);
    $('#bowl').setAttribute('transform', 'translate(0,' + (-90 * (1 - k)).toFixed(1) + ')');
    $('#sh').setAttribute('opacity', (0.15 + 0.35 * k).toFixed(3)); $('#sh').setAttribute('rx', (120 + 50 * k).toFixed(1));
    st.forEach((p, i) => { let d = ''; const x0 = 130 + i * 48; for (let j = 0; j <= 14; j++) { const y = 100 - j * 7.5, x = x0 + Math.sin(j * 0.5 + t * 1.8 + i * 1.7) * 12 * (j / 14); d += (j ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); } p.setAttribute('d', d); p.setAttribute('opacity', (k * (0.3 + 0.12 * Math.sin(t * 1.3 + i))).toFixed(3)); });
    $('#cam').style.transform = 'scale(' + (1.0 + 0.025 * CN.E(t, 0, S.dur - 1.5)).toFixed(4) + ')';
  });
  S.arrive(tl, S.words($('#l1')), 1.0, {dist: 18, blur: 10, dur: 0.9, stagger: 0.14});
</script>
</body>
</html>
