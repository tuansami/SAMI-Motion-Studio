<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/fraunces/300.css">
<link rel="stylesheet" href="_fonts/fraunces/300-italic.css">
<link rel="stylesheet" href="_fonts/be-vietnam-pro/300.css">
<link rel="stylesheet" href="hf/parts/cn.css">
<style>
  /* S01 · hook: kính đẫm mưa; một giọt trượt xuống, kéo dài thành kim phút, rơi vào số 6 → 19:30 */
  #back { background: radial-gradient(ellipse at 50% 55%, #12363D 0%, #0A2228 45%, #051216 100%); }
  #glassTint { background: linear-gradient(160deg, rgba(120, 190, 190, .06), rgba(5, 18, 22, 0) 40%, rgba(242, 166, 90, .05)); }
  #clock { position: absolute; z-index: 5; }
  #time { left: var(--safe-side); right: var(--safe-side); top: 250px; text-align: center; font-size: 124px; line-height: 1.12; }
  #sub { left: 110px; right: 110px; top: 1360px; text-align: center; }
  [data-ratio="16x9"] #time { left: 120px; right: auto; width: 760px; top: 270px; text-align: left; font-size: 120px; }
  [data-ratio="16x9"] #sub { left: 124px; right: auto; width: 700px; top: 600px; text-align: left; }
</style>
</head>
<body>
<div id="root" data-composition-id="S01">
  <div class="cam" id="cam">
    <div class="fill" id="back"></div>
    <div class="fill" id="bk"></div>
    <svg id="clock"></svg>
    <div class="fill" id="glassTint"></div>
    <div class="fill" id="glass"></div>
    <svg id="dropSvg" class="fill" style="z-index:8"></svg>
  </div>
  <div class="hd" id="time" data-copy="S01_time"></div>
  <div class="sub" id="sub" data-copy="S01_sub"></div>
  <div class="vign"></div>
</div>
<script src="hf/parts/cine.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), CN = window.CN, el = CN.el, $ = (s) => document.querySelector(s);
  const P = S.portrait, C = P ? {x: 540, y: 1000, r: 230} : {x: 1390, y: 540, r: 270};
  const bok = CN.bokeh($('#bk'), {n: 22, seed: 7, rmin: 40, rmax: 170, blur: 6});
  const rain = CN.rainGlass(CN.canvas($('#glass'), 0, 0, S.w, S.h), {seed: 11, scale: 1.5, beads: Math.round(S.w * S.h / 3800), drops: Math.round(S.w / 34)});
  // đồng hồ sau kính (mờ, ấm)
  const svg = $('#clock'); svg.setAttribute('width', S.w); svg.setAttribute('height', S.h); svg.setAttribute('viewBox', '0 0 ' + S.w + ' ' + S.h);
  svg.innerHTML = '<defs><radialGradient id="face"><stop offset="0" stop-color="#F6ECD8"/><stop offset=".85" stop-color="#E3D3B4"/><stop offset="1" stop-color="#B99A6E"/></radialGradient>' +
    '<radialGradient id="halo"><stop offset="0" stop-color="#F2A65A" stop-opacity=".55"/><stop offset="1" stop-color="#F2A65A" stop-opacity="0"/></radialGradient></defs>';
  const face = el('g', {}, svg);
  el('circle', {cx: C.x, cy: C.y, r: C.r * 1.9, fill: 'url(#halo)'}, face);
  el('circle', {cx: C.x, cy: C.y, r: C.r + 14, fill: '#2B1B12'}, face);
  el('circle', {cx: C.x, cy: C.y, r: C.r, fill: 'url(#face)'}, face);
  for (let m = 0; m < 60; m++) { const a = m * Math.PI / 30, big = m % 5 === 0; el('line', {x1: C.x + Math.sin(a) * C.r * (big ? 0.8 : 0.88), y1: C.y - Math.cos(a) * C.r * (big ? 0.8 : 0.88), x2: C.x + Math.sin(a) * C.r * 0.93, y2: C.y - Math.cos(a) * C.r * 0.93, stroke: '#2A1A12', 'stroke-width': big ? 6 : 2}, face); }
  const hour = el('line', {x1: C.x, y1: C.y, x2: C.x, y2: C.y - C.r * 0.5, stroke: '#1A100A', 'stroke-width': 11, 'stroke-linecap': 'round', transform: 'rotate(' + (19.5 % 12) * 30 + ' ' + C.x + ' ' + C.y + ')'}, face);
  el('circle', {cx: C.x, cy: C.y, r: 12, fill: '#A8402E'}, face);
  // giọt mưa → kim phút
  const ds = $('#dropSvg'); ds.setAttribute('viewBox', '0 0 ' + S.w + ' ' + S.h);
  const hand = el('line', {x1: C.x, y1: C.y, x2: C.x, y2: C.y + C.r * 0.8, stroke: '#1A100A', 'stroke-width': 7, 'stroke-linecap': 'round', opacity: 0}, ds);
  const drop = el('g', {}, ds);
  const dropTrail = el('path', {fill: 'none', stroke: 'rgba(255,214,160,.35)', 'stroke-width': 10, 'stroke-linecap': 'round'}, drop);
  const dropBody = el('ellipse', {rx: 22, ry: 30, fill: 'rgba(255,214,160,.8)', stroke: 'rgba(255,255,255,.5)', 'stroke-width': 2}, drop);
  const dropHi = el('circle', {r: 6, fill: 'rgba(255,255,255,.9)'}, drop);
  const start = P ? {x: 610, y: 120} : {x: 1520, y: -40}, end = {x: C.x, y: C.y};
  const path = (k) => ({x: CN.mix(start.x, end.x, k) + Math.sin(k * 9) * 10 * (1 - k), y: CN.mix(start.y, end.y, k)});
  CN.clock(tl, (t) => {
    bok(t, 1); rain(t, 1);
    // giọt trượt 0.15 → 1.45 s, rồi kéo dài thành kim (1.45 → 1.95 s)
    const k = CN.E(t, 0.15, 1.45), p = path(k), q = path(Math.max(0, k - 0.14));
    const st = CN.E(t, 1.45, 1.95);
    dropBody.setAttribute('cx', p.x); dropBody.setAttribute('cy', p.y + st * C.r * 0.4); dropHi.setAttribute('cx', p.x - 6); dropHi.setAttribute('cy', p.y - 8 + st * C.r * 0.4);
    dropBody.setAttribute('ry', 24 + st * C.r * 0.4); dropBody.setAttribute('rx', 18 - st * 12);
    dropTrail.setAttribute('d', 'M' + q.x.toFixed(1) + ' ' + q.y.toFixed(1) + ' L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1));
    drop.setAttribute('opacity', (1 - CN.E(t, 1.8, 2.15)).toFixed(3));
    dropTrail.setAttribute('opacity', (1 - st).toFixed(3));
    hand.setAttribute('opacity', CN.E(t, 1.7, 2.1).toFixed(3));
    // kim "rơi" vào số 6: lắc nhẹ rồi đứng
    const wob = t > 1.9 ? Math.sin((t - 1.9) * 22) * 6 * Math.exp(-(t - 1.9) * 5) : 0;
    hand.setAttribute('transform', 'rotate(' + wob.toFixed(2) + ' ' + C.x + ' ' + C.y + ')');
    face.setAttribute('opacity', (0.15 + 0.85 * CN.E(t, 0.9, 2.2)).toFixed(3));
    face.style.filter = 'blur(' + (8 * (1 - CN.E(t, 0.9, 2.2))).toFixed(2) + 'px)';
    // camera: trôi nhẹ, cuối cảnh đẩy xuyên qua kính
    const push = CN.E(t, S.dur - 1.0, S.dur + 0.2);
    $('#cam').style.transformOrigin = C.x + 'px ' + C.y + 'px';
    $('#cam').style.transform = 'scale(' + (1.04 - 0.04 * t / S.dur + 0.5 * push).toFixed(4) + ')';
    $('#glass').style.opacity = (1 - push).toFixed(3);
  });
  S.arrive(tl, '#time', 1.2, {dist: 26, blur: 14, dur: 1.0});
  S.arrive(tl, '#sub', 2.3, {dist: 20, blur: 10, dur: 0.9});
  S.leave(tl, ['#time', '#sub'], S.dur - 0.9, {dist: -10, blur: 10, dur: 0.6});
</script>
</body>
</html>
