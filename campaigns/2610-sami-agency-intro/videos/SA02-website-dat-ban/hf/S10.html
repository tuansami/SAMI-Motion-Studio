<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/fraunces/600.css"><link rel="stylesheet" href="_fonts/fraunces/500-italic.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S10 · Nhịp thở + câu chốt: biển „Geschlossen" đung đưa trong tối, lật thành „Online · 24/7 geöffnet". */
  #stage { background: radial-gradient(60% 40% at 50% 35%, #1B1640 0%, #06031A 75%); }
  #glow { position: absolute; left: 50%; top: 760px; width: 1100px; height: 1100px; margin: -550px; border-radius: 50%; background: radial-gradient(circle, rgba(8,221,164,.4), transparent 62%); opacity: 0; }
  #hook { position: absolute; left: 50%; top: 470px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #3A3462; box-shadow: inset 0 0 0 5px #57508A; }
  #rig { position: absolute; left: 50%; top: 483px; width: 640px; height: 520px; margin-left: -320px; transform-origin: 50% 0; perspective: 1600px; }
  #rig svg { position: absolute; left: 0; top: 0; width: 640px; height: 200px; overflow: visible; }
  #sign { position: absolute; left: 20px; top: 180px; width: 600px; height: 320px; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; border-radius: 34px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #f1 { background: linear-gradient(160deg, #5A3A24, #3B2415); box-shadow: inset 0 0 0 10px #2A180D, inset 0 0 0 13px #7A5537, 0 40px 80px rgba(0,0,0,.6); color: #F1E3CC; }
  #f1 b { font-family: Fraunces; font-weight: 600; font-size: 104px; letter-spacing: -.01em; }
  #f1 small { font-family: Fraunces; font-style: italic; font-weight: 500; font-size: 38px; opacity: .75; margin-top: -4px; }
  #f2 { transform: rotateY(180deg); background: linear-gradient(160deg, #1A1640, #0C0628); box-shadow: inset 0 0 0 3px rgba(8,221,164,.9), 0 0 60px rgba(8,221,164,.45), 0 40px 80px rgba(0,0,0,.6); color: #fff; }
  #f2 b { font-family: "Be Vietnam Pro"; font-weight: 800; font-size: 120px; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 8px; }
  #f2 small { font-family: "JetBrains Mono"; font-weight: 600; font-size: 36px; color: #fff; margin-top: 10px; display: flex; align-items: center; gap: 14px; }
  #f2 small i { width: 18px; height: 18px; border-radius: 50%; background: var(--c-mint); box-shadow: 0 0 14px var(--c-mint); }
  #head { top: 1110px; font-size: 66px; }
  #sub { top: 1300px; font-family: "Be Vietnam Pro"; font-weight: 800; font-size: 92px; line-height: 1.2; color: #fff; }
  [data-ratio="16x9"] #rig { left: 560px; top: 223px; } [data-ratio="16x9"] #hook { left: 560px; top: 210px; } [data-ratio="16x9"] #glow { left: 560px; top: 520px; }
  [data-ratio="16x9"] #head { left: 1000px; right: 120px; top: 380px; text-align: left; }
  [data-ratio="16x9"] #sub { left: 1000px; right: 100px; top: 560px; text-align: left; font-size: 96px; }
</style></head>
<body>
<div id="root" data-composition-id="S10">
<div id="stage" class="clip">
  <div id="glow"></div>
  <div id="fx" class="clip"></div>
  <div id="hook"></div>
  <div id="rig"><svg viewBox="0 0 640 200"><path d="M320 0 L110 180 M320 0 L530 180" stroke="#8A83B8" stroke-width="4" fill="none"/><circle cx="110" cy="182" r="9" fill="#57508A"/><circle cx="530" cy="182" r="9" fill="#57508A"/></svg>
    <div id="sign"><div class="face" id="f1"><b>Geschlossen</b><small>Bis morgen, 11:30 Uhr</small></div><div class="face" id="f2"><b>Online</b><small><i></i>24/7 geöffnet</small></div></div></div>
  <div id="head" class="hd txtshadow" data-copy="S10_head"></div>
  <div id="sub" class="sub txtshadow" data-copy="S10_sub"></div>
</div>
</div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), K = window.K;
  K.dust(tl, document.getElementById('fx'), 22, 111, {color: '#E3E4F7', op: 0.2, rise: 50});
  const FLIP = S.beat(5);
  // nhịp thở: biển đung đưa tắt dần (dao động tất định theo thời gian)
  K.tick(tl, (t) => { const a = 7 * Math.exp(-t * 0.55) * Math.cos(t * 2.6) * (t < FLIP ? 1 : Math.max(0, 1 - (t - FLIP) * 2)); document.getElementById('rig').style.transform = 'rotate(' + a + 'deg)'; });
  tl.fromTo('#rig, #hook', {opacity: 0}, {opacity: 1, duration: 0.6}, 0);
  K.say(tl, '#head', S.beat(2.2), {stagger: 0.07});
  tl.to('#sign', {rotationY: 180, duration: 0.9}, FLIP);
  tl.to('#glow', {opacity: 1, duration: 0.8}, FLIP + 0.3);
  tl.to('#stage', {background: 'radial-gradient(60% 40% at 50% 35%, #231C55 0%, #0C0628 75%)', duration: 0.8}, FLIP);
  K.say(tl, '#sub', FLIP + 0.5, {stagger: 0.09});
</script>
</body></html>
