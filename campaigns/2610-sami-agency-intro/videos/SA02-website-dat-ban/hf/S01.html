<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S01 · Hook: 23:40, quán tối, điện thoại trên quầy đổ chuông rồi thành cuộc gọi nhỡ. */
  #stage { background: #03040B; }
  #room { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1920px; margin: -960px 0 0 -960px; }
  #room svg { width: 100%; height: 100%; }
  #clock { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-family: "Be Vietnam Pro"; font-weight: 800; font-size: 250px; letter-spacing: -.04em; color: #fff; line-height: 1; z-index: 30; display: flex; justify-content: center; }
  #clock .dg { display: inline-block; height: 1em; line-height: 1; }
  #clock .col { opacity: .55; margin: 0 .02em; }
  #last { display: inline-block; overflow: hidden; height: 1em; line-height: 1; vertical-align: top; }
  #last .roll { display: block; }
  #last .roll .dg { display: block; }
  #head { top: 540px; text-align: center; font-size: 72px; }
  #ph { left: 50%; top: 940px; margin-left: -300px; transform: scale(.62) rotate(-5deg); transform-origin: 50% 0; }
  .call { position: absolute; inset: 0; background: linear-gradient(180deg, #2B3550 0%, #151A2C 60%, #0D101B 100%); }
  .call .who { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-family: Inter; color: #fff; }
  .call .who small { display: block; font-size: 30px; font-weight: 500; opacity: .7; }
  .call .who b { display: block; font-size: 64px; font-weight: 600; margin-top: 18px; letter-spacing: -.01em; }
  .call .av { position: absolute; left: 50%; top: 470px; width: 190px; height: 190px; margin-left: -95px; border-radius: 50%; background: linear-gradient(135deg, #6F7DA8, #3E4868); display: flex; align-items: center; justify-content: center; }
  .call .av svg { width: 110px; height: 110px; }
  .call .btns { position: absolute; left: 70px; right: 70px; bottom: 150px; display: flex; justify-content: space-between; }
  .call .btns i { width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .call .btns svg { width: 74px; height: 74px; }
  .missed { position: absolute; left: 40px; right: 40px; top: 160px; border-radius: 40px; background: rgba(40,40,52,.92); padding: 30px 34px; font-family: Inter; color: #fff; display: flex; gap: 24px; align-items: center; opacity: 0; }
  .missed .ico { width: 80px; height: 80px; border-radius: 20px; background: #34C759; flex: none; display: flex; align-items: center; justify-content: center; }
  .missed b { font-size: 32px; display: block; } .missed small { font-size: 27px; color: #FF6B6B; font-weight: 600; }
  .wave { position: absolute; left: 50%; top: 1330px; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%; border: 3px solid rgba(140,170,255,.55); opacity: 0; z-index: 4; }
  #shine { position: absolute; left: 50%; top: 1330px; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; border-radius: 50%; background: radial-gradient(circle, rgba(120,150,255,.32) 0%, rgba(120,150,255,0) 62%); z-index: 3; opacity: 0; }
  [data-ratio="16x9"] #clock { left: 140px; right: auto; top: 250px; font-size: 230px; justify-content: flex-start; }
  [data-ratio="16x9"] #head { left: 150px; right: auto; width: 1080px; top: 560px; text-align: left; font-size: 76px; }
  [data-ratio="16x9"] #ph { left: auto; right: 260px; top: 120px; margin-left: 0; transform: scale(.66) rotate(-5deg); }
  [data-ratio="16x9"] .wave, [data-ratio="16x9"] #shine { left: 1460px; top: 540px; }
</style></head>
<body>
<div id="root" data-composition-id="S01">
<div id="stage" class="clip">
  <div id="room"><svg viewBox="0 0 1920 1920">
    <defs>
      <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2A52"/><stop offset="1" stop-color="#0B1230"/></linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FA7FF" stop-opacity=".16"/><stop offset="1" stop-color="#8FA7FF" stop-opacity="0"/></linearGradient>
      <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFB86B" stop-opacity=".55"/><stop offset="1" stop-color="#FFB86B" stop-opacity="0"/></radialGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070A16"/><stop offset="1" stop-color="#03040A"/></linearGradient>
    </defs>
    <rect width="1920" height="1920" fill="#04060F"/>
    <rect y="1180" width="1920" height="740" fill="url(#floor)"/>
    <!-- cửa kính + đèn đường -->
    <g id="window"><rect x="1180" y="560" width="560" height="640" rx="6" fill="url(#win)"/><circle cx="1610" cy="640" r="160" fill="url(#lamp)"/><circle cx="1610" cy="640" r="10" fill="#FFD9A8"/>
      <path d="M1180 760 H1740 M1460 560 V1200" stroke="#03040B" stroke-width="16"/><rect x="1180" y="560" width="560" height="640" rx="6" fill="none" stroke="#03040B" stroke-width="22"/></g>
    <path d="M1170 1200 L1750 1200 L1920 1650 L900 1650 Z" fill="url(#beam)"/>
    <!-- đèn thả tắt -->
    <g stroke="#1B2140" stroke-width="3"><path d="M520 0 V520"/><path d="M960 0 V470"/><path d="M1400 0 V520"/></g>
    <g fill="#0F1430"><path d="M470 520 h100 l30 60 h-160 z"/><path d="M910 470 h100 l30 60 h-160 z"/><path d="M1350 520 h100 l30 60 h-160 z"/></g>
    <!-- bàn + ghế úp -->
    <g id="tables" fill="#0C1126" stroke="#34407A" stroke-width="2.5">
      <g transform="translate(340 1060)"><rect x="0" y="0" width="360" height="22" rx="6"/><rect x="30" y="22" width="16" height="230"/><rect x="314" y="22" width="16" height="230"/>
        <rect x="40" y="-24" width="120" height="24" rx="4"/><rect x="48" y="-150" width="12" height="126"/><rect x="140" y="-150" width="12" height="126"/><rect x="40" y="0" width="14" height="0"/>
        <rect x="200" y="-24" width="120" height="24" rx="4"/><rect x="208" y="-150" width="12" height="126"/><rect x="300" y="-150" width="12" height="126"/></g>
      <g transform="translate(760 1130)"><rect x="0" y="0" width="300" height="20" rx="6"/><rect x="26" y="20" width="14" height="200"/><rect x="260" y="20" width="14" height="200"/>
        <rect x="30" y="-22" width="110" height="22" rx="4"/><rect x="38" y="-136" width="11" height="114"/><rect x="121" y="-136" width="11" height="114"/>
        <rect x="160" y="-22" width="110" height="22" rx="4"/><rect x="168" y="-136" width="11" height="114"/><rect x="251" y="-136" width="11" height="114"/></g>
    </g>
    <!-- quầy -->
    <rect x="0" y="1560" width="1920" height="360" fill="#080B18"/><rect x="0" y="1560" width="1920" height="10" fill="#1C2344"/>
  </svg></div>
  <div id="shine"></div>
  <i class="wave"></i><i class="wave"></i><i class="wave"></i>
  <div id="clock"><span class="dg">2</span><span class="dg">3</span><span class="col">:</span><span id="last"><span class="roll"><span class="dg">39</span><span class="dg">40</span></span></span></div>
  <div id="head" class="hd txtshadow" data-copy="S01_head"></div>
  <div id="ph" class="phone"><div class="island"></div><div class="scr">
    <div class="call" id="call">
      <div class="sbar"><span>23:40</span><span class="ic"><b></b><i></i></span></div>
      <div class="who"><small>Mobil · ruft an …</small><b>+49 171 ••• 4182</b></div>
      <div class="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.2" fill="#fff" opacity=".9"/><path d="M3.5 21 C4.5 15.5 19.5 15.5 20.5 21 Z" fill="#fff" opacity=".9"/></svg></div>
      <div class="btns"><i style="background:#FF3B30"><svg viewBox="0 0 24 24"><path d="M3 14.5 C7.5 10 16.5 10 21 14.5 L19 17 L15.5 15.5 L15.5 13.5 C13 12.7 11 12.7 8.5 13.5 L8.5 15.5 L5 17 Z" fill="#fff"/></svg></i><i id="acc" style="background:#34C759"><svg viewBox="0 0 24 24"><path d="M6.6 3 L9.6 6.8 L8 9.2 C9.2 11.6 11.4 13.8 13.8 15 L16.2 13.4 L20 16.4 L18.4 19.6 C11 20 3.4 12.4 3.4 4.6 Z" fill="#fff"/></svg></i></div>
    </div>
    <div class="missed" id="missed"><div class="ico"><svg viewBox="0 0 24 24" style="width:46px;height:46px"><path d="M6.6 3 L9.6 6.8 L8 9.2 C9.2 11.6 11.4 13.8 13.8 15 L16.2 13.4 L20 16.4 L18.4 19.6 C11 20 3.4 12.4 3.4 4.6 Z" fill="#fff"/></svg></div><div><b>Verpasster Anruf</b><small>+49 171 ••• 4182 · gerade eben</small></div></div>
  </div></div>
</div>
</div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), K = window.K;
  // phút trước → phút trong copy (mặc định 23:39 lật thành 23:40)
  const clk = (S.text('S01_clock') || '23:40').replace(/\D/g, '').padStart(4, '0');
  const dg = document.querySelectorAll('#clock > .dg'), roll = document.querySelector('#last .roll');
  dg[0].textContent = clk[0]; dg[1].textContent = clk[1];
  roll.children[0].textContent = String((+clk.slice(2) + 59) % 60).padStart(2, '0'); roll.children[1].textContent = clk.slice(2);
  // 0–0.5 s đen; quán hiện dần; đồng hồ vào; lật phút
  tl.fromTo('#room', {opacity: 0, scale: 1.08}, {opacity: 1, scale: 1, duration: S.dur, ease: 'none'}, 0);
  tl.fromTo('#room', {opacity: 0}, {opacity: 1, duration: 1.4}, 0.2);
  tl.fromTo('#clock', {opacity: 0, y: 40, filter: 'blur(14px)'}, {opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.8}, S.beat(0.2));
  tl.to(roll, {yPercent: -50, duration: 0.45}, S.beat(2));
  K.say(tl, '#head', S.beat(3), {stagger: 0.08});
  // điện thoại: sáng màn, rung theo từng hồi chuông
  tl.fromTo('#ph', {opacity: 0, y: 80}, {opacity: 1, y: 0, duration: 0.9}, S.beat(0.6));
  tl.fromTo('#ph .scr', {filter: 'brightness(0)'}, {filter: 'brightness(1)', duration: 0.5}, S.beat(1));
  tl.fromTo('#shine', {opacity: 0}, {opacity: 1, duration: 0.6}, S.beat(1));
  const rings = [[S.beat(1), S.beat(3)], [S.beat(4), S.beat(6)]], endCall = S.beat(7.4);
  const base = getComputedStyle(document.getElementById('ph')).transform;
  K.tick(tl, (t) => {
    let v = 0; rings.forEach(([a, b]) => { if (t > a && t < b) v = Math.sin((t - a) * 2 * Math.PI * 22) * 5 * Math.min(1, (b - t) * 6, (t - a) * 6); });
    document.getElementById('ph').style.translate = v + 'px 0';
  });
  document.querySelectorAll('.wave').forEach((w, i) => rings.forEach(([a]) => tl.fromTo(w, {opacity: 0.8, scale: 0.6}, {opacity: 0, scale: 2.4, duration: 1.4, ease: 'power1.out'}, a + i * 0.32)));
  tl.fromTo('#acc', {scale: 1}, {scale: 1.08, duration: 0.25, yoyo: true, repeat: 7, ease: 'sine.inOut'}, S.beat(1));
  // cuộc gọi nhỡ
  tl.to('#call', {filter: 'brightness(.35)', duration: 0.4}, endCall);
  tl.to('#shine', {opacity: 0.35, duration: 0.5}, endCall);
  tl.fromTo('#missed', {opacity: 0, y: -60}, {opacity: 1, y: 0, duration: 0.6}, endCall + 0.1);
</script>
</body></html>
