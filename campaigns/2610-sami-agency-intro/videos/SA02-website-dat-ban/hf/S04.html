<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/fraunces/600.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S04 · Bước ngoặt: đêm lạnh → navy SAMI; màn hình điện thoại co lại thành artboard, cửa sổ công cụ lắp quanh nó (match-cut sang S05). */
  #stage { background: #05060F; }
  #night { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 70%, #131833 0%, #05060F 70%); }
  #sami { position: absolute; inset: 0; background: radial-gradient(90% 60% at 80% 85%, rgba(118,103,254,.35), transparent 70%), radial-gradient(70% 50% at 10% 20%, rgba(8,221,164,.22), transparent 70%), #0C0628; opacity: 0; }
  #grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 90px 90px; opacity: 0; }
  #head { top: 236px; font-size: 64px; }
  #bezel { position: absolute; border-radius: 68px; background: #0B0B12; box-shadow: 0 0 0 3px #2A2A3A, 0 0 0 9px #101018, 0 60px 120px rgba(0,0,0,.6); }
  #morph { position: absolute; background: #fff; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); z-index: 5; }
  #morph .lbl { position: absolute; left: 0; top: -34px; font-family: Inter; font-size: 18px; color: var(--ui-dim); white-space: nowrap; }
  #toolwrap { position: absolute; left: 40px; top: 500px; transform-origin: 0 0; }
  [data-ratio="16x9"] #toolwrap { left: 1010px; top: 115px; transform: scale(.8); }
  [data-ratio="16x9"] #head { left: 150px; right: auto; width: 780px; top: 380px; font-size: 72px; }
  #credit { position: absolute; right: 22px; top: 14px; height: 36px; padding: 0 14px; border-radius: 99px; background: rgba(8,221,164,.14); color: var(--c-mint); font: 600 17px "JetBrains Mono"; display: flex; align-items: center; gap: 8px; z-index: 3; }
  #credit i { width: 10px; height: 10px; border-radius: 50%; background: var(--c-mint); }
</style></head>
<body>
<div id="root" data-composition-id="S04">
<div id="stage" class="clip">
  <div id="night"></div><div id="sami"></div><div id="grid"></div>
  <div id="fx" class="clip"></div>
  <div id="head" class="hd txtshadow" data-copy="S04_head"></div>
  <div id="toolwrap"></div>
  <div id="bezel"></div>
  <div id="morph"></div>
</div>
</div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), K = window.K;
  const L = S.landscape;
  const tool = K.tool(document.getElementById('toolwrap'));
  K.el('div', '', '<i></i>SAMI · live', tool.querySelector('.bar')).id = 'credit';
  // hình chữ nhật A (màn hình điện thoại) → B (artboard desktop trong canvas của S05)
  const ts = L ? 0.8 : 1, tx = L ? 1010 : 40, ty = L ? 115 : 500;
  const B = {left: tx + 60 * ts, top: ty + (64 + 90) * ts, width: 880 * ts, height: 550 * ts, borderRadius: 6};
  const A = L ? {left: 1204, top: 96, width: 412, height: 885, borderRadius: 53} : {left: 334, top: 576, width: 412, height: 885, borderRadius: 53};
  const bz = {left: A.left - 16, top: A.top - 16, width: A.width + 32, height: A.height + 32};
  gsap.set('#morph', A); gsap.set('#bezel', bz);
  // màu: đêm → SAMI
  tl.to('#sami', {opacity: 1, duration: 1.2}, S.beat(0.6));
  tl.to('#grid', {opacity: 1, duration: 1.5}, S.beat(1.4));
  K.dust(tl, document.getElementById('fx'), 30, 51, {color: '#08DDA4', op: 0.3, rise: 120});
  tl.fromTo(['#morph', '#bezel'], {opacity: 0, y: 60}, {opacity: 1, y: 0, duration: 0.6}, 0);
  K.say(tl, '#head', S.beat(0.5), {stagger: 0.06});
  // co lại thành artboard
  const m = S.beat(3.4);
  tl.to('#bezel', {opacity: 0, scale: 0.9, duration: 0.5}, m);
  tl.to('#morph', Object.assign({duration: 1.1}, B), m);
  // cửa sổ công cụ lắp quanh
  tl.fromTo(tool, {opacity: 0, scale: 1.05}, {opacity: 1, scale: 1, duration: 0.9}, m + 0.35);
  tl.fromTo(tool.querySelector('.bar'), {y: -64}, {y: 0, duration: 0.7}, m + 0.45);
  tl.fromTo(tool.querySelectorAll('.panel'), {y: 260}, {y: 0, duration: 0.8, stagger: 0.08}, m + 0.5);
  tl.fromTo(tool.querySelectorAll('.layer, .sw, .fontrow'), {opacity: 0}, {opacity: 0.35, duration: 0.4, stagger: 0.02}, m + 0.9);
  K.el('div', 'lbl', 'Desktop · 1440 px', document.getElementById('morph'));
  tl.fromTo('#morph .lbl', {opacity: 0}, {opacity: 1, duration: 0.4}, m + 1.1);
  tl.set('#morph', {overflow: 'visible'}, m + 1.1);
  // con trỏ vào chỗ
  const cur = K.cursor(document.getElementById('stage'));
  const cx = (x) => tx + x * ts, cy = (y) => ty + y * ts;
  K.path(tl, cur, [{x: cx(1100), y: cy(1200), t: 0}, {x: cx(1100), y: cy(1200), t: m + 1}, {x: cx(500), y: cy(420), t: m + 2.1}]);
  tl.fromTo(cur, {opacity: 0}, {opacity: 1, duration: 0.3}, m + 1);
</script>
</body></html>
