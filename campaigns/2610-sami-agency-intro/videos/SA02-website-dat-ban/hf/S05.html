<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/600.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/inter/700.css">
<link rel="stylesheet" href="_fonts/fraunces/500-italic.css"><link rel="stylesheet" href="_fonts/fraunces/600.css"><link rel="stylesheet" href="_fonts/fraunces/700.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/700.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S05 · CHỮ KÝ: website lắp ráp từng khối ở tốc độ ×16 (wireframe → lưới → font & màu → ảnh món → di động → nút cố định), rồi phanh gấp về ×1 khi ngón tay chạm „Jetzt reservieren". */
  #stage { background: radial-gradient(90% 60% at 80% 85%, rgba(118,103,254,.35), transparent 70%), radial-gradient(70% 50% at 10% 20%, rgba(8,221,164,.22), transparent 70%), #0C0628; }
  #grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 90px 90px; }
  #head { top: 228px; font-size: 64px; }
  #slow { position: absolute; left: 0; right: 0; top: 215px; text-align: center; z-index: 45; opacity: 0; }
  #slow span { display: inline-flex; align-items: center; gap: 18px; padding: 22px 36px; border-radius: 99px; background: rgba(12,6,40,.82); box-shadow: inset 0 0 0 2px rgba(8,221,164,.7), 0 20px 50px rgba(0,0,0,.4); font-family: "Be Vietnam Pro"; font-weight: 800; font-size: 50px; color: #fff; }
  #cam { position: absolute; inset: 0; }
  #toolwrap { position: absolute; left: 40px; top: 500px; transform-origin: 0 0; }
  .art { position: absolute; background: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .art .lbl { position: absolute; left: 0; top: -30px; font-family: Inter; font-size: 18px; color: var(--ui-dim); white-space: nowrap; }
  .wire { position: absolute; border-radius: 10px; background: #E9E7F2; box-shadow: inset 0 0 0 2px #C9C5DD; }
  .wire.dk { background: #D6D3E6; }
  .wire.tx { background: none; box-shadow: none; display: flex; flex-direction: column; gap: 14%; justify-content: center; }
  .wire.tx i { display: block; height: 22%; border-radius: 6px; background: #C9C5DD; }
  .wire.im { background: #DEDBEC; }
  .wire.im:before, .wire.im:after { content: ""; position: absolute; left: 50%; top: 50%; width: 70%; height: 2px; background: #B9B4D3; transform: translate(-50%,-50%) rotate(35deg); }
  .wire.im:after { transform: translate(-50%,-50%) rotate(-35deg); }
  #cols { position: absolute; inset: 0; display: flex; gap: 16px; padding: 0 44px; box-sizing: border-box; pointer-events: none; z-index: 20; }
  #cols i { flex: 1; background: rgba(240,80,140,.13); box-shadow: inset 1px 0 rgba(240,80,140,.35), inset -1px 0 rgba(240,80,140,.35); transform-origin: 50% 0; }
  .red { position: absolute; background: #FF3D7F; z-index: 25; }
  .red b { position: absolute; padding: 2px 8px; border-radius: 5px; background: #FF3D7F; color: #fff; font: 600 16px "JetBrains Mono"; white-space: nowrap; }
  #pill { position: absolute; left: 20px; top: 714px; z-index: 35; display: flex; flex-direction: column; gap: 10px; }
  #pill .t { display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 22px; border-radius: 99px; background: rgba(12,6,40,.88); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); font-family: "Be Vietnam Pro"; font-weight: 700; font-size: 26px; color: #fff; }
  #pill .t b { font-family: "JetBrains Mono"; color: var(--c-mint); font-size: 22px; }
  #pill .seg { display: flex; gap: 6px; padding-left: 6px; }
  #pill .seg i { width: 44px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
  #pill .stxt { position: relative; height: 1.2em; overflow: hidden; display: inline-block; vertical-align: top; }
  #pill .stxt span { display: block; height: 1.2em; line-height: 1.2em; white-space: nowrap; }
  #speed { position: absolute; inset: 0; pointer-events: none; z-index: 34; }
  #speed i { position: absolute; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35)); }
  #badge { left: 760px; top: 462px; }
  #badge .hand { transform-origin: 22px 22px; }
  .pin { position: absolute; z-index: 36; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: #4FA3FF; color: #fff; font: 600 15px "JetBrains Mono"; white-space: nowrap; opacity: 0; }
  #note { left: 44px; top: 1562px; }
  [data-ratio="16x9"] #head { left: 150px; right: auto; width: 780px; top: 350px; font-size: 66px; }
  [data-ratio="16x9"] #toolwrap { left: 1010px; top: 115px; transform: scale(.8); }
  [data-ratio="16x9"] #badge { left: 1560px; top: 70px; }
  [data-ratio="16x9"] #slow { left: 150px; right: auto; top: 420px; text-align: left; }
  [data-ratio="16x9"] #steps16 { display: flex; }
  [data-ratio="16x9"] #note { left: 1010px; top: 1000px; }
  #steps16 { display: none; position: absolute; left: 150px; top: 690px; width: 760px; flex-wrap: wrap; gap: 12px; z-index: 30; }
</style></head>
<body>
<div id="root" data-composition-id="S05">
<div id="stage" class="clip">
  <div id="grid"></div>
  <div id="fx" class="clip"></div>
  <div id="head" class="hd txtshadow" data-copy="S05_head"></div>
  <div id="steps16"></div>
  <div id="slow"><span data-copy="S05_slow"></span></div>
  <div id="cam"><div id="toolwrap"></div></div>
  <div id="badge" class="badge16"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="currentColor" stroke-width="3"/><path class="hand" id="hm" d="M22 22 L22 9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path class="hand" id="hh" d="M22 22 L31 22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>▶▶</span><span id="spd" style="display:inline-block;min-width:2.3em">×16</span></div>
  <div id="note" class="note" data-copy="note_demo"></div>
</div>
</div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), K = window.K, L = S.landscape;
  const stage = document.getElementById('stage');
  const tool = K.tool(document.getElementById('toolwrap'));
  const world = K.$('#world', tool), canvas = K.$('.canvas', tool);
  K.$$('.layer, .sw, .fontrow', tool).forEach((e) => (e.style.opacity = 0.35));
  const ts = L ? 0.8 : 1, tx = L ? 1010 : 40, ty = L ? 115 : 500;
  const T2S = (x, y) => ({x: tx + ts * x, y: ty + ts * y});            // toạ độ cửa sổ → khung hình
  const W2S = (x, y) => T2S(x, 64 + y);                               // toạ độ canvas → khung hình
  K.dust(tl, document.getElementById('fx'), 30, 61, {color: '#08DDA4', op: 0.3, rise: 140});

  // ── mốc thời gian (giây trong clip) ──
  const STEP = [0.8, 2.6, 4.2, 6.2, 7.8, 9.6], BRAKE = 10.8, STOP = 11.7, PUSH = 11.5, TAP = 12.75;
  const names = (S.text('S05_steps') || '').split('|').map((x) => x.trim());

  // ── artboard desktop + wireframe + website thật ──
  const D = K.el('div', 'art', null, world); Object.assign(D.style, {left: '60px', top: '90px', width: '880px', height: '550px', transformOrigin: '0 0'});
  K.el('div', 'lbl', 'Desktop · 1440 px', D);
  const wires = K.el('div', 'clip', null, D); wires.style.zIndex = 3;
  const site = K.site(D, 'd', 880, 550, 40);
  const rel = (el) => { let x = 0, y = 0, e = el; while (e && e !== site) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return {x, y, w: el.offsetWidth, h: el.offsetHeight}; };
  const order = ['nav', 'hero', 'h1', 'p', 'cta', 'img', 'c1', 'c2', 'c3', 'foot'];
  const blk = {}; K.$$('.blk', site).forEach((b) => (blk[b.dataset.b] = b));
  const wire = {};
  order.forEach((k, i) => {
    const r = rel(blk[k]); const w = K.el('div', 'wire' + (k === 'hero' ? ' dk' : k === 'h1' || k === 'p' ? ' tx' : k === 'img' ? ' im' : ''), k === 'h1' ? '<i></i><i></i><i style="width:70%"></i>' : k === 'p' ? '<i style="height:60%"></i>' : '', wires);
    Object.assign(w.style, {left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px'});
    if (k === 'img') w.style.borderRadius = '50%';
    if (k === 'cta' || k === 'nav') w.style.borderRadius = k === 'cta' ? '99px' : '0';
    wire[k] = w;
  });
  // site thật ẩn, hiện dần ở bước 3–4
  site.style.background = '#fff'; tl.to(site, {backgroundColor: '#F5EFE4', duration: 0.4}, STEP[2] + 0.2);
  K.$$('.blk', site).forEach((b) => (b.style.opacity = 0));
  const foods = K.$$('.himg svg, .ph svg', site); foods.forEach((f) => (f.style.opacity = 0));

  // ── HUD bước ──
  const pill = K.el('div', '', '<div class="t"><b id="pn">01 / 06</b><span class="stxt"><span id="pl">' + names.map((n) => '<span>' + n + '</span>').join('') + '</span></span></div><div class="seg">' + names.map(() => '<i></i>').join('') + '</div>', tool); pill.id = 'pill';
  const segs = K.$$('#pill .seg i', tool);
  tl.fromTo(pill, {opacity: 0, x: -30}, {opacity: 1, x: 0, duration: 0.4}, STEP[0] - 0.3);
  STEP.forEach((t, i) => tl.to(segs[i], {background: '#08DDA4', duration: 0.2}, t));
  const pn = document.getElementById('pn'), pl = document.getElementById('pl'), lh = parseFloat(getComputedStyle(pl.firstElementChild).height) || 31;
  K.tick(tl, (t) => { let i = 0; while (i < 5 && t >= STEP[i + 1]) i++; pn.textContent = String(i + 1).padStart(2, '0') + ' / 06'; const k = K.ramp(t, STEP[i], STEP[i] + 0.25); pl.style.transform = 'translateY(' + (-(i > 0 ? i - 1 + k : 0) * lh) + 'px)'; });
  // 16:9: danh sách bước ở cột trái
  const s16 = document.getElementById('steps16');
  names.forEach((n, i) => { const c = K.el('div', 'step', '<b>0' + (i + 1) + '</b>' + n, s16); tl.to(c, {background: 'rgba(8,221,164,.16)', color: '#fff', boxShadow: 'inset 0 0 0 2px rgba(8,221,164,.8)', duration: 0.2}, STEP[i]); });
  tl.fromTo(s16.children, {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: 0.4, stagger: 0.05}, 0.5);

  // ── huy hiệu ×16 + đồng hồ quay ──
  tl.fromTo('#badge', {opacity: 0, scale: 0.6}, {opacity: 1, scale: 1, duration: 0.45}, 0.45);
  const speedAt = (t) => (t < BRAKE ? 16 : t < STOP ? 16 - 15 * K.ramp(t, BRAKE, STOP) : 1);
  const angle = (t) => { let a = 0; const n = 60; for (let i = 0; i < n; i++) a += speedAt(t * (i + 0.5) / n) * t / n; return a * 120; };
  const spdEl = document.getElementById('spd');
  K.tick(tl, (t) => {
    const a = angle(t); document.getElementById('hm').setAttribute('transform', 'rotate(' + a + ' 22 22)'); document.getElementById('hh').setAttribute('transform', 'rotate(' + a / 12 + ' 22 22)');
    const v = speedAt(t), lab = v > 12 ? 16 : v > 6 ? 8 : v > 3 ? 4 : v > 1.5 ? 2 : 1; spdEl.textContent = '×' + lab;
  });
  tl.to('#badge', {background: 'rgba(255,255,255,.08)', boxShadow: 'inset 0 0 0 2px rgba(255,255,255,.6)', color: '#fff', duration: 0.4}, STOP - 0.2);

  // ── vệt tốc độ trong canvas ──
  const sp = K.el('div', '', null, canvas); sp.id = 'speed';
  const lines = []; for (let i = 0; i < 16; i++) { const l = K.el('i', '', null, sp); const w = 120 + S.rnd(i + 3) * 260; l.style.width = w + 'px'; l.style.top = (20 + S.rnd(i + 40) * 680) + 'px'; lines.push([l, w, S.rnd(i + 70)]); }
  K.tick(tl, (t) => { const v = speedAt(t), fade = K.clamp((BRAKE + 0.6 - t) / 0.6, 0, 1) * K.clamp((t - 0.6) / 0.4, 0, 1); lines.forEach(([l, w, r]) => { l.style.left = (((r * 1300 + t * 2600 * (0.6 + r)) % 1400) - 300) + 'px'; l.style.opacity = fade * (0.4 + r * 0.6); }); });

  // ── BƯỚC 1 · wireframe: khối bay vào lưới (lệch nhẹ, bước 2 mới hít vào cột) ──
  order.forEach((k, i) => {
    const r1 = S.rnd(i * 3 + 1), r2 = S.rnd(i * 3 + 2), at = STEP[0] + 0.1 + i * 0.13;
    const off = k === 'hero' || k === 'nav' || k === 'foot' ? 0 : 1;
    tl.fromTo(wire[k], {opacity: 0, x: (r1 - 0.5) * 900, y: (r2 - 0.5) * 600, rotation: (r1 - 0.5) * 40, scale: 0.6, filter: 'blur(8px)'},
      {opacity: 1, x: off * (r2 - 0.5) * 34, y: off * (r1 - 0.5) * 22, rotation: off * (r1 - 0.5) * 3, scale: 1, filter: 'blur(0px)', duration: 0.42}, at);
  });
  // ── BƯỚC 2 · lưới 12 cột, khối hít vào cột, đo khoảng cách ──
  const cols = K.el('div', '', Array(12).fill('<i></i>').join(''), D); cols.id = 'cols';
  tl.fromTo('#cols i', {scaleY: 0}, {scaleY: 1, duration: 0.35, stagger: 0.03}, STEP[1]);
  tl.to(order.map((k) => wire[k]), {x: 0, y: 0, rotation: 0, duration: 0.3, stagger: 0.04}, STEP[1] + 0.5);
  const rH1 = rel(blk.h1), rImg = rel(blk.img), rC = rel(blk.c1), rHero = rel(blk.hero);
  const red1 = K.el('div', 'red', '<b style="left:50%;top:-30px;transform:translateX(-50%)">48</b>', D); Object.assign(red1.style, {left: rH1.x + rH1.w + 'px', top: rH1.y + rH1.h / 2 + 'px', width: rImg.x - rH1.x - rH1.w + 'px', height: '2px'});
  const red2 = K.el('div', 'red', '<b style="left:10px;top:50%;transform:translateY(-50%)">24</b>', D); Object.assign(red2.style, {left: rC.x + 60 + 'px', top: rHero.y + rHero.h + 'px', width: '2px', height: rC.y - rHero.y - rHero.h + 'px'});
  tl.fromTo([red1, red2], {opacity: 0, scale: 0.4}, {opacity: 1, scale: 1, duration: 0.25, stagger: 0.15}, STEP[1] + 0.8);
  const sel = K.el('div', 'sel', '<i></i><i></i><i></i><i></i><b>B 380 · H 190</b>', D); Object.assign(sel.style, {left: rH1.x - 6 + 'px', top: rH1.y - 6 + 'px', width: rH1.w + 12 + 'px', height: rH1.h + 12 + 'px'});
  tl.fromTo(sel, {opacity: 0}, {opacity: 1, duration: 0.15}, STEP[1] + 1.0);
  tl.to(sel, {opacity: 0, duration: 0.2}, STEP[2] + 1.2);
  tl.to(['#cols', red1, red2], {opacity: 0, duration: 0.35}, STEP[2] + 0.2);
  // ── BƯỚC 3 · font & màu: swatches, font, khối đổ màu, chữ hero hiện ──
  K.$$('.sw', tool).forEach((sw, i) => { tl.to(sw, {opacity: 1, duration: 0.15}, STEP[2] + 0.1 + i * 0.12); });
  tl.set('#sw0', {className: 'sw on'}, STEP[2] + 0.2); tl.set('#sw0', {className: 'sw'}, STEP[2] + 0.75); tl.set('#sw1', {className: 'sw on'}, STEP[2] + 0.75);
  tl.to(['#fr0', '#fr1'], {opacity: 1, duration: 0.15}, STEP[2] + 0.3);
  tl.set('#fr0', {className: 'fontrow on'}, STEP[2] + 0.5); tl.set('#fr0', {className: 'fontrow'}, STEP[2] + 1.1); tl.set('#fr1', {className: 'fontrow on'}, STEP[2] + 1.1); tl.set('#fr1', {className: 'fontrow'}, STEP[3]);
  tl.set('#sw1', {className: 'sw'}, STEP[3]);
  const reveal = (k, at, dur) => { tl.fromTo(blk[k], {opacity: 1, clipPath: 'inset(0 100% 0 0)'}, {opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: dur || 0.4, ease: S.EASE}, at); tl.to(wire[k], {opacity: 0, duration: 0.2}, at + 0.2); };
  reveal('hero', STEP[2] + 0.3, 0.45); reveal('nav', STEP[2] + 0.45); reveal('h1', STEP[2] + 0.7, 0.55); reveal('p', STEP[2] + 1.0); reveal('cta', STEP[2] + 1.15, 0.3);
  ['c1', 'c2', 'c3'].forEach((k, i) => reveal(k, STEP[2] + 1.3 + i * 0.1, 0.35)); reveal('foot', STEP[2] + 1.6, 0.3);
  // ── BƯỚC 4 · ảnh món hiện hình ──
  tl.set(blk.img, {opacity: 1}, STEP[3]); tl.to(wire.img, {opacity: 0, duration: 0.2}, STEP[3]);
  foods.forEach((f, i) => tl.fromTo(f, {opacity: 0, scale: 0.4, rotation: -40, filter: 'blur(10px) brightness(2)'}, {opacity: 1, scale: 1, rotation: 0, filter: 'blur(0px) brightness(1)', duration: 0.5}, STEP[3] + 0.15 + i * 0.22));
  [3].forEach((i) => tl.to('#ly' + i, {opacity: 1, duration: 0.1}, STEP[3]));
  // ── BƯỚC 5 · bản di động ──
  tl.to(D, {x: -30, y: 90, scale: 0.6, duration: 0.6}, STEP[4]);
  const M = K.el('div', 'art', null, world); Object.assign(M.style, {left: '620px', top: '44px', width: '310px', height: '660px'});
  K.el('div', 'lbl', 'Mobil · 390 px', M);
  const ms = K.site(M, 'm', 310, 660, 24);
  const mb = K.$$('.blk', ms).filter((b) => b.dataset.b !== 'sticky');
  const sticky = K.$('.sticky', ms);
  tl.fromTo(M, {opacity: 0, x: 200, scale: 0.9}, {opacity: 1, x: 0, scale: 1, duration: 0.55}, STEP[4] + 0.2);
  tl.fromTo(mb, {opacity: 0, x: -60, filter: 'blur(6px)'}, {opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.3, stagger: 0.07}, STEP[4] + 0.45);
  tl.set(sticky, {opacity: 0}, 0);
  // ── BƯỚC 6 · nút „Jetzt reservieren" cố định ──
  tl.fromTo(sticky, {opacity: 0, y: -420, scale: 1.1}, {opacity: 1, y: 0, scale: 1, duration: 0.55}, STEP[5] + 0.15);
  const pin = K.el('div', 'pin', '<svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M9 3 H15 L14 9 L18 13 H6 L10 9 Z M12 13 V21" fill="#fff" stroke="#fff" stroke-width="1.5"/></svg>position: fixed', world);
  Object.assign(pin.style, {left: '640px', top: '600px'});
  tl.fromTo(pin, {opacity: 0, y: 10}, {opacity: 1, y: 0, duration: 0.25}, STEP[5] + 0.7);
  tl.to(pin, {opacity: 0, duration: 0.3}, PUSH);
  tl.set(['#ly4', '#ly5'], {display: 'flex'}, STEP[4]); tl.to('#lyin', {y: -84, duration: 0.3}, STEP[4]);
  K.$$('#layers .layer', tool).forEach((r, i) => { const at = [STEP[0], STEP[0] + 0.4, STEP[2] + 0.7, STEP[3], STEP[4], STEP[5]][i]; tl.set(r, {className: 'layer on', opacity: 1}, at); tl.set(r, {className: 'layer'}, at + 0.5); });

  // ── con trỏ + bóng mờ tốc độ ──
  const P = [
    {t: 0, ...T2S(500, 420)}, {t: STEP[0], ...T2S(150, 32), c: 1}, {t: 1.25, ...W2S(140, 130)}, {t: 1.6, ...W2S(480, 300)}, {t: 1.95, ...W2S(250, 560)}, {t: 2.3, ...W2S(720, 300)},
    {t: STEP[1], ...T2S(246, 32), c: 1}, {t: 3.1, ...W2S(104, 420)}, {t: 3.5, ...W2S(890, 420)}, {t: 3.9, ...W2S(400, 250), c: 1},
    {t: STEP[2] + 0.15, ...T2S(476, 879), c: 1}, {t: 4.65, ...T2S(538, 879), c: 1}, {t: 5.0, ...T2S(560, 990), c: 1}, {t: 5.4, ...W2S(330, 220)}, {t: 5.9, ...W2S(600, 520)},
    {t: STEP[3], ...T2S(294, 32), c: 1}, {t: 6.6, ...W2S(760, 250), c: 1}, {t: 7.0, ...W2S(200, 560), c: 1}, {t: 7.4, ...W2S(460, 560), c: 1},
    {t: STEP[4], ...T2S(820, 32)}, {t: 8.4, ...W2S(760, 200), c: 1}, {t: 9.0, ...W2S(780, 480)},
    {t: STEP[5], ...W2S(780, 120), c: 1}, {t: 10.1, ...W2S(780, 640), c: 1}, {t: 10.7, ...W2S(900, 700)}, {t: PUSH, ...W2S(990, 760)}
  ];
  const pos = (t) => { let i = 0; while (i < P.length - 1 && P[i + 1].t <= t) i++; if (i >= P.length - 1) return P[P.length - 1]; const a = P[i], b = P[i + 1], k = S.EASE(K.clamp((t - a.t) / (b.t - a.t), 0, 1)); return {x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k}; };
  const ghosts = [3, 2, 1].map((k) => [K.cursor(stage, 'ghost'), k]); const cur = K.cursor(stage);
  K.tick(tl, (t) => {
    const p = pos(t); cur.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    const g = K.clamp((BRAKE - t) / 0.5, 0, 1) * K.clamp((t - 0.6) / 0.3, 0, 1);
    ghosts.forEach(([el, k]) => { const q = pos(Math.max(0, t - 0.03 * k)); el.style.transform = 'translate(' + q.x + 'px,' + q.y + 'px)'; el.style.opacity = g * (0.32 - k * 0.07); });
  });
  tl.to(cur, {opacity: 0, duration: 0.3}, PUSH - 0.2);
  P.filter((p) => p.c).forEach((p) => K.ring(tl, stage, p.x + 4, p.y + 4, p.t, '#08DDA4'));

  // ── PHANH: tape-stop, camera đẩy vào bản di động, ngón tay chạm nút ──
  tl.to('#stage', {filter: 'saturate(.6) brightness(.85)', duration: 0.25, ease: 'none'}, BRAKE);
  tl.to('#stage', {filter: 'saturate(1) brightness(1)', duration: 0.6}, STOP);
  const target = W2S(620 + 155, 44 + 660 - 0.03 * 660 - 0.04 * 660);   // tâm nút sticky
  const push = 1.45;
  tl.set('#cam', {transformOrigin: target.x + 'px ' + target.y + 'px'}, 0);
  tl.to('#cam', {scale: push, duration: 1.1}, PUSH);
  tl.to(['#head', '#steps16', '#note'], {opacity: 0, filter: 'blur(8px)', duration: 0.4}, PUSH - 0.1);
  tl.to(K.$$('.panel', tool), {opacity: 0.25, duration: 0.5}, PUSH);
  tl.fromTo('#slow', {opacity: 0, y: 30}, {opacity: 1, y: 0, duration: 0.5}, STOP);
  tl.to('#badge', {opacity: 0, duration: 0.4}, STOP + 0.6);
  const touch = K.el('i', 'touch', null, stage); Object.assign(touch.style, {left: target.x + 'px', top: target.y + 'px'});
  tl.fromTo(touch, {opacity: 0, scale: 1.6}, {opacity: 1, scale: 1, duration: 0.35}, TAP - 0.4);
  tl.to(touch, {scale: 0.8, duration: 0.12}, TAP);
  tl.to(sticky, {scale: 0.94, background: '#2E5240', duration: 0.12}, TAP);
  tl.to(sticky, {scale: 1, duration: 0.25}, TAP + 0.15);
  K.ring(tl, stage, target.x, target.y, TAP, '#E8A5A0'); K.ring(tl, stage, target.x, target.y, TAP + 0.15, '#fff');
  tl.to(touch, {opacity: 0, duration: 0.3}, TAP + 0.35);
  K.say(tl, '#head', 0.35, {stagger: 0.05});
</script>
