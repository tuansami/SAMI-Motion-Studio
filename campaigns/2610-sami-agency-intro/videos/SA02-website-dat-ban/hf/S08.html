<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/700.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/fraunces/500-italic.css"><link rel="stylesheet" href="_fonts/fraunces/600.css"><link rel="stylesheet" href="_fonts/fraunces/700.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S08 · 3 lợi ích, icon nét vẽ; bản di động Bếp Sen trôi mờ phía sau (parallax). */
  #stage { background: radial-gradient(90% 60% at 85% 80%, rgba(118,103,254,.38), transparent 70%), radial-gradient(70% 50% at 5% 10%, rgba(8,221,164,.22), transparent 70%), #0C0628; }
  #back { position: absolute; left: 560px; top: 520px; transform: rotate(-9deg); opacity: .18; filter: blur(3px); border-radius: 40px; overflow: hidden; }
  #title { top: 236px; font-size: 80px; }
  #cards { position: absolute; left: 72px; right: 72px; top: 560px; display: flex; flex-direction: column; gap: 34px; z-index: 20; }
  .bc { position: relative; display: flex; align-items: center; gap: 40px; padding: 40px 44px; border-radius: 36px; background: rgba(26,23,48,.78); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12), 0 30px 70px rgba(0,0,0,.35); backdrop-filter: blur(10px); }
  .bc .ic { width: 150px; height: 150px; flex: none; border-radius: 34px; background: rgba(8,221,164,.1); box-shadow: inset 0 0 0 2px rgba(8,221,164,.35); display: flex; align-items: center; justify-content: center; }
  .bc svg { width: 104px; height: 104px; overflow: visible; }
  .bc svg .s { fill: none; stroke: var(--c-mint); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .bc svg text { fill: var(--c-mint); font-family: "JetBrains Mono"; font-weight: 600; }
  .bc p { margin: 0; font-family: "Be Vietnam Pro"; font-weight: 700; font-size: 50px; line-height: 1.24; color: #fff; text-wrap: balance; }
  .bc .n { position: absolute; right: 30px; top: 22px; font-family: "JetBrains Mono"; font-weight: 600; font-size: 24px; color: rgba(255,255,255,.3); }
  [data-ratio="16x9"] #title { left: 150px; right: auto; width: 1400px; top: 170px; font-size: 84px; }
  [data-ratio="16x9"] #cards { left: 150px; right: 150px; top: 440px; flex-direction: row; gap: 36px; }
  [data-ratio="16x9"] .bc { flex: 1; flex-direction: column; align-items: flex-start; padding: 50px 44px 56px; gap: 40px; }
  [data-ratio="16x9"] .bc p { font-size: 46px; }
  [data-ratio="16x9"] #back { left: 1250px; top: 80px; }
</style></head>
<body>
<div id="root" data-composition-id="S08">
<div id="stage" class="clip">
  <div id="back"></div>
  <div id="fx" class="clip"></div>
  <div id="title" class="hd txtshadow" data-copy="S08_title"></div>
  <div id="cards">
    <div class="bc"><span class="ic"><svg viewBox="0 0 100 100"><path class="s" d="M58 14 A34 34 0 1 0 88 62 A28 28 0 0 1 58 14 Z"/><circle class="s" cx="66" cy="66" r="20"/><path class="s" d="M66 54 V66 L74 72"/></svg></span><p data-copy="S08_b1"></p><span class="n">01</span></div>
    <div class="bc"><span class="ic"><svg viewBox="0 0 100 100"><path class="s" d="M28 14 L40 30 L33 40 C38 52 48 62 60 67 L70 60 L86 72 L79 86 C48 88 12 52 14 21 Z"/><path class="s" d="M62 16 L84 38 M84 16 L62 38"/><path class="s" d="M10 92 L92 10" style="stroke:#FF8A8F;opacity:.0"/></svg></span><p data-copy="S08_b2"></p><span class="n">02</span></div>
    <div class="bc"><span class="ic"><svg viewBox="0 0 100 100"><path class="s" d="M24 10 H66 L80 24 V90 H24 Z"/><path class="s" d="M66 10 V24 H80"/><path class="s" d="M34 40 H62 M34 52 H70 M34 64 H56"/><circle class="s" cx="72" cy="76" r="14"/><text x="72" y="81.5" text-anchor="middle" font-size="15">A</text></svg></span><p data-copy="S08_b3"></p><span class="n">03</span></div>
  </div>
</div>
</div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), K = window.K;
  K.site(document.getElementById('back'), 'm', 600, 1290, 46);
  tl.fromTo('#back', {y: 120}, {y: -160, duration: S.dur, ease: 'none'}, 0);
  K.dust(tl, document.getElementById('fx'), 30, 91, {color: '#08DDA4', op: 0.3, rise: 140});
  K.say(tl, '#title', S.beat(0.3), {stagger: 0.07});
  K.$$('.bc').forEach((c, i) => {
    const at = S.beat(1.6 + i * 4);
    S.arrive(tl, c, at, {dist: 70, dur: 0.7});
    tl.fromTo(c.querySelector('.ic'), {scale: 0.6, rotation: -14}, {scale: 1, rotation: 0, duration: 0.7}, at);
    c.querySelectorAll('.s').forEach((el) => { const L = el.getTotalLength(); el.style.strokeDasharray = L; el.style.strokeDashoffset = L; tl.to(el, {strokeDashoffset: 0, duration: 0.9}, at + 0.15); });
    if (c.querySelector('text')) tl.fromTo(c.querySelector('text'), {opacity: 0}, {opacity: 1, duration: 0.3}, at + 0.8);
    tl.fromTo(c.querySelector('.n'), {opacity: 0}, {opacity: 1, duration: 0.4}, at + 0.4);
  });
</script>
</body></html>
