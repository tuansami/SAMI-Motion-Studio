<!doctype html>
<html><head>
<link rel="stylesheet" href="_fonts/be-vietnam-pro/500.css"><link rel="stylesheet" href="_fonts/be-vietnam-pro/800.css">
<link rel="stylesheet" href="_fonts/inter/500.css"><link rel="stylesheet" href="_fonts/inter/600.css"><link rel="stylesheet" href="_fonts/inter/700.css">
<link rel="stylesheet" href="_fonts/fraunces/600.css"><link rel="stylesheet" href="_fonts/jetbrains-mono/600.css">
<link rel="stylesheet" href="hf/parts/kit.css">
<style>
  /* S03 · Cái giá: khách vuốt sang quán khác, đặt bàn trong vài chạm; bàn bốn người của bạn tắt dần. */
  #stage { background: radial-gradient(120% 70% at 50% 70%, #131833 0%, #05060F 70%); }
  #head { top: 250px; }
  #sub { top: 480px; }
  #ph { left: 50px; top: 640px; transform: scale(.78); transform-origin: 0 0; }
  .scr { background: #FBF7F2 !important; }
  .comp { position: absolute; inset: 0; font-family: Inter; color: #2A1E16; }
  .comp .nav { position: absolute; left: 0; right: 0; top: 110px; height: 90px; display: flex; align-items: center; justify-content: space-between; padding: 0 44px; }
  .comp .nav b { font-family: Fraunces; font-weight: 600; font-size: 40px; }
  .comp .nav i { width: 40px; height: 26px; background: linear-gradient(#2A1E16 0 16%, transparent 16% 42%, #2A1E16 42% 58%, transparent 58% 84%, #2A1E16 84%); }
  .comp .pic { position: absolute; left: 30px; right: 30px; top: 210px; height: 360px; border-radius: 30px; background: radial-gradient(80% 90% at 30% 30%, #E9A06A, #9A4A2A 70%, #5A2614); }
  .comp .pic:after { content: ""; position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFF 0 30%, #EEE3D3 31% 60%, #D4C2A8 61%); box-shadow: 0 30px 60px rgba(0,0,0,.35); }
  .comp h2 { position: absolute; left: 44px; right: 44px; top: 610px; margin: 0; font-family: Fraunces; font-weight: 600; font-size: 50px; line-height: 1.1; }
  .comp .bk { position: absolute; left: 30px; right: 30px; top: 760px; padding: 30px; border-radius: 30px; background: #fff; box-shadow: 0 10px 40px rgba(60,30,10,.12); }
  .comp .row { display: flex; gap: 12px; margin-bottom: 18px; }
  .comp .chip { flex: 1; height: 70px; border-radius: 18px; background: #F3ECE4; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 26px; }
  .comp .chip.on { background: #B5532F; color: #fff; }
  .comp .go { height: 90px; border-radius: 99px; background: #B5532F; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 32px; }
  .ok { position: absolute; inset: 0; background: #FBF7F2; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Inter; color: #2A1E16; opacity: 0; }
  .ok .c { width: 200px; height: 200px; border-radius: 50%; background: #2F9E62; display: flex; align-items: center; justify-content: center; }
  .ok b { font-size: 50px; margin-top: 50px; } .ok span { font-size: 32px; color: #7A6555; margin-top: 16px; }
  #timer { position: absolute; left: 340px; top: 580px; padding: 14px 26px; border-radius: 99px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); font-family: "JetBrains Mono"; font-weight: 600; font-size: 34px; color: #fff; z-index: 30; opacity: 0; }
  #tablewrap { position: absolute; left: 575px; top: 820px; transform: scale(1.0); width: 460px; height: 620px; }
  #pool { position: absolute; left: -80px; top: 0; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(255,184,107,.42) 0%, rgba(255,184,107,0) 65%); }
  #table { position: absolute; left: 0; top: 80px; width: 460px; height: 460px; }
  #tag { position: absolute; left: 50%; top: 560px; transform: translateX(-50%); white-space: nowrap; padding: 16px 28px; border-radius: 18px; background: #F5EFE4; color: #1F3B2D; font-family: Inter; font-weight: 700; font-size: 30px; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  #tag small { display: block; font-weight: 500; font-size: 22px; color: #7A6B55; }
  #lost { position: absolute; left: 50%; top: 560px; transform: translateX(-50%); white-space: nowrap; font-family: "Be Vietnam Pro"; font-weight: 800; font-size: 44px; color: var(--red); opacity: 0; }
  [data-ratio="16x9"] #head { left: 150px; right: auto; width: 760px; top: 250px; font-size: 72px; }
  [data-ratio="16x9"] #sub { left: 150px; right: auto; width: 700px; top: 560px; }
  [data-ratio="16x9"] #ph { left: 960px; top: 70px; transform: scale(.75); }
  [data-ratio="16x9"] #timer { left: 1110px; top: 30px; }
  [data-ratio="16x9"] #tablewrap { left: 1440px; top: 230px; }
</style></head>
<body>
<div id="root" data-composition-id="S03">
<div id="stage" class="clip">
  <div id="fx" class="clip"></div>
  <div id="head" class="hd txtshadow" data-copy="S03_head"></div>
  <div id="sub" class="sub" data-copy="S03_sub"></div>
  <div id="timer">+10 s</div>
  <div id="ph" class="phone"><div class="island"></div><div class="scr">
    <div class="sbar dark"><span>23:41</span><span class="ic"><b></b><i></i></span></div>
    <div class="comp" id="comp"><div class="nav"><b>Lokal Nebenan</b><i></i></div><div class="pic"></div><h2>Tisch reservieren</h2>
      <div class="bk"><div class="row"><span class="chip">Fr 23</span><span class="chip on" id="c1">Sa 24</span><span class="chip">So 25</span></div>
        <div class="row"><span class="chip">19:00</span><span class="chip on" id="c2">19:30</span><span class="chip on" id="c3">4 Pers.</span></div><div class="go" id="go">Jetzt reservieren</div></div></div>
    <div class="ok" id="ok"><div class="c"><svg viewBox="0 0 24 24" style="width:110px;height:110px"><path id="chk" d="M5 12.5 L10 17.5 L19 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><b>Reserviert!</b><span>Sa, 24.10. · 19:30 · 4 Personen</span><span style="font-weight:600;color:#B5532F">Lokal Nebenan</span></div>
    <i class="touch" id="t1" style="left:270px;top:830px"></i><i class="touch" id="t2" style="left:270px;top:1000px"></i>
  </div></div>
  <div id="tablewrap">
    <div id="pool"></div>
    <svg id="table" viewBox="0 0 460 460">
      <defs><radialGradient id="wood" cx=".4" cy=".35"><stop offset="0" stop-color="#8A5A36"/><stop offset="1" stop-color="#4E2F1A"/></radialGradient></defs>
      <g class="ch" fill="#2B3256" stroke="#5A659C" stroke-width="3"><rect x="180" y="6" width="100" height="70" rx="20"/></g>
      <g class="ch" fill="#2B3256" stroke="#5A659C" stroke-width="3"><rect x="384" y="180" width="70" height="100" rx="20"/></g>
      <g class="ch" fill="#2B3256" stroke="#5A659C" stroke-width="3"><rect x="180" y="384" width="100" height="70" rx="20"/></g>
      <g class="ch" fill="#2B3256" stroke="#5A659C" stroke-width="3"><rect x="6" y="180" width="70" height="100" rx="20"/></g>
      <circle cx="230" cy="230" r="150" fill="url(#wood)"/>
      <g fill="#F5EFE4" opacity=".92"><circle cx="230" cy="125" r="34"/><circle cx="335" cy="230" r="34"/><circle cx="230" cy="335" r="34"/><circle cx="125" cy="230" r="34"/></g>
      <g fill="none" stroke="#C9C2B4" stroke-width="3"><circle cx="230" cy="125" r="22"/><circle cx="335" cy="230" r="22"/><circle cx="230" cy="335" r="22"/><circle cx="125" cy="230" r="22"/></g>
      <rect x="205" y="205" width="50" height="50" rx="8" fill="#E8A5A0"/>
    </svg>
    <div id="tag">Tisch 4 · Sa 19:30<small>4 Personen · frei</small></div>
    <div id="lost">−1 bàn · −4 khách</div>
  </div>
</div>
</div>
<script src="hf/parts/kit.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), K = window.K;
  K.dust(tl, document.getElementById('fx'), 22, 31, {color: '#8FA7FF', op: 0.22, rise: 80});
  const ps = S.landscape ? 0.75 : 0.78;
  tl.fromTo('#ph', {opacity: 0, x: 80, scale: ps * 0.94}, {opacity: 1, x: 0, scale: ps, duration: 0.7}, 0);
  tl.fromTo('#comp', {xPercent: 100}, {xPercent: 0, duration: 0.6}, S.beat(0.3));
  K.say(tl, '#head', S.beat(0.3), {stagger: 0.06});
  tl.fromTo('#timer', {opacity: 0, scale: 0.6}, {opacity: 1, scale: 1, duration: 0.4}, S.beat(0.6));
  // chạm nhanh: chip đã chọn sẵn → nút → xong
  ['#c1', '#c2', '#c3'].forEach((c, i) => tl.fromTo(c, {scale: 0.85, opacity: 0.4}, {scale: 1, opacity: 1, duration: 0.25}, S.beat(1.2 + i * 0.4)));
  tl.fromTo('#t1', {opacity: 0}, {opacity: 1, duration: 0.12, yoyo: true, repeat: 1}, S.beat(1.2));
  tl.fromTo('#t2', {opacity: 0}, {opacity: 1, duration: 0.12, yoyo: true, repeat: 1}, S.beat(2.8));
  tl.to('#go', {scale: 0.95, duration: 0.1, yoyo: true, repeat: 1}, S.beat(2.8));
  tl.to('#ok', {opacity: 1, duration: 0.3}, S.beat(3.2));
  const chk = document.getElementById('chk'), L = chk.getTotalLength(); chk.style.strokeDasharray = L; chk.style.strokeDashoffset = L;
  tl.to(chk, {strokeDashoffset: 0, duration: 0.5}, S.beat(3.5));
  tl.fromTo('#ok .c', {scale: 0.5}, {scale: 1, duration: 0.5}, S.beat(3.2));
  // bàn của bạn: đang chờ khách → tắt dần
  tl.fromTo('#tablewrap', {opacity: 0, y: 60}, {opacity: 1, y: 0, duration: 0.8}, S.beat(1));
  K.say(tl, '#sub', S.beat(4.6), {stagger: 0.05});
  tl.to('#ph', {opacity: 0.35, filter: 'blur(3px)', duration: 0.8}, S.beat(5));
  tl.to('#timer', {opacity: 0, duration: 0.4}, S.beat(5));
  tl.to('#pool', {opacity: 0.08, duration: 2.2, ease: 'none'}, S.beat(5.4));
  K.$$('.ch').forEach((c, i) => tl.to(c, {opacity: 0.15, duration: 0.6}, S.beat(5.6 + i * 0.6)));
  tl.to('#table', {filter: 'saturate(.2) brightness(.6)', duration: 2}, S.beat(5.6));
  tl.to('#tag', {opacity: 0, y: -40, duration: 0.6}, S.beat(8.6));
  tl.fromTo('#lost', {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: 0.6}, S.beat(9));
</script>
</body></html>
