<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/nunito/900.css">
<link rel="stylesheet" href="_fonts/space-grotesk/500.css">
<link rel="stylesheet" href="_fonts/space-grotesk/700.css">
<link rel="stylesheet" href="hf/parts/pg.css">
<style>
  /* S07 · 01 lịch nội dung: con trỏ thả ô ảnh món / video / story / đồ hoạ vào lịch 4 tuần, tua nhanh ×16 */
  #tag { left: 72px; top: 236px; }
  #hd { top: 330px; text-align: left; }
  [data-ratio="9x16"] #hd { font-size: 70px; }
  #cal { position: absolute; z-index: 4; left: 60px; top: 760px; width: 960px; height: 580px; background: #fff; border-radius: 34px; color: var(--navy); box-shadow: 0 24px 0 rgba(12, 6, 40, .2); }
  #cal .bar { position: absolute; left: 30px; right: 30px; top: 22px; height: 56px; display: flex; align-items: center; gap: 14px; font: 700 30px/1 var(--f-ui); }
  #cal .bar .dt { width: 18px; height: 18px; border-radius: 50%; background: var(--coral); }
  #cal .bar .dt:nth-child(2) { background: var(--amber); } #cal .bar .dt:nth-child(3) { background: var(--mint); }
  #grid { position: absolute; left: 30px; right: 30px; top: 96px; bottom: 26px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 46px repeat(4, 1fr); gap: 10px; }
  .dh { font: 700 26px/46px var(--f-ui); text-align: center; color: #6E6893; }
  .cell { position: relative; border-radius: 16px; background: #F0EFFA; display: flex; align-items: center; justify-content: center; }
  .cell.rt { background: repeating-linear-gradient(-45deg, #F0EFFA 0 10px, #E4E2F4 10px 20px); }
  .cell .ic { width: 60%; height: 60%; }
  .cell .rtl { position: absolute; left: 0; right: 0; bottom: 6px; font: 500 15px/1 var(--f-ui); color: #8D87B8; text-align: center; }
  #ff { position: absolute; z-index: 6; display: flex; align-items: center; gap: 12px; padding: 12px 22px 12px 14px; border-radius: 999px; background: var(--navy); color: var(--mint); font: 700 34px/1 var(--f-ui); }
  #clock { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--mint); position: relative; }
  #clock i { position: absolute; left: 50%; top: 50%; width: 5px; height: 17px; margin-left: -2.5px; background: var(--mint); border-radius: 3px; transform-origin: 50% 0; }
  #cur { position: absolute; z-index: 8; width: 64px; height: 64px; }
  #steps { position: absolute; z-index: 5; left: 60px; right: 60px; top: 1390px; display: flex; gap: 12px; }
  .st { flex: 1; text-align: center; font: 700 25px/1.2 var(--f-ui); color: #fff; padding: 16px 8px; border-radius: 18px; border: 3px solid rgba(255, 255, 255, .5); }
  .st.on { background: var(--navy); border-color: var(--navy); color: var(--mint); }
  #wipe { width: 200px; height: 200px; border-radius: 50%; background: var(--navy); }
  [data-ratio="16x9"] #tag { left: 120px; top: 260px; }
  [data-ratio="16x9"] #hd { left: 120px; width: 760px; top: 350px; font-size: 76px; }
  [data-ratio="16x9"] #cal { left: 940px; top: 120px; width: 880px; height: 640px; }
  [data-ratio="16x9"] #steps { left: 940px; right: 100px; top: 820px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S07" class="bg-purple">
  <div class="dots" id="dots"></div>
  <div class="tag" id="tag"></div>
  <div class="hd" id="hd" data-copy="S07_headline"></div>
  <div id="cal"><div class="bar"><span class="dt"></span><span class="dt"></span><span class="dt"></span><span style="margin-left:10px">Content-Plan</span></div><div id="grid"></div></div>
  <div id="ff"><div id="clock"><i id="h1"></i><i id="h2" style="height:12px"></i></div><span>×16</span></div>
  <div id="steps"></div>
  <svg id="cur" viewBox="0 0 100 100"><path d="M18 6 L18 78 L36 62 L50 94 L64 88 L50 56 L76 56Z" fill="#0C0628" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></svg>
  <div class="wipe" id="wipe"></div>
</div>
<script src="hf/parts/pg.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), $ = PG.$;
  const tg = S.text('S07_tag').split(' · '); $('#tag').innerHTML = '<b>' + tg[0] + '</b>' + (tg[1] || '');
  const g = $('#grid');
  ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].forEach((d) => g.insertAdjacentHTML('beforeend', `<div class="dh">${d}</div>`));
  // mẫu lịch: 0 = trống; thứ Hai = Ruhetag (vẫn có story hẹn giờ)
  const ICON = {c: ['camera', '#FF6B6B'], v: ['play', '#7667FE'], s: ['story', '#08DDA4'], g: ['graphic', '#F59E0B']};
  const PAT = ['s c 0 v g c s', '0 v c 0 s g c', 's 0 g c v c 0', '0 c v s 0 v g'].map((r) => r.split(' '));
  const order = [];
  PAT.forEach((row, r) => row.forEach((k, c) => { const d = document.createElement('div'); d.className = 'cell' + (c === 0 ? ' rt' : '');
    d.innerHTML = (k !== '0' ? `<div class="ic">${PG.icon(ICON[k][0], ICON[k][1], '', '#fff')}</div>` : '') + (c === 0 ? '<div class="rtl">Ruhetag</div>' : ''); g.appendChild(d); if (k !== '0') order.push(d); }));
  $('#steps').innerHTML = S.text('S07_steps').split('|').map((s) => `<div class="st">${s}</div>`).join('');
  const sts = PG.$$('.st'), cur = $('#cur');
  const icons = order.map((d) => d.querySelector('.ic'));
  const A = 1.2, B = 6.2, n = order.length, at = (i) => A + (B - A) * i / n;
  const cal = $('#cal');
  const pos = (d) => [cal.offsetLeft + g.offsetLeft + d.offsetLeft + d.offsetWidth * 0.55, cal.offsetTop + g.offsetTop + d.offsetTop + d.offsetHeight * 0.55];
  const P = order.map(pos);
  const ff = $('#ff'); ff.style.left = (cal.offsetLeft + cal.clientWidth - 220) + 'px'; ff.style.top = (cal.offsetTop - 34) + 'px';
  PG.clock(tl, (t) => {
    PG.drift($('#dots'), t);
    // con trỏ nhảy từ ô này sang ô khác, ô bật biểu tượng khi con trỏ tới
    let i = Math.min(n - 1, Math.max(0, Math.floor((t - A) / (B - A) * n)));
    const a = at(i), k = PG.E(t, a - (B - A) / n * 0.0, a + (B - A) / n * 0.7);
    const p0 = i > 0 ? P[i - 1] : [P[0][0] + 200, P[0][1] + 300], p1 = P[i];
    const cx = PG.mix(p0[0], p1[0], k), cy = PG.mix(p0[1], p1[1], k);
    cur.style.left = (cx - 10) + 'px'; cur.style.top = (cy - 6) + 'px'; cur.style.opacity = PG.L(t, A - 0.4, A - 0.1) * (1 - PG.L(t, B + 0.4, B + 0.7));
    icons.forEach((ic, j) => { const kk = PG.E(t, at(j) + 0.12, at(j) + 0.42); ic.style.transform = 'scale(' + (kk * (1 + 0.25 * Math.sin(Math.PI * kk))).toFixed(3) + ')'; ic.style.opacity = kk > 0 ? 1 : 0; });
    // đồng hồ tua nhanh
    $('#h1').style.transform = 'rotate(' + (180 + t * 1440).toFixed(1) + 'deg)'; $('#h2').style.transform = 'rotate(' + (180 + t * 120).toFixed(1) + 'deg)';
    // bước sáng lần lượt
    sts.forEach((s, j) => s.classList.toggle('on', t > A + j * (B - A) / 4));
    const wp = $('#wipe'); wp.style.left = (S.w / 2) + 'px'; wp.style.top = (S.h / 2) + 'px';
    PG.wipe(wp, t, PG.OUT - 0.6, PG.OUT - 0.15, 14);
  });
  S.arrive(tl, '#tag', 0.3, {dist: 20, blur: 4});
  PG.head(tl, $('#hd'), 0.5, {stagger: 0.06});
  S.arrive(tl, '#cal', 0.2, {dist: 60, blur: 0, dur: 0.6});
  S.arrive(tl, '#ff', 0.9, {dist: 20, blur: 4});
  S.arrive(tl, '#steps', 1.0, {dist: 20, blur: 4});
</script>
</body>
</html>
