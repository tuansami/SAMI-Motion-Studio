<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/nunito/900.css">
<link rel="stylesheet" href="hf/parts/pg.css">
<style>
  /* S12 · nhịp thở: một chiếc ghế đã kéo sẵn, một trái tim đặt trên ghế; tĩnh, chỉ nền trôi */
  #hd { top: 420px; text-align: center; font-size: 80px; }
  #chair { position: absolute; z-index: 4; left: 390px; top: 1000px; width: 300px; height: 300px; }
  #heart { position: absolute; z-index: 5; width: 110px; height: 110px; }
  #shadow { position: absolute; z-index: 3; left: 340px; top: 1290px; width: 400px; height: 30px; border-radius: 50%; background: rgba(12, 6, 40, .25); }
  #wipe { width: 200px; height: 200px; border-radius: 50%; background: var(--navy); }
  [data-ratio="16x9"] #hd { left: 120px; width: 960px; top: 330px; text-align: left; font-size: 104px; }
  [data-ratio="16x9"] #chair { left: 1300px; top: 380px; width: 340px; height: 340px; }
  [data-ratio="16x9"] #shadow { left: 1270px; top: 710px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S12" class="bg-purple">
  <div class="dots" id="dots"></div>
  <div class="hd" id="hd" data-copy="S12_headline"></div>
  <div id="shadow"></div>
  <div id="chair"></div>
  <div id="heart"></div>
  <div class="wipe" id="wipe"></div>
</div>
<script src="hf/parts/pg.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), $ = PG.$;
  $('#chair').innerHTML = PG.icon('chair', '#FFFFFF');
  $('#heart').innerHTML = PG.icon('heart', '#FF6B6B');
  const ch = $('#chair'), C = {x: ch.offsetLeft, y: ch.offsetTop, w: ch.clientWidth};
  PG.clock(tl, (t) => {
    PG.drift($('#dots'), t, 0, 6);
    const h = $('#heart'), k = PG.E(t, 0.6, 1.3);
    h.style.left = (C.x + C.w * 0.48 - 55) + 'px'; h.style.top = (C.y + C.w * 0.52 - 100 - (1 - k) * 200 + Math.sin(t * 1.6) * 4) + 'px'; h.style.opacity = PG.L(t, 0.6, 0.8);
    const wp = $('#wipe'); wp.style.left = (C.x + C.w * 0.5) + 'px'; wp.style.top = (C.y + C.w * 0.5) + 'px';
    PG.wipe(wp, t, PG.OUT - 0.55, PG.OUT - 0.15, 22);
  });
  PG.head(tl, $('#hd'), 0.3, {stagger: 0.09});
  S.arrive(tl, '#chair', 0.1, {dist: 30, blur: 0, dur: 0.7});
</script>
</body>
</html>
