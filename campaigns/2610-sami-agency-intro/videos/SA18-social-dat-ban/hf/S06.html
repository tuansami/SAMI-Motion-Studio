<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/nunito/900.css">
<link rel="stylesheet" href="_fonts/space-grotesk/700.css">
<link rel="stylesheet" href="hf/parts/pg.css">
<style>
  /* S06 · CHỮ KÝ 1: dải feed cuộn vô tận bị uốn cong thành cái phễu; tim rơi vào miệng phễu, ống đáy dẫn tới một bàn ăn đang chờ */
  #hd { top: 236px; text-align: center; font-size: 80px; }
  #cv { position: absolute; inset: 0; z-index: 4; }
  #table { position: absolute; z-index: 5; }
  #table .t { position: absolute; left: 25%; width: 50%; height: 100%; top: 0; }
  #table .c1, #table .c2 { position: absolute; width: 36%; height: 72%; top: 34%; }
  #table .c1 { left: -4%; } #table .c2 { right: -4%; transform: scaleX(-1); }
  #wipe { width: 200px; height: 200px; border-radius: 50%; background: var(--purple); }
  [data-ratio="16x9"] #hd { left: 120px; width: 800px; top: 330px; text-align: left; }
</style>
</head>
<body>
<div id="root" data-composition-id="S06" class="bg-navy">
  <div class="dots" id="dots"></div>
  <canvas id="cv"></canvas>
  <div id="table"><div class="c1" id="c1"></div><div class="c2" id="c2"></div><div class="t" id="tt"></div></div>
  <div class="hd" id="hd" data-copy="S06_headline"></div>
  <div class="wipe" id="wipe"></div>
</div>
<script src="hf/parts/pg.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), $ = PG.$;
  const ctx = PG.canvas($('#cv'));
  const L = S.pick({'9:16': {cx: 540, top: 720, H: 620, W0: 260, W1: 600, spout: 110, tbl: 170}, '16:9': {cx: 1400, top: 130, H: 620, W0: 260, W1: 560, spout: 110, tbl: 160}});
  $('#tt').innerHTML = PG.icon('table', '#E3E4F7'); $('#c1').innerHTML = PG.icon('chair', '#757AD6'); $('#c2').innerHTML = PG.icon('chair', '#757AD6');
  const tb = $('#table'), neckY = L.top + L.H, tY = neckY + L.spout - 10;
  tb.style.width = L.tbl * 1.6 + 'px'; tb.style.height = L.tbl + 'px'; tb.style.left = (L.cx - L.tbl * 0.8) + 'px'; tb.style.top = tY + 'px';
  const NH = 26, hearts = Array.from({length: NH}, (_, i) => ({a: 3.0 + i * 0.16, x0: (S.rnd(i + 7) - 0.5) * 1.6, dur: 0.9 + S.rnd(i + 30) * 0.3, c: i % 4 === 0 ? '#08DDA4' : '#FF6B6B'}));
  PG.clock(tl, (t) => {
    PG.drift($('#dots'), t);
    ctx.clearRect(0, 0, S.w, S.h);
    const k = PG.E(t, 1.5, 3.3);
    // cuộn: chậm (khớp cảnh trước) → nhanh dần
    const scroll = 120 * t + 900 * Math.max(0, t - 1.0) * Math.max(0, t - 1.0) * 0.5 / (1 + 0.15 * Math.max(0, t - 1));
    const W = PG.mix(L.W0, L.W1, k);
    const f = PG.funnel(ctx, {cx: L.cx, top: L.top, H: L.H, W, k, scroll, cardH: 300, gap: 20, colors: PG.FEED, wall: '#08DDA4', spout: L.spout});
    // tim rơi vào miệng phễu, trượt theo thành phễu xuống ống
    hearts.forEach((h) => {
      const d = t - h.a; if (d < 0) return;
      let x, y, s = 26;
      const fall = 0.32;
      if (d < fall) { const u = d / fall; x = L.cx + h.x0 * f.hw(0) * 0.8; y = L.top - 260 + 260 * u * u; }
      else { const u = Math.min(1.12, (d - fall) / h.dur); const uu = Math.min(1, u); x = L.cx + h.x0 * 0.8 * f.hw(uu); y = u <= 1 ? f.Y(uu) : neckY + (u - 1) / 0.12 * L.spout * 0.8; s = 26 * (0.6 + 0.4 * (1 - uu)); }
      const alpha = d - fall > h.dur * 1.12 ? 0 : 1;
      if (!alpha) return;
      ctx.globalAlpha = Math.min(1, d * 6); PG.heartPath(ctx, x, y, s); ctx.fillStyle = h.c; ctx.fill(); ctx.globalAlpha = 1;
    });
    // bàn chờ ở đáy ống
    const kt = PG.E(t, 2.6, 3.3); tb.style.opacity = kt; tb.style.transform = 'translateY(' + ((1 - kt) * 40).toFixed(1) + 'px)';
    const wp = $('#wipe'); wp.style.left = L.cx + 'px'; wp.style.top = (tY + L.tbl / 2) + 'px';
    PG.wipe(wp, t, PG.OUT - 0.65, PG.OUT - 0.15, 24);
  });
  PG.head(tl, $('#hd'), 0.5, {stagger: 0.06});
</script>
</body>
</html>
