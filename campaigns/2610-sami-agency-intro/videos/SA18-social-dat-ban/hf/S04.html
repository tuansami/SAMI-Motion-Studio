<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/nunito/900.css">
<link rel="stylesheet" href="_fonts/nunito/700.css">
<link rel="stylesheet" href="_fonts/space-grotesk/700.css">
<link rel="stylesheet" href="hf/parts/pg.css">
<style>
  /* S04 · câu đinh: tim rơi vào phong bì tiền nhà rồi lọt qua đáy; nhà · dao bếp · giỏ rau vẫn chờ */
  #hd { top: 236px; text-align: center; font-size: 100px; }
  #sub { top: 1250px; text-align: center; }
  #env { position: absolute; z-index: 4; left: 340px; top: 690px; width: 400px; height: 400px; }
  #envlab { position: absolute; z-index: 5; font: 700 46px/1 var(--f-ui); color: var(--mint); letter-spacing: .02em; }
  #slot { position: absolute; z-index: 6; height: 16px; border-radius: 8px; background: var(--navy); }
  .hf { position: absolute; z-index: 3; width: 74px; height: 74px; margin: -37px 0 0 -37px; }
  #icons { position: absolute; z-index: 4; left: 0; right: 0; top: 1090px; display: flex; justify-content: center; gap: 70px; }
  #icons .i { width: 110px; height: 110px; padding: 18px; border-radius: 30px; background: rgba(12, 6, 40, .1); }
  #wipe { left: 0; top: 0; width: 100%; height: 100%; transform: none; background: var(--lav); }
  [data-ratio="16x9"] #hd { left: 120px; width: 920px; top: 220px; text-align: left; font-size: 104px; }
  [data-ratio="16x9"] #sub { left: 120px; width: 860px; top: 640px; text-align: left; }
  [data-ratio="16x9"] #env { left: 1300px; top: 150px; width: 420px; height: 420px; }
  [data-ratio="16x9"] #icons { left: 1180px; right: auto; width: 660px; top: 640px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S04" class="bg-mint">
  <div class="dots" id="dots"></div>
  <div class="hd" id="hd" data-copy="S04_headline"></div>
  <div id="hfall"></div>
  <div id="env"></div>
  <div id="slot"></div>
  <div id="envlab" data-copy="S04_env"></div>
  <div id="icons"><div class="i" id="i1"></div><div class="i" id="i2"></div><div class="i" id="i3"></div></div>
  <div class="sub" id="sub" data-copy="S04_sub"></div>
  <div class="wipe" id="wipe"></div>
</div>
<script src="hf/parts/pg.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), $ = PG.$;
  $('#env').innerHTML = PG.icon('env', '#0C0628', '', '#08DDA4');
  $('#i1').innerHTML = PG.icon('house', '#0C0628', '', '#08DDA4');
  $('#i2').innerHTML = PG.icon('knife', '#0C0628');
  $('#i3').innerHTML = PG.icon('basket', '#0C0628', '', '#08DDA4');
  const NH = 14, hf = $('#hfall');
  for (let i = 0; i < NH; i++) { const d = document.createElement('div'); d.className = 'hf'; d.innerHTML = PG.icon('heart', i % 4 === 0 ? '#7667FE' : '#FF6B6B'); hf.appendChild(d); }
  const hs = PG.$$('.hf');
  const env = $('#env'), E0 = {x: env.offsetLeft, y: env.offsetTop, w: env.clientWidth};
  const lab = $('#envlab'); lab.style.left = (E0.x + E0.w / 2 - lab.offsetWidth / 2) + 'px'; lab.style.top = (E0.y + E0.w * 0.6) + 'px';
  const slot = $('#slot'); slot.style.left = (E0.x + E0.w * 0.2) + 'px'; slot.style.width = (E0.w * 0.6) + 'px'; slot.style.top = (E0.y + E0.w * 0.13) + 'px';
  PG.clock(tl, (t) => {
    PG.drift($('#dots'), t, 0, 10);
    // tim rơi vào khe phong bì (lớp sau), rồi rơi ra khỏi đáy: không đọng lại gì
    hs.forEach((h, i) => {
      const a = 0.5 + i * 0.42, k = t - a;
      const x = E0.x + E0.w * (0.32 + 0.36 * S.rnd(i + 3)), top = E0.y - 260, bottom = S.h + 120;
      const y = top + 0.5 * 2600 * Math.max(0, k) * Math.max(0, k);
      h.style.left = (x + Math.sin(k * 5 + i) * 10) + 'px'; h.style.top = Math.min(bottom, y) + 'px';
      const behind = y > E0.y + E0.w * 0.12 && y < E0.y + E0.w * 0.86;
      h.style.opacity = k > 0 && y < bottom ? (behind ? 0 : 1) * Math.min(1, k * 5) : 0;
      h.style.transform = 'rotate(' + ((S.rnd(i) - 0.5) * 50 + k * 60 * (i % 2 ? 1 : -1)).toFixed(1) + 'deg)';
    });
    // phong bì giật nhẹ mỗi khi tim chạm khe
    let kick = 0; for (let i = 0; i < NH; i++) { const a = 0.5 + i * 0.42 + Math.sqrt(2 * 260 / 2600); const d = t - a; if (d > 0 && d < 0.25) kick = Math.max(kick, 1 - d / 0.25); }
    const ke = PG.E(t, 0.2, 0.8); env.style.opacity = PG.L(t, 0.2, 0.35); env.style.transform = 'translateY(' + (kick * 10 + (1 - ke) * 50).toFixed(1) + 'px)';
    // quét lavender từ dưới lên
    const w = PG.E(t, PG.OUT - 0.65, PG.OUT - 0.15); $('#wipe').style.transform = 'translateY(' + ((1 - w) * 100).toFixed(2) + '%)'; $('#wipe').style.opacity = w > 0 ? 1 : 0;
  });
  PG.head(tl, $('#hd'), 0.35, {stagger: 0.08});
  S.arrive(tl, '#envlab', 0.4, {dist: 20, blur: 0, dur: 0.5});
  S.arrive(tl, '#icons .i', 2.4, {dist: 30, blur: 4, dur: 0.5, stagger: 0.15});
  PG.head(tl, $('#sub'), 2.9, {stagger: 0.05, dist: 20});
</script>
</body>
</html>
