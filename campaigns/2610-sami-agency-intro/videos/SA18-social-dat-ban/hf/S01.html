<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/nunito/900.css">
<link rel="stylesheet" href="_fonts/nunito/700.css">
<link rel="stylesheet" href="_fonts/space-grotesk/500.css">
<link rel="stylesheet" href="_fonts/space-grotesk/700.css">
<link rel="stylesheet" href="hf/parts/pg.css">
<style>
  /* S01 · hook: feed cuộn cực nhanh, bộ đếm lượt xem quay không ngừng, bộ đếm bàn đặt rơi xuống "0" và đứng chết; cuối cảnh đẩy xuyên màn hình */
  #hd { top: 236px; text-align: center; }
  #phone { left: 290px; top: 540px; width: 500px; height: 800px; }
  #feed { position: absolute; inset: 0; }
  .fc { position: absolute; left: 22px; right: 22px; height: 330px; background: #fff; border-radius: 26px; }
  .fc .ph { position: absolute; left: 16px; right: 16px; top: 16px; height: 220px; border-radius: 18px; }
  .fc .pl { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; }
  .fc .pl:after { content: ""; position: absolute; inset: 30px; border-radius: 50%; background: rgba(12, 6, 40, .14); }
  .fc .hr { position: absolute; left: 20px; bottom: 26px; width: 52px; height: 52px; }
  .fc .ln1 { position: absolute; left: 92px; bottom: 50px; width: 230px; height: 14px; border-radius: 7px; background: #D6D4EE; }
  .fc .ln2 { position: absolute; left: 92px; bottom: 26px; width: 150px; height: 14px; border-radius: 7px; background: #E9E8F7; }
  #floats { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  #floats svg { position: absolute; width: 64px; height: 64px; }
  #counters { position: absolute; z-index: 8; left: 64px; right: 64px; top: 1380px; display: flex; gap: 28px; }
  .ct { flex: 1; display: flex; align-items: center; gap: 20px; padding: 22px 26px; border-radius: 32px; background: #fff; color: var(--navy); }
  .ct .ic { width: 70px; height: 70px; flex: none; }
  .ct .lb { font: 700 28px/1.1 var(--f-ui); color: #6E6893; }
  .ct .num { font-size: 66px; color: var(--navy); margin-top: 4px; }
  #c2 { background: var(--coral); }
  #c2 .lb { color: rgba(12, 6, 40, .7); }
  #zero { display: inline-block; font: 700 66px/1 var(--f-ui); transform-origin: 50% 100%; }
  #demo { left: 64px; top: 1560px; }
  #push { position: absolute; z-index: 40; border-radius: 54px; background: var(--purple); opacity: 0; }
  [data-ratio="16x9"] #hd { left: 120px; width: 900px; top: 250px; text-align: left; font-size: 96px; }
  [data-ratio="16x9"] #phone { left: 1210px; top: 80px; width: 520px; height: 920px; }
  [data-ratio="16x9"] #counters { left: 120px; right: auto; width: 880px; top: 640px; }
  [data-ratio="16x9"] #demo { left: 120px; top: 840px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S01" class="bg-navy">
  <div class="dots" id="dots"></div>
  <div class="hd" id="hd" data-copy="S01_headline"></div>
  <div class="phone" id="phone"><div class="notch"></div><div id="feed"></div><div id="floats"></div></div>
  <div id="counters">
    <div class="ct" id="c1"><div class="ic" id="ic1"></div><div><div class="lb" data-copy="S01_views"></div><div class="num" id="views"></div></div></div>
    <div class="ct" id="c2"><div class="ic" id="ic2"></div><div><div class="lb" data-copy="S01_book"></div><div class="num"><span id="zero">0</span></div></div></div>
  </div>
  <div class="demo" id="demo" data-copy="S01_demo"></div>
  <div id="push"></div>
</div>
<script src="hf/parts/pg.js"></script>
<script>
  const S = window.SAMI, tl = S.timeline(), $ = PG.$;
  $('#ic1').innerHTML = PG.icon('eye', '#7667FE', '', '#fff');
  $('#ic2').innerHTML = PG.icon('cal', '#0C0628', '', '#FF6B6B');
  // feed: 6 thẻ lặp vòng
  const N = 6, pitch = 356, feed = $('#feed');
  for (let i = 0; i < N; i++) {
    const c = PG.FEED[i % 4], d = document.createElement('div'); d.className = 'fc';
    d.innerHTML = `<div class="ph" style="background:${c.photo}"><div class="pl" style="background:${c.plate}"></div></div><div class="hr">${PG.icon('heart', '#FF6B6B')}</div><div class="ln1"></div><div class="ln2"></div>`;
    feed.appendChild(d);
  }
  const cards = PG.$$('.fc');
  // tim bay lên
  const fl = $('#floats'), NF = 12;
  for (let i = 0; i < NF; i++) { const h = document.createElement('div'); h.innerHTML = PG.icon('heart', i % 3 ? '#FF6B6B' : '#08DDA4'); fl.appendChild(h.firstChild); }
  const hearts = PG.$$('#floats svg');
  const views = PG.odo($('#views'), 5, true);
  const PH = () => $('#phone').getBoundingClientRect();
  PG.clock(tl, (t) => {
    PG.drift($('#dots'), t);
    // cuộn: rất nhanh, chậm lại một chút khi chữ vào
    const scroll = t * 1500 - 380 * PG.E(t, 1.0, 2.2) * (t - 1.0 > 0 ? 1 : 0);
    const H = $('#phone').clientHeight;
    cards.forEach((c, i) => { let y = ((i * pitch - scroll) % (N * pitch) + N * pitch) % (N * pitch) - pitch + 60; c.style.transform = 'translateY(' + y.toFixed(1) + 'px)'; c.style.filter = 'blur(' + (2.2).toFixed(1) + 'px)'; });
    hearts.forEach((h, i) => {
      const per = 1.6 + S.rnd(i) * 0.9, ph = ((t + S.rnd(i + 20) * per) % per) / per;
      const x = 40 + S.rnd(i + 40) * ($('#phone').clientWidth - 120), y = H - 60 - ph * (H + 40);
      h.style.transform = 'translate(' + (x + Math.sin(ph * 6 + i) * 18).toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + (0.6 + 0.6 * Math.sin(Math.PI * ph)).toFixed(3) + ')';
      h.style.opacity = (Math.sin(Math.PI * ph) * 0.95).toFixed(3);
    });
    // lượt xem: trống số quay liên tục, không dừng ở số nào (nhòe theo tốc độ)
    views(12000 + t * 7357 + t * t * 900, [7, 5.5, 4.5, 3.5, 3]);
    // "0" rơi xuống, đập, nằm im
    const k = PG.E(t, 0.5, 1.0);
    const squash = 1 - 0.22 * Math.max(0, 1 - Math.abs(t - 0.78) / 0.12);
    $('#zero').style.transform = 'translateY(' + ((1 - k) * -120).toFixed(1) + 'px) scale(' + (1 + (1 - squash) * 0.6).toFixed(3) + ',' + squash.toFixed(3) + ')';
    $('#zero').style.opacity = PG.L(t, 0.5, 0.62);
    // đẩy xuyên màn hình (sang nền tím của S02)
    const a = PG.OUT - 0.75, b = PG.OUT - 0.2, kp = PG.E(t, a, b);
    const r = {l: $('#phone').offsetLeft + 10, t: $('#phone').offsetTop + 10, w: $('#phone').clientWidth, h: $('#phone').clientHeight};
    const p = $('#push');
    p.style.opacity = PG.L(t, a, a + 0.12);
    const W = S.w * 1.1, Hh = S.h * 1.1;
    const cxp = r.l + r.w / 2, cyp = r.t + r.h / 2;
    const w = PG.mix(r.w, W * 1.4, kp), h = PG.mix(r.h, Hh * 1.4, kp);
    p.style.left = (PG.mix(cxp, S.w / 2, kp) - w / 2) + 'px'; p.style.top = (PG.mix(cyp, S.h / 2, kp) - h / 2) + 'px'; p.style.width = w + 'px'; p.style.height = h + 'px';
    $('#phone').style.transform = 'scale(' + (1 + 0.9 * kp).toFixed(3) + ')';
  });
  S.arrive(tl, '#c1', 0.15, {dist: 40, blur: 6, dur: 0.5});
  S.arrive(tl, '#c2', 0.35, {dist: 40, blur: 6, dur: 0.5});
  PG.head(tl, $('#hd'), 1.0);
  S.arrive(tl, '#demo', 1.4, {dist: 10, blur: 4});
</script>
</body>
</html>
