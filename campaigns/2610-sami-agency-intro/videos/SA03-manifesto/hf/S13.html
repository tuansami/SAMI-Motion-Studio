<!doctype html>
<html>
<head>
<link rel="stylesheet" href="_fonts/inter/500.css">
<link rel="stylesheet" href="_fonts/inter/600.css">
<link rel="stylesheet" href="_fonts/inter/700.css">
<link rel="stylesheet" href="_fonts/inter/800.css">
<link rel="stylesheet" href="_fonts/inter/900.css">
<link rel="stylesheet" href="hf/parts/sk.css">
<style>
  /* S13 · bức tường danh mục: lưới tách thành ô bằng nhau, ảnh bìa 14 khách hàng tại Đức wipe vào theo khoảng cách từ ô tím "14"; camera kéo ra nhẹ. Chỉ tên + thành phố, không gán dịch vụ. */
  #head { left: var(--m); top: 262px; font-size: 70px; line-height: 1.12; }
  #wall { position: absolute; z-index: 4; transform-origin: 0 0; }
  .cell { position: absolute; overflow: hidden; background: var(--rule); }
  .cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cell .lab { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px 9px; background: var(--paper); font: 700 21px/1.15 var(--f); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; }
  .cell .lab span { display: block; font-weight: 500; font-size: 19px; color: var(--ink2); }
  .cell.big { background: var(--sig); color: #fff; padding: 14px 20px; }
  .cell.big b { display: block; font: 900 96px/.9 var(--f); letter-spacing: -.06em; }
  .cell.big span { display: block; font: 700 25px/1.12 var(--f); margin-top: 6px; }
  #note { position: absolute; z-index: 5; left: var(--m); top: 1556px; font: 500 22px/1.2 var(--f); color: var(--grey); }
  [data-ratio="16x9"] #head { top: 150px; font-size: 84px; width: 800px; }
  [data-ratio="16x9"] #note { top: 1000px; left: 972px; }
  [data-ratio="16x9"] .cell.big b { font-size: 100px; }
</style>
</head>
<body>
<div id="root" data-composition-id="S13">
  <div class="hd" id="head" data-copy="S13_head"></div>
  <div id="wall"></div>
  <div id="note" data-copy="S13_note"></div>
</div>
<script src="hf/parts/sk.js"></script>
<script>
  const S = window.SAMI, K = SK.init(2125), tl = S.timeline(), $ = K.$, B = K.b;
  K.grid(); K.chrome();
  ['#head', '#note'].forEach(K.bind);
  const PF = [['mizuki', 'Mizuki', 'Baden-Baden'], ['vi', 'Vị Vietnamese Cuisine', 'Schliersee'], ['an', 'An Vegan', 'Karlsruhe'], ['84', '+84 Kitchen', 'Kempten'],
    ['68', '68 Nail & Spa', 'Mannheim'], ['mamacook', 'Mama Cook', 'Berlin'], ['galbi', 'Galbi House', 'Berlin'], ['chumsen', 'Chum Sen', 'Recklinghausen'],
    ['shibuya', '26 Shibuya', 'Berlin'], ['n14', 'N14 Restaurant', 'Stuttgart'], ['kai', 'Kai Maison', 'Berlin'], ['tsukiji', 'Tsukiji', 'Köln'], ['moonlight', 'Moonlight', 'München'], ['vinrice', 'Vinrice', 'Erfurt']];
  // lưới tường: 9:16 = 3 × 5 · 16:9 = 5 × 3; ô 0 = ô tím "14"
  const C = K.P ? 3 : 5, R = K.P ? 5 : 3, gx = 16;
  const W0 = K.P ? K.cw(6) : K.cw(6), H0 = K.P ? 880 : 840;
  const X0 = K.P ? K.M : K.cx(6), Y0 = K.P ? 650 : 150;
  const cw = (W0 - (C - 1) * gx) / C, ch = (H0 - (R - 1) * gx) / R;
  const wall = $('#wall'); wall.style.left = X0 + 'px'; wall.style.top = Y0 + 'px'; wall.style.width = W0 + 'px'; wall.style.height = H0 + 'px';
  const cells = [];
  for (let i = 0; i < C * R; i++) {
    const c = document.createElement('div'); c.className = 'cell';
    const x = (i % C) * (cw + gx), y = Math.floor(i / C) * (ch + gx);
    c.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + cw + 'px;height:' + ch + 'px';
    if (i === 0) { c.classList.add('big'); c.innerHTML = '<b>14</b><span>khách hàng<br>tại Đức</span>'; }
    else { const p = PF[i - 1]; c.innerHTML = '<img src="public/img/pf/' + p[0] + '.jpg"><div class="lab">' + p[1].replace(/&/g, '&amp;') + '<span>' + p[2] + '</span></div>'; }
    wall.appendChild(c); cells.push({c, d: Math.hypot(x, y)});
  }
  // ô tím trước, rồi các ô theo khoảng cách (ripple)
  const maxd = Math.max(...cells.map((o) => o.d));
  cells.forEach((o, i) => {
    const at = B(0.3) + (i === 0 ? 0 : 0.35 + (o.d / maxd) * 1.6);
    tl.fromTo(o.c, {clipPath: 'inset(0 0 100% 0)'}, {clipPath: 'inset(0 0 0% 0)', duration: 0.45, ease: S.EASE}, at);
  });
  K.reveal(tl, '#head', B(0.8), {stagger: 0.12});
  tl.fromTo('#note', {opacity: 0}, {opacity: 1, duration: 0.4}, B(5));
  // kéo ra nhẹ (tường hơi lớn → đúng khung)
  tl.fromTo(wall, {scale: 1.06}, {scale: 1, duration: 5, ease: S.EASE}, B(0));
  K.run(tl);
</script>
</body>
</html>
